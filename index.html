<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>🔴 البث المباشر - MOUSE AI</title>
    <meta name="description" content="شاهد البث المباشر الآن من MOUSE AI" />
    
    <!-- ============================================================ -->
    <!--   وسوم X Player Card - المفتاح لعرض الفيديو داخل التغريدة      -->
    <!-- ============================================================ -->
    
    <!-- 1. نوع البطاقة: يجب أن تكون "player" (هذا هو السر) -->
    <meta name="twitter:card" content="player" />
    
    <!-- 2. حسابك على X -->
    <meta name="twitter:site" content="@mouse0000000" />
    
    <!-- 3. عنوان البث (سيظهر أسفل الفيديو في التغريدة) -->
    <meta name="twitter:title" content="🔴 البث المباشر - MOUSE AI" />
    
    <!-- 4. وصف مختصر للبث (أقل من 200 حرف) -->
    <meta name="twitter:description" content="شاهد البث المباشر الآن - محتوى تقني حصري" />
    
    <!-- 5. رابط مشغل الفيديو (مصدر البث - يجب أن يكون HTTPS) -->
    <!--    هنا تضع رابط صفحة البث نفسها أو رابط التضمين من فيسبوك/Dailymotion -->
    <meta name="twitter:player" content="https://mouse-ai-live.netlify.app/live.html" />
    
    <!-- 6. أبعاد مشغل الفيديو -->
    <meta name="twitter:player:width" content="560" />
    <meta name="twitter:player:height" content="429" />
    
    <!-- 7. صورة مصغرة للبث (تظهر إذا لم يعمل المشغل) -->
    <meta name="twitter:image" content="https://mouse-ai-live.netlify.app/live-thumbnail.jpg" />
    
    <!-- ============================================================ -->
    <!--   وسوم Open Graph لمنصات أخرى (فيسبوك، واتساب، ...)          -->
    <!-- ============================================================ -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🔴 البث المباشر - MOUSE AI" />
    <meta property="og:description" content="شاهد البث المباشر الآن من MOUSE AI" />
    <meta property="og:image" content="https://mouse-ai-live.netlify.app/live-thumbnail.jpg" />
    <meta property="og:video" content="https://mouse-ai-live.netlify.app/live.html" />
    <meta property="og:video:width" content="560" />
    <meta property="og:video:height" content="429" />
    
    <style>
        /* تصميم الصفحة - اختياري */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 30% 10%, #05315c, #010612 75%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 2px solid rgba(255,0,0,0.3);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .live-badge {
            display: inline-block;
            background: #ff0000;
            color: #fff;
            padding: 4px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            animation: pulse 1.5s ease-in-out infinite;
            margin-bottom: 15px;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: #000;
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            margin-top: 15px;
            color: #00d9ff;
        }
        .description {
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="live-badge">🔴 بث مباشر</div>
        <div class="video-wrapper">
            <!-- هنا ضع كود التضمين من فيسبوك أو Dailymotion أو أي مصدر بث -->
            <iframe 
                src="https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2Feptv.dz%2Fvideos%2F1542336614253892%2F&show_text=true&width=560&t=0"
                allowfullscreen="true"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
            </iframe>
        </div>
        <div class="title">🎥 البث المباشر - MOUSE AI</div>
        <div class="description">شاهد البث المباشر الآن من MOUSE AI - محتوى تقني حصري</div>
    </div>
</body>
</html>
