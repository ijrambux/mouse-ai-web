<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐭м𝓞𝓊ŜⒺ AI - توليد فيديوهات احترافية</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* ===== خلفية النجوم المتساقطة ===== */
        #stars-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ===== تأثير النار الأزرق الملتهب حول الشعار ===== */
        .logo-wrapper {
            position: relative;
            display: inline-block;
        }

        .logo {
            font-size: 48px;
            font-weight: 800;
            display: inline-block;
            background: linear-gradient(90deg, #00d4ff, #0077ff, #a855f7, #00d4ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease-in-out infinite, float 3s ease-in-out infinite;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
            position: relative;
            z-index: 2;
        }

        /* ===== نار أزرق ملتهب ===== */
        .fire-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            z-index: 1;
            pointer-events: none;
            filter: blur(2px);
        }

        .fire-particle {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 180, 255, 0.8), rgba(0, 100, 255, 0.2));
            animation: fireRise 1.5s ease-out infinite;
            opacity: 0;
        }

        .fire-particle:nth-child(1) { width: 30px; height: 30px; left: 30%; animation-delay: 0s; }
        .fire-particle:nth-child(2) { width: 20px; height: 20px; left: 50%; animation-delay: 0.3s; }
        .fire-particle:nth-child(3) { width: 25px; height: 25px; left: 70%; animation-delay: 0.6s; }
        .fire-particle:nth-child(4) { width: 15px; height: 15px; left: 20%; animation-delay: 0.9s; }
        .fire-particle:nth-child(5) { width: 35px; height: 35px; left: 60%; animation-delay: 0.2s; }
        .fire-particle:nth-child(6) { width: 18px; height: 18px; left: 40%; animation-delay: 0.7s; }
        .fire-particle:nth-child(7) { width: 28px; height: 28px; left: 80%; animation-delay: 0.4s; }
        .fire-particle:nth-child(8) { width: 22px; height: 22px; left: 10%; animation-delay: 0.8s; }
        .fire-particle:nth-child(9) { width: 32px; height: 32px; left: 90%; animation-delay: 0.1s; }
        .fire-particle:nth-child(10) { width: 16px; height: 16px; left: 45%; animation-delay: 0.5s; }

        @keyframes fireRise {
            0% {
                transform: translateY(20px) scale(0.3) rotate(0deg);
                opacity: 0;
            }
            30% {
                opacity: 0.9;
                transform: translateY(-20px) scale(1.2) rotate(20deg);
            }
            60% {
                opacity: 0.6;
                transform: translateY(-60px) scale(0.8) rotate(-10deg);
            }
            100% {
                transform: translateY(-120px) scale(0) rotate(30deg);
                opacity: 0;
            }
        }

        /* ===== وهج إضافي ===== */
        .glow-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 150, 255, 0.15), transparent 70%);
            animation: pulseGlow 2s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes pulseGlow {
            0%, 100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* ===== باقي التنسيقات ===== */
        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 45px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            resize: vertical;
            font-family: inherit;
            min-height: 80px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.05), inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea::placeholder {
            color: #555;
        }

        /* ===== OPTIONS ===== */
        .options-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .option-group {
            flex: 1;
            min-width: 130px;
        }
        .option-group .option-label {
            display: block;
            font-size: 13px;
            color: #888;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .option-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .opt-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            color: #777;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .opt-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #ccc;
        }
        .opt-btn.active {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .opt-btn .sub {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            font-weight: 400;
        }

        /* ===== GENERATE BUTTON ===== */
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 119, 255, 0.12));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 18px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            margin-top: 8px;
        }
        .generate-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 119, 255, 0.2));
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.1);
        }
        .generate-btn:active {
            transform: translateY(0px);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .generate-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .generate-btn.loading .spinner {
            display: block;
        }
        .generate-btn.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== VIDEO RESULT ===== */
        .result-wrapper {
            margin-top: 24px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            position: relative;
        }
        .result-wrapper.show {
            display: block;
            animation: fadeSlide 0.5s ease-out;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-wrapper video {
            width: 100%;
            display: block;
            border-radius: 18px 18px 0 0;
        }
        .result-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-controls .result-label {
            font-size: 13px;
            color: #00d4ff;
            font-weight: 600;
        }
        .result-controls .result-label span {
            opacity: 0.5;
            font-weight: 400;
            color: #888;
        }
        .download-btn {
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 119, 255, 0.15));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 119, 255, 0.25));
            border-color: rgba(0, 212, 255, 0.4);
            transform: scale(1.02);
        }
        .download-btn:active {
            transform: scale(0.98);
        }

        /* ===== LOG ===== */
        .log-box {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 150px;
            overflow-y: auto;
        }
        .log-box .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #666;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .log-box .log-entry .time {
            color: #444;
            margin-right: 10px;
        }
        .log-box .log-entry.success {
            color: #00d4ff;
        }
        .log-box .log-entry.error {
            color: #ff6b6b;
        }
        .log-box .log-entry.info {
            color: #88ccff;
        }
        .log-box::-webkit-scrollbar {
            width: 4px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .footer .copyright {
            color: #555;
            font-size: 13px;
        }
        .footer .social-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        .footer .social-link:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 212, 255, 0.3);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
        }
        .footer .social-link svg {
            width: 18px;
            height: 18px;
            fill: #ccc;
            transition: fill 0.3s ease;
        }
        .footer .social-link:hover svg {
            fill: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 24px; }
            .logo { font-size: 32px; }
            .options-row { flex-direction: column; gap: 16px; }
            .result-controls { flex-direction: column; align-items: stretch; }
            .download-btn { justify-content: center; }
            .footer { flex-direction: column; gap: 12px; }
            .fire-container { width: 150px; height: 150px; }
            .glow-ring { width: 140px; height: 140px; }
        }
    </style>
</head>
<body>

    <!-- ===== خلفية النجوم ===== -->
    <canvas id="stars-canvas"></canvas>

    <div class="container" id="app">

    <script>
        // ============================================================
        //  ⭐ خلفية النجوم المتساقطة
        // ============================================================
        (function() {
            const canvas = document.getElementById('stars-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let stars = [];
            const NUM_STARS = 150;
            const MAX_SPEED = 2;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            // تهيئة النجوم
            class Star {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speed = Math.random() * MAX_SPEED + 0.3;
                    this.opacity = Math.random() * 0.8 + 0.2;
                    this.trail = [];
                    this.maxTrail = 5 + Math.floor(Math.random() * 8);
                    this.hue = 200 + Math.random() * 40; // أزرق إلى أزرق فاتح
                    this.pulse = Math.random() * Math.PI * 2;
                    this.pulseSpeed = 0.02 + Math.random() * 0.03;
                }
                update() {
                    this.y += this.speed;
                    this.pulse += this.pulseSpeed;

                    // إضافة أثر (ذيل)
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > this.maxTrail) {
                        this.trail.shift();
                    }

                    // إعادة تعيين عند الخروج
                    if (this.y > height + 20) {
                        this.reset();
                        this.y = -10;
                        this.x = Math.random() * width;
                    }
                }
                draw() {
                    // رسم الذيل
                    for (let i = 0; i < this.trail.length; i++) {
                        const t = this.trail[i];
                        const alpha = (i / this.trail.length) * this.opacity * 0.5;
                        const size = (i / this.trail.length) * this.size * 0.6;
                        ctx.beginPath();
                        ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
                        ctx.fillStyle = `hsla(${this.hue}, 100%, 70%, ${alpha})`;
                        ctx.fill();
                    }

                    // رسم النجمة الأساسية مع وميض
                    const glow = 0.6 + 0.4 * Math.sin(this.pulse);
                    const radius = this.size * glow;

                    // توهج خارجي
                    const gradient = ctx.createRadialGradient(
                        this.x, this.y, 0,
                        this.x, this.y, radius * 6
                    );
                    gradient.addColorStop(0, `hsla(${this.hue}, 100%, 80%, ${this.opacity * 0.8})`);
                    gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 60%, ${this.opacity * 0.3})`);
                    gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius * 6, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // النواة
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, ${this.opacity})`;
                    ctx.fill();

                    // توهج أبيض في المركز
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, radius * 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.6})`;
                    ctx.fill();
                }
            }

            // إنشاء النجوم
            for (let i = 0; i < NUM_STARS; i++) {
                stars.push(new Star());
            }

            // حلقة الرسم
            function animate() {
                ctx.clearRect(0, 0, width, height);

                // خلفية سوداء شفافة للتأثيرات
                ctx.fillStyle = 'rgba(10, 10, 20, 0.1)';
                ctx.fillRect(0, 0, width, height);

                stars.forEach(star => {
                    star.update();
                    star.draw();
                });

                requestAnimationFrame(animate);
            }

            animate();

            // إعادة تعيين النجوم عند تغيير الحجم
            window.addEventListener('resize', () => {
                stars.forEach(star => {
                    star.x = Math.random() * width;
                    star.y = Math.random() * height;
                });
            });
        })();

        // ============================================================
        //  🎬 باقي الكود (توليد الفيديو)
        // ============================================================
        (function() {
            'use strict';

            const promptInput = document.getElementById('promptInput');
            const generateBtn = document.getElementById('generateBtn');
            const logBox = document.getElementById('logBox');
            const durationBtns = document.querySelectorAll('#durationGroup .opt-btn');
            const aspectBtns = document.querySelectorAll('#aspectGroup .opt-btn');
            const resultWrapper = document.getElementById('resultWrapper');
            const videoPlayer = document.getElementById('videoPlayer');
            const downloadBtn = document.getElementById('downloadBtn');

            let isGenerating = false;
            let selectedDuration = '10';
            let selectedAspect = '16:9';
            let currentResultBlobUrl = null;
            const API_BASE = 'https://mouse-ai-nine.vercel.app';

            function addLog(message, type = 'info') {
                const entry = document.createElement('div');
                entry.className = `log-entry ${type}`;
                const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
                logBox.appendChild(entry);
                logBox.scrollTop = logBox.scrollHeight;
            }

            function resetButton() {
                generateBtn.classList.remove('loading');
                generateBtn.disabled = false;
                generateBtn.querySelector('.btn-text').textContent = '🚀 توليد الفيديو';
            }

            function setLoading() {
                generateBtn.classList.add('loading');
                generateBtn.disabled = true;
            }

            function showResult(url) {
                currentResultBlobUrl = url;
                videoPlayer.src = url;
                resultWrapper.classList.add('show');
                videoPlayer.play().catch(() => {});
                addLog('✅ الفيديو جاهز للمشاهدة والتحميل', 'success');
            }

            downloadBtn.addEventListener('click', function() {
                if (!currentResultBlobUrl) {
                    addLog('❌ لا يوجد فيديو للتحميل. قم بالتوليد أولاً.', 'error');
                    return;
                }
                const a = document.createElement('a');
                a.href = currentResultBlobUrl;
                a.download = `MoUsE_AI_video_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.mp4`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                addLog('⬇️ بدء تحميل الفيديو...', 'info');
            });

            function setupOptionButtons(buttons, callback) {
                buttons.forEach(btn => {
                    btn.addEventListener('click', function() {
                        buttons.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        callback(this.dataset.value);
                    });
                });
            }

            setupOptionButtons(durationBtns, (value) => {
                selectedDuration = value;
                addLog(`⚙️ المدة: ${value} ثوان`, 'info');
            });

            setupOptionButtons(aspectBtns, (value) => {
                selectedAspect = value;
                addLog(`⚙️ نسبة الأبعاد: ${value}`, 'info');
            });

            generateBtn.addEventListener('click', async function() {
                if (isGenerating) return;

                const prompt = promptInput.value.trim();
                if (!prompt || prompt.length < 5) {
                    addLog('❌ الرجاء إدخال وصف (5 أحرف على الأقل)', 'error');
                    return;
                }

                isGenerating = true;
                setLoading();
                resultWrapper.classList.remove('show');
                videoPlayer.src = '';
                currentResultBlobUrl = null;

                addLog(`🚀 بدء توليد فيديو من نص...`, 'info');
                addLog(`📝 البرومبت: ${prompt.substring(0, 60)}...`, 'info');

                try {
                    const formData = new FormData();
                    formData.append('prompt', prompt);
                    formData.append('mode', 'video');
                    formData.append('duration', selectedDuration);
                    formData.append('aspect', selectedAspect);

                    const response = await fetch(`${API_BASE}/generate`, {
                        method: 'POST',
                        body: formData,
                        signal: AbortSignal.timeout(310000)
                    });

                    if (response.ok) {
                        const blob = await response.blob();
                        const url = window.URL.createObjectURL(blob);
                        showResult(url);
                    } else {
                        let errorMsg = `خطأ ${response.status}`;
                        try {
                            const errData = await response.json();
                            if (errData.detail) errorMsg += `: ${errData.detail}`;
                            else if (errData.message) errorMsg += `: ${errData.message}`;
                        } catch (e) {
                            const text = await response.text();
                            if (text) errorMsg += `: ${text.substring(0, 100)}`;
                        }
                        addLog(`❌ فشل التوليد: ${errorMsg}`, 'error');
                    }
                } catch (err) {
                    if (err.name === 'TimeoutError' || err.name === 'AbortError') {
                        addLog('❌ انتهى الوقت. الخادم مشغول، حاول مرة أخرى.', 'error');
                    } else {
                        addLog(`❌ خطأ: ${err.message}`, 'error');
                    }
                } finally {
                    isGenerating = false;
                    resetButton();
                    addLog('⏳ جاهز لتوليد جديد', 'info');
                }
            });

            async function checkServer() {
                try {
                    const res = await fetch(`${API_BASE}/status`, { signal: AbortSignal.timeout(5000) });
                    if (res.ok) addLog('✅ الخادم متصل', 'success');
                    else addLog('⚠️ الخادم يستجيب بشكل غير متوقع', 'error');
                } catch {
                    addLog('❌ الخادم غير متاح', 'error');
                }
            }
            setTimeout(checkServer, 1000);

            addLog('', 'info');
            addLog(`⏱️ المدة: ${selectedDuration} ثانية | 📐 نسبة الأبعاد: ${selectedAspect}`, 'info');
        })();
    </script>
</body>
</html>
