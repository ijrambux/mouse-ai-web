<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOUSE AI - المدونة</title>
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #05315c, #010612 75%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* === خلفية النجوم === */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 15px #00cfff, 0 0 30px #00cfff;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translate(-200px, 110vh);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* === الهيدر === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: transparent;
            background: linear-gradient(90deg, #fff, #bff8ff, #00d9ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: water 5s linear infinite;
            filter: drop-shadow(0 0 15px #00cfff);
            user-select: none;
            cursor: pointer;
        }

        @keyframes water {
            to {
                background-position: 300% 0;
            }
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 2px solid rgba(0, 191, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: #00bfff;
            border-color: #00bfff;
            color: #010612;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00bfff, #008cff);
            border-color: transparent;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #00d9ff, #00bfff);
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.4);
        }

        /* === عرض المقالات === */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .post-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 191, 255, 0.15);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .post-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 191, 255, 0.4);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        .post-card .post-media {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: rgba(0, 191, 255, 0.1);
        }

        .post-card .post-content {
            padding: 20px;
        }

        .post-card .post-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .post-card .post-excerpt {
            color: #aac8e0;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .post-card .post-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
        }

        .post-card .post-tags {
            color: #00d9ff;
            font-size: 12px;
        }

        /* === Modal === */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: radial-gradient(circle at top, #05315c, #010612 70%);
            border: 2px solid rgba(0, 191, 255, 0.3);
            border-radius: 24px;
            max-width: 800px;
            width: 100%;
            padding: 40px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-content .close-modal {
            position: sticky;
            top: 0;
            float: left;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content .close-modal:hover {
            background: #ff3333;
            transform: rotate(90deg);
        }

        .modal-content .modal-media {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
            border-radius: 12px;
            margin: 15px 0;
        }

        .modal-content .modal-title {
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0 10px;
            color: #00d9ff;
        }

        .modal-content .modal-body {
            font-size: 18px;
            line-height: 2.2;
            color: #e8f4ff;
            white-space: pre-wrap;
        }

        .modal-content .modal-comments {
            margin-top: 25px;
            border-top: 1px solid rgba(0, 191, 255, 0.2);
            padding-top: 20px;
        }

        .modal-content .modal-comments h3 {
            color: #00d9ff;
            margin-bottom: 15px;
        }

        .modal-content .modal-comments .comment-form textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 191, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
            margin-bottom: 10px;
        }

        .modal-content .modal-comments .comment-form textarea:focus {
            outline: none;
            border-color: #00d9ff;
        }

        .comment-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 191, 255, 0.1);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 12px;
        }

        .comment-item .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
            gap: 5px;
        }

        .comment-item .comment-author {
            font-weight: 700;
            color: #00d9ff;
        }

        .comment-item .comment-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        .comment-item .comment-body {
            color: #e8f4ff;
            line-height: 1.8;
        }

        .comment-item .comment-reply {
            background: rgba(0, 191, 255, 0.05);
            border-radius: 12px;
            padding: 12px;
            margin-top: 10px;
            border-right: 3px solid #00d9ff;
        }

        .comment-item .comment-reply .reply-author {
            color: #00d9ff;
            font-weight: 600;
        }

        /* === Empty State === */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255, 255, 255, 0.3);
            grid-column: 1/-1;
        }

        .empty-state .empty-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 10px;
        }

        /* === Footer === */
        .footer {
            text-align: center;
            padding: 30px 0 10px;
            border-top: 1px solid rgba(0, 191, 255, 0.1);
            margin-top: 40px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        /* === Toast === */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: rgba(0, 191, 255, 0.2);
            border: 1px solid #00bfff;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: #fff;
            font-weight: 500;
            z-index: 2000;
            animation: slideUp 0.5s ease;
            display: none;
        }

        .toast.show {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === X Icon === */
        .x-icon-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
        }

        .x-icon-small svg {
            width: 14px;
            height: 14px;
            fill: #010612;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .header-actions {
                justify-content: center;
            }
            .posts-grid {
                grid-template-columns: 1fr;
            }
            .modal-content {
                padding: 25px;
            }
            .modal-content .modal-title {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .btn {
                padding: 8px 16px;
                font-size: 13px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00bfff, #008cff);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #00d9ff;
        }
    </style>
</head>
<body>

    <!-- ===== النجوم ===== -->
    <div id="stars"></div>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="container">

        <!-- ===== الهيدر ===== -->
        <header class="header">
            <div class="logo" onclick="location.reload()">🐭 MOUSE AI</div>
            <div class="header-actions">
                <a href="admin.html" class="btn btn-primary" target="_blank">🔑 لوحة الإدارة</a>
                <button class="btn" onclick="window.open('https://x.com/mouse0000000','_blank')">
                    <span class="x-icon-small">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                        </svg>
                    </span>
                    X
                </button>
            </div>
        </header>

        <!-- ===== عرض المقالات ===== -->
        <div class="posts-grid" id="postsGrid"></div>

        <!-- ===== التذييل ===== -->
        <div class="footer">
            <p>🐭 MOUSE AI • 2026 • جميع الحقوق محفوظة</p>
        </div>
    </div>

    <!-- ===== Modal ===== -->
    <div class="modal-overlay" id="postModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="closeModal()">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== توليد النجوم =====
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3.5 + 1.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = (Math.random() * -1000) + 'px';
            star.style.animationDuration = (5 + Math.random() * 7) + 's';
            star.style.animationDelay = (Math.random() * 10) + 's';
            star.style.opacity = 0.4 + Math.random() * 0.6;
            starsContainer.appendChild(star);
        }

        // ===== البيانات =====
        let posts = [];
        let comments = [];

        // ===== تحميل البيانات =====
        function loadData() {
            try {
                const p = localStorage.getItem('mouse_posts');
                if (p) posts = JSON.parse(p);

                const c = localStorage.getItem('mouse_comments');
                if (c) comments = JSON.parse(c);
            } catch (e) {
                posts = [];
                comments = [];
            }
            renderPosts();
        }

        // ===== حفظ البيانات =====
        function saveData() {
            localStorage.setItem('mouse_posts', JSON.stringify(posts));
            localStorage.setItem('mouse_comments', JSON.stringify(comments));
        }

        // ===== عرض المقالات =====
        function renderPosts() {
            const grid = document.getElementById('postsGrid');
            if (posts.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3>لا توجد مقالات بعد</h3>
                        <p style="color: rgba(255,255,255,0.2);">تابعنا للمزيد من المحتوى</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = posts.map((post, index) => {
                const mediaHtml = post.mediaType === 'image' && post.mediaUrl ?
                    `<img src="${post.mediaUrl}" alt="${post.title}" class="post-media" loading="lazy" />` :
                    post.mediaType === 'video' && post.mediaUrl ?
                    `<video class="post-media" controls><source src="${post.mediaUrl}" /></video>` :
                    '';

                const tagsHtml = post.tags ?
                    `<span class="post-tags">#${post.tags.split(',').map(t => t.trim()).join(' #')}</span>` :
                    '';

                const commentCount = comments.filter(c => c.postId === post.id && !c.parentId).length;

                return `
                    <div class="post-card" onclick="viewPost(${index})">
                        ${mediaHtml}
                        <div class="post-content">
                            <div class="post-title">${post.title}</div>
                            <div class="post-excerpt">${post.body.substring(0, 120)}${post.body.length > 120 ? '...' : ''}</div>
                            ${tagsHtml}
                            <div class="post-meta">
                                <span>📅 ${post.date}</span>
                                <span>💬 ${commentCount}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== عرض مقال في Modal =====
        function viewPost(index) {
            const post = posts[index];
            if (!post) return;

            // زيادة المشاهدات
            post.views = (post.views || 0) + 1;
            saveData();

            const modal = document.getElementById('postModal');
            const content = document.getElementById('modalContent');

            const mediaHtml = post.mediaType === 'image' && post.mediaUrl ?
                `<img src="${post.mediaUrl}" alt="${post.title}" class="modal-media" />` :
                post.mediaType === 'video' && post.mediaUrl ?
                `<video class="modal-media" controls autoplay><source src="${post.mediaUrl}" /></video>` :
                '';

            const tagsHtml = post.tags ?
                `<p style="color: #00d9ff; font-size: 14px;">#${post.tags.split(',').map(t => t.trim()).join(' #')}</p>` :
                '';

            const postComments = comments.filter(c => c.postId === post.id && !c.parentId);

            content.innerHTML = `
                ${mediaHtml}
                <div class="modal-title">${post.title}</div>
                <div style="color: rgba(255,255,255,0.3); font-size: 14px; margin-bottom: 15px;">
                    📅 ${post.date} • 👁️ ${post.views || 0} مشاهدة
                </div>
                ${tagsHtml}
                <div class="modal-body">${post.body}</div>

                <div class="modal-comments">
                    <h3>💬 التعليقات (${postComments.length})</h3>
                    <div class="comment-form">
                        <textarea id="commentText" placeholder="اكتب تعليقك..."></textarea>
                        <button class="btn" style="border-color:#00bfff;color:#00d9ff;background:transparent;" onclick="submitComment(${index})">إرسال التعليق</button>
                    </div>

                    ${postComments.map(c => `
                        <div class="comment-item">
                            <div class="comment-header">
                                <span class="comment-author">${c.author}</span>
                                <span class="comment-date">${c.date}</span>
                            </div>
                            <div class="comment-body">${c.body}</div>

                            ${comments.filter(r => r.parentId === c.id).map(r => `
                                <div class="comment-reply">
                                    <span class="reply-author">${r.author}</span>
                                    <span style="color: rgba(255,255,255,0.3); font-size: 12px;"> رد</span>
                                    <div style="margin-top: 5px;">${r.body}</div>
                                    <div style="font-size: 12px; color: rgba(255,255,255,0.2); margin-top: 5px;">${r.date}</div>
                                </div>
                            `).join('')}
                        </div>
                    `).join('')}
                </div>
            `;

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // ===== إرسال تعليق =====
        function submitComment(index) {
            const textarea = document.getElementById('commentText');
            const body = textarea.value.trim();
            if (!body) {
                showToast('⚠️ الرجاء كتابة التعليق');
                return;
            }

            const post = posts[index];
            const comment = {
                id: Date.now(),
                postId: post.id,
                parentId: null,
                author: '👤 زائر',
                body: body,
                date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' })
            };

            comments.push(comment);
            saveData();
            textarea.value = '';
            viewPost(index);
            showToast('✅ تم إرسال التعليق');
        }

        // ===== إغلاق Modal =====
        function closeModal(e) {
            if (e && e.target !== e.currentTarget) return;
            document.getElementById('postModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== Toast =====
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== تحميل البيانات =====
        loadData();

        // ===== إغلاق Modal بالـ Escape =====
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ===== إضافة مقالات تجريبية =====
        if (posts.length === 0) {
            const samplePosts = [{
                id: 1,
                title: '🚀 مستقبل الذكاء الاصطناعي',
                body: 'الذكاء الاصطناعي يغير العالم بسرعة مذهلة. من المساعدات الصوتية إلى السيارات ذاتية القيادة، أصبح الذكاء الاصطناعي جزءًا لا يتجزأ من حياتنا اليومية.\n\nولكن ما هي الخطوة التالية؟ وكيف يمكننا الاستفادة القصوى من هذه التقنيات دون التأثير على خصوصيتنا وأمننا؟\n\nفي هذا المقال، سنستكشف أحدث التطورات في مجال الذكاء الاصطناعي وتأثيرها على مختلف المجالات.',
                mediaType: 'image',
                mediaUrl: 'https://picsum.photos/seed/ai/800/400',
                tags: 'تقنية, ذكاء اصطناعي, مستقبل',
                date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }),
                views: 0
            }, {
                id: 2,
                title: '🎨 التصميم والإبداع في العصر الرقمي',
                body: 'التصميم الجيد ليس مجرد جمالية، بل هو أداة قوية للتواصل. في عالم مليء بالمحتوى، التصميم هو ما يميز المحتوى الجيد عن المتوسط.\n\nتعلم أساسيات التصميم يمكن أن يغير طريقة تفكيرك ويحسن من جودة مشاريعك بشكل كبير. سواء كنت مصممًا محترفًا أو مبتدئًا، هناك دائمًا مجال للتطور.',
                mediaType: 'image',
                mediaUrl: 'https://picsum.photos/seed/design/800/400',
                tags: 'تصميم, إبداع, UI/UX',
                date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }),
                views: 0
            }];

            posts = samplePosts;
            saveData();
            renderPosts();
        }
    </script>

</body>
</html>
