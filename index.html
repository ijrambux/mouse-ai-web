<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐭 MOUSE AI - IPTV Player Pro</title>
    <!-- Video.js Library -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        :root {
            --primary: #6c5ce7;
            --bg-dark: #0e1019;
            --bg-sidebar: #171a26;
            --bg-card: #1f2333;
            --border-color: #2d3348;
            --text-white: #ffffff;
            --text-light: #a0a3bd;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-white); overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

        /* ===== BACKGROUND STARS ===== */
        #stars-container { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .star { position: absolute; background: #00d4ff; border-radius: 50%; box-shadow: 0 0 15px #00d4ff; animation: twinkle var(--duration) infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.1; transform: scale(0.4); } 100% { opacity: 1; transform: scale(1.2); } }

        /* ===== HEADER ===== */
        header {
            position: relative; z-index: 10; background: rgba(14, 16, 25, 0.9); backdrop-filter: blur(10px);
            padding: 12px 25px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 15px;
        }
        .brand-logo { display: flex; align-items: center; gap: 12px; text-decoration: none; animation: logoFloat 3s ease-in-out infinite; }
        @keyframes logoFloat { 0% { transform: translateY(0px); } 50% { transform: translateY(-4px); filter: drop-shadow(0 0 25px rgba(108, 92, 231, 0.8)); } 100% { transform: translateY(0px); } }
        .brand-logo .icon { font-size: 28px; }
        .brand-logo .text-group .main { font-size: 22px; font-weight: 900; }
        .brand-logo .text-group .main span { color: #a29bfe; }
        .brand-logo .text-group .sub { font-size: 10px; color: var(--text-light); letter-spacing: 2px; text-transform: uppercase; }

        /* ===== INPUT AREA ===== */
        .input-area {
            display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
            background: rgba(255,255,255,0.03); padding: 5px; border-radius: 50px;
            border: 1px solid var(--border-color);
        }
        .input-area:hover { border-color: var(--primary); }
        
        .input-url { 
            background: transparent; border: none; color: #fff; 
            padding: 8px 15px; font-size: 14px; width: 300px; outline: none;
        }
        .input-url::placeholder { color: var(--text-light); }

        .btn-upload-wrapper { position: relative; display: inline-block; }
        .btn-upload-wrapper input[type="file"] {
            position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer;
        }
        .btn-action {
            background: rgba(255,255,255,0.05); border: none; color: var(--text-light);
            padding: 8px 16px; border-radius: 30px; cursor: pointer; font-weight: 600; transition: 0.3s; font-size: 13px; display: flex; align-items: center; gap: 6px;
        }
        .btn-action:hover { background: var(--primary); color: #fff; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { box-shadow: 0 0 20px rgba(108, 92, 231, 0.4); }

        /* ===== LAYOUT (Sidebar + Player) ===== */
        .app-container { display: flex; flex: 1; position: relative; z-index: 1; overflow: hidden; }
        
        .sidebar { width: 320px; height: 100%; background: var(--bg-sidebar); border-left: 1px solid var(--border-color); padding: 15px; display: flex; flex-direction: column; overflow: hidden; }
        .channels-count { color: var(--text-light); font-size: 13px; margin-bottom: 10px; }
        .channels-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-left: 5px; }
        .channels-list::-webkit-scrollbar { width: 4px; }
        .channels-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .channel-item {
            background: var(--bg-card); border: 1px solid transparent; padding: 10px 12px; border-radius: 8px;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .channel-item:hover { border-color: var(--border-color); background: #2b3042; }
        .channel-item.active { border-color: var(--primary); background: rgba(108, 92, 231, 0.15); }
        .channel-item .num { width: 25px; height: 25px; background: rgba(255,255,255,0.05); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 11px; color: var(--text-light); }
        .channel-item .info { flex: 1; }
        .channel-item .info .name { font-size: 14px; font-weight: 600; }
        .channel-item .info .group { font-size: 10px; color: var(--text-light); }

        .main-player { flex: 1; background: #000; position: relative; display: flex; justify-content: center; align-items: center; }
        #videoPlayer { width: 100%; height: 100%; object-fit: contain; }
        
        .overlay-info {
            position: absolute; bottom: 40px; left: 0; right: 0; text-align: center; pointer-events: none;
        }
        .overlay-info .name { background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); padding: 10px 25px; border-radius: 30px; display: inline-block; font-size: 18px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1); }

        .empty-channels { text-align: center; padding: 40px 10px; color: var(--text-light); }
        .empty-channels i { font-size: 50px; opacity: 0.2; margin-bottom: 15px; display: block; }

        /* Responsive */
        @media (max-width: 800px) {
            header { flex-direction: column; align-items: stretch; }
            .input-area { border-radius: 12px; flex-direction: column; align-items: stretch; padding: 10px; }
            .input-url { width: 100%; border-bottom: 1px solid var(--border-color); padding: 10px 5px; }
            .btn-action { justify-content: center; }
            .app-container { flex-direction: column-reverse; }
            .sidebar { width: 100%; height: 250px; border-left: none; border-top: 1px solid var(--border-color); }
            .main-player { height: 300px; }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <header>
        <a href="#" class="brand-logo" onclick="location.reload()">
            <span class="icon">🐭</span>
            <div class="text-group">
                <span class="main">MOUSE <span>AI</span></span>
                <span class="sub">Live TV Player</span>
            </div>
        </a>
        
        <div class="input-area">
            <!-- URL Input -->
            <input type="text" class="input-url" id="m3uUrlInput" placeholder="ضع رابط M3U هنا..." />
            <!-- Load URL Button -->
            <button class="btn-action btn-primary" onclick="loadFromUrl()"><i class="fas fa-link"></i> تشغيل الرابط</button>
            
            <!-- File Upload Button -->
            <div class="btn-upload-wrapper">
                <button class="btn-action"><i class="fas fa-upload"></i> رفع ملف .m3u</button>
                <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" onchange="loadFromFile(event)" />
            </div>
        </div>
    </header>

    <div class="app-container">
        <div class="sidebar">
            <div class="channels-count"><span id="channelCount">0</span> قناة متاحة</div>
            <div class="channels-list" id="channelsList">
                <div class="empty-channels">
                    <i class="fas fa-satellite-dish"></i>
                    <h3>أضف قنواتك الآن</h3>
                    <p style="font-size:13px;">أدخل رابط M3U أو ارفع ملفاً من جهازك</p>
                </div>
            </div>
        </div>

        <div class="main-player">
            <video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto" style="width:100%; height:100%;"></video>
            <div class="overlay-info">
                <div class="name" id="currentChannelName">📡 اختر قناة للبث</div>
            </div>
        </div>
    </div>

    <script>
        // 1. Stars Background
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px'; star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw'; star.style.top = Math.random() * 100 + 'vh';
            star.style.setProperty('--duration', (Math.random() * 4 + 3) + 's');
            star.style.animationDelay = Math.random() * 10 + 's';
            document.getElementById('stars-container').appendChild(star);
        }

        // 2. Video Player Setup
        let player = videojs('videoPlayer', {
            controls: true, autoplay: false, preload: 'auto', fluid: true,
            html5: { vhs: { enableLowInitialPlaylist: true, smoothQualityChange: true } }
        });

        let channels = [];

        // 3. Parser
        function parseM3U(data) {
            const lines = data.split('\n');
            const parsed = [];
            let current = {};
            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = line.split(',').pop();
                    const grp = line.includes('group-title="') ? line.split('group-title="')[1].split('"')[0] : 'أخرى';
                    current = { name: name || 'قناة', group: grp };
                } else if (line.startsWith('http') && current.name) {
                    current.url = line;
                    parsed.push(current);
                    current = {};
                }
            });
            return parsed;
        }

        function renderChannels(list) {
            const container = document.getElementById('channelsList');
            document.getElementById('channelCount').textContent = list.length;
            if(!list.length) { container.innerHTML = `<div class="empty-channels"><i class="fas fa-satellite-dish"></i><h3>لا توجد قنوات</h3></div>`; return; }
            
            let html = '';
            list.forEach((ch, i) => {
                html += `<div class="channel-item" onclick="playChannel('${ch.url.replace(/'/g, "\\'")}', '${ch.name.replace(/'/g, "\\'")}')">
                    <div class="num">${i+1}</div>
                    <div class="info"><div class="name">${ch.name}</div><div class="group">${ch.group}</div></div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function playChannel(url, name) {
            document.getElementById('currentChannelName').innerHTML = `📺 الآن: ${name}`;
            player.src({ type: 'application/x-mpegURL', src: url });
            player.play();
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.channel-item')?.classList.add('active');
        }

        // 4. Load from URL
        function loadFromUrl() {
            const url = document.getElementById('m3uUrlInput').value.trim();
            if(!url) { alert('يرجى إدخال رابط M3U صحيح'); return; }
            fetch(url).then(r => r.text()).then(d => { channels = parseM3U(d); renderChannels(channels); }).catch(() => alert('فشل تحميل الرابط. تأكد من صحته.'));
        }

        // 5. Load from FILE
        function loadFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                channels = parseM3U(e.target.result);
                renderChannels(channels);
            };
            reader.readAsText(file);
            event.target.value = ''; // reset input
        }
    </script>
</body>
</html>
