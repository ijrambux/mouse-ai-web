<!DOCTYPE html>
<html dir="ltr" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 MoUsE AI - توليد فيديوهات احترافية</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* ===== MAIN CARD ===== */
        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 45px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        /* ===== HEADER WITH ANIMATED LOGO ===== */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            display: inline-block;
            background: linear-gradient(90deg, #00d4ff, #0077ff, #a855f7, #00d4ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease-in-out infinite, float 3s ease-in-out infinite;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: center;
        }
        .tab-btn.active {
            background: rgba(0, 212, 255, 0.08);
            color: #00d4ff;
            box-shadow: inset 0 -2px 0 #00d4ff;
        }
        .tab-btn:hover:not(.active) {
            color: #aaa;
            background: rgba(255, 255, 255, 0.03);
        }
        /* ===== PROMPT ===== */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            resize: vertical;
            font-family: inherit;
            min-height: 90px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.05), inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea::placeholder {
            color: #555;
        }
        /* ===== REFERENCE IMAGE UPLOAD ===== */
        .ref-image-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .ref-image-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 16px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            color: #999;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .ref-image-btn:hover {
            border-color: rgba(0, 212, 255, 0.3);
            color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        .ref-image-preview-wrap {
            display: none;
            position: relative;
            flex-shrink: 0;
        }
        .ref-image-preview-wrap.show {
            display: block;
        }
        .ref-image-preview-wrap img {
            width: 64px;
            height: 64px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: block;
        }
        .ref-image-remove {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 20px;
            height: 20px;
            border: none;
            border-radius: 50%;
            background: #ff6b6b;
            color: #fff;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
        }
        /* ===== OPTIONS ROW ===== */
        .options-row {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .option-group {
            flex: 1;
            min-width: 140px;
        }
        .option-group .option-label {
            display: block;
            font-size: 13px;
            color: #888;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .option-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .opt-btn {
            padding: 6px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            color: #777;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .opt-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #ccc;
        }
        .opt-btn.active {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .opt-btn .sub {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            font-weight: 400;
        }
        /* ===== GENERATE BUTTON ===== */
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 119, 255, 0.12));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 18px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            margin-top: 8px;
        }
        .generate-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 119, 255, 0.2));
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.1);
        }
        .generate-btn:active {
            transform: translateY(0px);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .generate-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .generate-btn.loading .spinner {
            display: block;
        }
        .generate-btn.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* ===== RESULT WRAPPER (video or image) WITH DOWNLOAD BUTTON ===== */
        .video-wrapper {
            margin-top: 24px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            position: relative;
        }
        .video-wrapper.show {
            display: block;
            animation: fadeSlide 0.5s ease-out;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .video-wrapper video,
        .video-wrapper img {
            width: 100%;
            display: block;
            border-radius: 18px 18px 0 0;
        }
        /* ===== VIDEO/IMAGE CONTROLS BAR ===== */
        .video-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-controls .video-label {
            font-size: 13px;
            color: #00d4ff;
            font-weight: 600;
        }
        .video-controls .video-label span {
            opacity: 0.5;
            font-weight: 400;
            color: #888;
        }
        .download-btn {
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 119, 255, 0.15));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 119, 255, 0.25));
            border-color: rgba(0, 212, 255, 0.4);
            transform: scale(1.02);
        }
        .download-btn:active {
            transform: scale(0.98);
        }
        /* ===== LOG BOX ===== */
        .log-box {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 150px;
            overflow-y: auto;
        }
        .log-box .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #666;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .log-box .log-entry .time {
            color: #444;
            margin-right: 10px;
        }
        .log-box .log-entry.success {
            color: #00d4ff;
        }
        .log-box .log-entry.error {
            color: #ff6b6b;
        }
        .log-box .log-entry.info {
            color: #88ccff;
        }
        .log-box::-webkit-scrollbar {
            width: 4px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 24px; }
            .logo { font-size: 32px; }
            .options-row { flex-direction: column; gap: 16px; }
            .tab-btn { font-size: 13px; padding: 12px 14px; }
            .video-controls { flex-direction: column; gap: 10px; align-items: stretch; }
            .download-btn { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- HEADER with Animated Logo -->
    <div class="header">
        <div class="logo">🎬 MoUsE AI</div>
        <div class="subtitle">توليد فيديوهات احترافية بالذكاء الاصطناعي</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="video">📹 Text to Video</button>
        <button class="tab-btn" data-tab="image">🖼️ Text to Image</button>
    </div>

    <!-- PROMPT -->
    <div class="form-group">
        <label for="promptInput">Prompt</label>
        <textarea id="promptInput" placeholder="Describe the video you want, e.g.: Slow motion waves crashing against rocks">Slow motion waves crashing against rocks, cinematic 4K</textarea>
    </div>

    <!-- REFERENCE IMAGE UPLOAD (new feature) -->
    <div class="form-group">
        <label>🖼️ صورة مرجعية مع البرومبت (اختياري)</label>
        <div class="ref-image-row">
            <input type="file" id="refImageInput" accept="image/*" style="display:none;">
            <button type="button" class="ref-image-btn" id="refImageBtn">📎 اضغط لإضافة صورة</button>
            <div class="ref-image-preview-wrap" id="refImagePreviewWrap">
                <img id="refImagePreview" alt="preview">
                <button type="button" class="ref-image-remove" id="refImageRemove">✕</button>
            </div>
        </div>
    </div>

    <!-- OPTIONS: Duration + Aspect Ratio -->
    <div class="options-row">
        <div class="option-group">
            <span class="option-label">⏱️ Duration</span>
            <div class="option-buttons" id="durationGroup">
                <button class="opt-btn" data-value="5">5 seconds</button>
                <button class="opt-btn active" data-value="10">10 seconds</button>
            </div>
        </div>
        <div class="option-group">
            <span class="option-label">📐 Aspect Ratio</span>
            <div class="option-buttons" id="aspectGroup">
                <button class="opt-btn active" data-value="16:9">16:9 <span class="sub">Landscape</span></button>
                <button class="opt-btn" data-value="9:16">9:16 <span class="sub">Portrait</span></button>
                <button class="opt-btn" data-value="1:1">1:1 <span class="sub">Square</span></button>
            </div>
        </div>
    </div>

    <!-- GENERATE BUTTON -->
    <button class="generate-btn" id="generateBtn">
        <span class="btn-text">🚀 Generate Video</span>
        <span class="spinner"></span>
    </button>

    <!-- VIDEO PLAYER مع زر تحميل -->
    <div class="video-wrapper" id="videoWrapper">
        <video id="videoPlayer" controls autoplay loop></video>
        <div class="video-controls">
            <div class="video-label">✨ MoUsE AI <span>• تم التوليد بالذكاء الاصطناعي</span></div>
            <button class="download-btn" id="downloadBtn">
                ⬇️ تحميل الفيديو
            </button>
        </div>
    </div>

    <!-- IMAGE RESULT مع زر تحميل (fix: كانت الصورة تُحمَّل مباشرة بدون عرض) -->
    <div class="video-wrapper" id="imageWrapper">
        <img id="imageResult" alt="generated image">
        <div class="video-controls">
            <div class="video-label">✨ MoUsE AI <span>• تم التوليد بالذكاء الاصطناعي</span></div>
            <button class="download-btn" id="downloadImageBtn">
                ⬇️ تحميل الصورة
            </button>
        </div>
    </div>

    <!-- LOG BOX -->
    <div class="log-box" id="logBox">
        <div class="log-entry info"><span class="time">[الآن]</span> 🎬 مرحباً بك في MoUsE AI!</div>
        <div class="log-entry info"><span class="time">[الآن]</span> 📝 اكتب وصفاً تفصيلياً للحصول على أفضل النتائج</div>
    </div>
</div>

<script>
    // ============================================================
    // 🎬 MoUsE AI - مع مشغل فيديو/صورة + زر تحميل + صورة مرجعية
    // ============================================================

    (function() {
        'use strict';

        // ---- DOM Elements ----
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const logBox = document.getElementById('logBox');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const durationBtns = document.querySelectorAll('#durationGroup .opt-btn');
        const aspectBtns = document.querySelectorAll('#aspectGroup .opt-btn');

        const videoWrapper = document.getElementById('videoWrapper');
        const videoPlayer = document.getElementById('videoPlayer');
        const downloadBtn = document.getElementById('downloadBtn');

        const imageWrapper = document.getElementById('imageWrapper');
        const imageResult = document.getElementById('imageResult');
        const downloadImageBtn = document.getElementById('downloadImageBtn');

        const refImageInput = document.getElementById('refImageInput');
        const refImageBtn = document.getElementById('refImageBtn');
        const refImagePreviewWrap = document.getElementById('refImagePreviewWrap');
        const refImagePreview = document.getElementById('refImagePreview');
        const refImageRemove = document.getElementById('refImageRemove');

        // ---- State ----
        let isGenerating = false;
        let currentTab = 'video';
        let selectedDuration = '10';
        let selectedAspect = '16:9';
        let currentVideoBlobUrl = null;
        let currentImageBlobUrl = null;
        let selectedRefImageFile = null; // الصورة المرجعية المرفقة مع البرومبت
        const API_BASE = 'https://mouse-ai-nine.vercel.app';

        // ---- Helpers ----
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function resetButton() {
            generateBtn.classList.remove('loading');
            generateBtn.disabled = false;
            const span = generateBtn.querySelector('.btn-text');
            if (span) span.textContent = currentTab === 'video' ? '🚀 Generate Video' : '🖼️ Generate Image';
        }

        function setLoading() {
            generateBtn.classList.add('loading');
            generateBtn.disabled = true;
        }

        function clearResults() {
            videoWrapper.classList.remove('show');
            videoPlayer.pause();
            videoPlayer.src = '';
            currentVideoBlobUrl = null;

            imageWrapper.classList.remove('show');
            imageResult.src = '';
            currentImageBlobUrl = null;
        }

        function showVideo(videoUrl) {
            currentVideoBlobUrl = videoUrl;
            videoPlayer.src = videoUrl;
            videoWrapper.classList.add('show');
            videoPlayer.play().catch(() => {});
            addLog('🎬 الفيديو جاهز للمشاهدة والتحميل', 'success');
        }

        // FIX: كانت الصورة الناتجة تُحمَّل تلقائياً بدون أي عرض، وهذا كان يبدو كأن
        // "الميزة لا تعمل". الآن يتم عرضها في الواجهة مع زر تحميل منفصل، بنفس أسلوب الفيديو.
        function showImage(imageUrl) {
            currentImageBlobUrl = imageUrl;
            imageResult.src = imageUrl;
            imageWrapper.classList.add('show');
            addLog('🖼️ الصورة جاهزة للمشاهدة والتحميل', 'success');
        }

        // ---- تحميل الفيديو ----
        downloadBtn.addEventListener('click', function() {
            if (!currentVideoBlobUrl) {
                addLog('❌ لا يوجد فيديو للتحميل. قم بتوليد فيديو أولاً.', 'error');
                return;
            }
            const a = document.createElement('a');
            a.href = currentVideoBlobUrl;
            a.download = `MoUsE_AI_video_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.mp4`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            addLog('⬇️ بدء تحميل الفيديو...', 'info');
        });

        // ---- تحميل الصورة ----
        downloadImageBtn.addEventListener('click', function() {
            if (!currentImageBlobUrl) {
                addLog('❌ لا توجد صورة للتحميل. قم بتوليد صورة أولاً.', 'error');
                return;
            }
            const a = document.createElement('a');
            a.href = currentImageBlobUrl;
            a.download = `MoUsE_AI_image_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.png`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            addLog('⬇️ بدء تحميل الصورة...', 'info');
        });

        // ---- صورة مرجعية (ميزة جديدة) ----
        refImageBtn.addEventListener('click', function() {
            refImageInput.click();
        });

        refImageInput.addEventListener('change', function() {
            const file = this.files && this.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                addLog('❌ الملف المختار ليس صورة صالحة', 'error');
                return;
            }
            selectedRefImageFile = file;
            const previewUrl = URL.createObjectURL(file);
            refImagePreview.src = previewUrl;
            refImagePreviewWrap.classList.add('show');
            addLog(`📎 تم إرفاق صورة مرجعية: ${file.name}`, 'info');
        });

        refImageRemove.addEventListener('click', function() {
            selectedRefImageFile = null;
            refImageInput.value = '';
            refImagePreview.src = '';
            refImagePreviewWrap.classList.remove('show');
            addLog('🗑️ تم إزالة الصورة المرجعية', 'info');
        });

        // ---- Tab Switching ----
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                const btnText = generateBtn.querySelector('.btn-text');
                btnText.textContent = currentTab === 'video' ? '🚀 Generate Video' : '🖼️ Generate Image';
                // إخفاء نتائج التبويب السابق عند التبديل
                clearResults();
                addLog(`🔄 التبديل إلى وضع ${currentTab === 'video' ? 'الفيديو' : 'الصورة'}`, 'info');
            });
        });

        // ---- Option Buttons ----
        function setupOptionButtons(buttons, stateKey) {
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (stateKey === 'duration') selectedDuration = this.dataset.value;
                    if (stateKey === 'aspect') selectedAspect = this.dataset.value;
                    addLog(`⚙️ ${stateKey === 'duration' ? 'المدة' : 'نسبة الأبعاد'}: ${this.textContent.trim()}`, 'info');
                });
            });
        }
        setupOptionButtons(durationBtns, 'duration');
        setupOptionButtons(aspectBtns, 'aspect');

        // ---- Generate ----
        generateBtn.addEventListener('click', async function() {
            if (isGenerating) return;

            const prompt = promptInput.value.trim();
            if (!prompt || prompt.length < 5) {
                addLog('❌ الرجاء إدخال وصف للفيديو (5 أحرف على الأقل)', 'error');
                return;
            }

            isGenerating = true;
            setLoading();
            clearResults();
            addLog(`🚀 بدء توليد ${currentTab === 'video' ? 'فيديو' : 'صورة'}...`, 'info');
            addLog(`📝 البرومبت: ${prompt.substring(0, 60)}...`, 'info');
            if (selectedRefImageFile) {
                addLog(`📎 سيتم إرسال الصورة المرجعية: ${selectedRefImageFile.name}`, 'info');
            }

            try {
                const formData = new FormData();
                formData.append('prompt', prompt);
                formData.append('duration', selectedDuration);
                formData.append('aspect', selectedAspect);
                formData.append('mode', currentTab);
                if (selectedRefImageFile) {
                    // ملاحظة: اسم الحقل "image" هو الأكثر شيوعاً، لكن يجب التأكد أن
                    // الخادم (Backend) يتوقع نفس الاسم. إن لم يعمل، غيّر 'image' هنا
                    // ليطابق ما يستقبله الخادم فعلياً.
                    formData.append('image', selectedRefImageFile);
                }

                const response = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    body: formData,
                    signal: AbortSignal.timeout(310000)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);

                    if (currentTab === 'video') {
                        showVideo(url);
                    } else {
                        showImage(url);
                    }
                } else {
                    let errorMsg = `خطأ ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.detail) errorMsg += `: ${errData.detail}`;
                        else if (errData.message) errorMsg += `: ${errData.message}`;
                    } catch (e) {
                        const text = await response.text();
                        if (text) errorMsg += `: ${text.substring(0, 100)}`;
                    }
                    addLog(`❌ فشل التوليد: ${errorMsg}`, 'error');
                }
            } catch (err) {
                if (err.name === 'TimeoutError' || err.name === 'AbortError') {
                    addLog('❌ انتهى الوقت. الخادم قد يكون مشغولاً، حاول مرة أخرى.', 'error');
                } else {
                    addLog(`❌ خطأ: ${err.message}`, 'error');
                }
            } finally {
                isGenerating = false;
                resetButton();
                addLog('⏳ جاهز لتوليد جديد', 'info');
            }
        });

        // ---- Init ----
        addLog('', 'info');
        addLog(`⏱️ المدة: ${selectedDuration} ثانية | 📐 نسبة الأبعاد: ${selectedAspect}`, 'info');

        // التحقق من الخادم
        async function checkServer() {
            try {
                const res = await fetch(`${API_BASE}/status`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) addLog('✅ الخادم متصل', 'success');
                else addLog('⚠️ الخادم يستجيب بشكل غير متوقع', 'error');
            } catch {
                addLog('❌ الخادم غير متاح', 'error');
            }
        }
        setTimeout(checkServer, 1000);

    })();
</script>

</body>
</html>
