<script>

(function() {
    'use strict';

    // ===== سيرفر شهار =====
    const SHAHAR = {
        name: '🐭 MOUSE AI IPTV - شهار',
        url: 'http://81.31.194.66:8080/get.php?username=pro4451769801014&password=f734a8f19cf5&type=m3u_plus&output=ts'
    };

    // ===== STATE =====
    let state = {
        channels: [],
        filtered: [],
        favorites: new Set(),
        servers: {},
        settings: { volume: 100, autoLoad: true },
        currentIndex: -1,
        isPlaying: false,
        loading: false,
        favView: false,
        currentGroup: 'All',
        search: '',
        videoLoaded: false
    };

    // ===== DOM =====
    const video = document.getElementById('videoPlayer');
    const placeholder = document.getElementById('placeholder');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const progressSlider = document.getElementById('progressSlider');
    const playBtn = document.getElementById('playBtn');
    const stopBtn = document.getElementById('stopBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volSlider = document.getElementById('volSlider');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const infoLabel = document.getElementById('infoLabel');
    const serverSelect = document.getElementById('serverSelect');
    const loadBtn = document.getElementById('loadBtn');
    const fileBtn = document.getElementById('fileBtn');
    const addBtn = document.getElementById('addBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');
    const groupSelect = document.getElementById('groupSelect');
    const searchInput = document.getElementById('searchInput');
    const channelList = document.getElementById('channelList');
    const countLabel = document.getElementById('countLabel');
    const favBtn = document.getElementById('favBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');
    const toast = document.getElementById('toast');

    // ===== STORAGE =====
    function loadData() {
        try {
            const s = localStorage.getItem('mouse_settings');
            if (s) state.settings = { ...state.settings, ...JSON.parse(s) };
        } catch(e) {}
        try {
            const f = localStorage.getItem('mouse_favs');
            if (f) state.favorites = new Set(JSON.parse(f));
        } catch(e) {}
        try {
            const sv = localStorage.getItem('mouse_servers');
            if (sv) {
                state.servers = JSON.parse(sv);
            } else {
                state.servers = {};
                state.servers[SHAHAR.name] = SHAHAR.url;
                saveServers();
            }
        } catch(e) {
            state.servers = {};
            state.servers[SHAHAR.name] = SHAHAR.url;
            saveServers();
        }
    }

    function saveSettings() {
        try { localStorage.setItem('mouse_settings', JSON.stringify(state.settings)); } catch(e) {}
    }

    function saveFavorites() {
        try { localStorage.setItem('mouse_favs', JSON.stringify([...state.favorites])); } catch(e) {}
    }

    function saveServers() {
        try { localStorage.setItem('mouse_servers', JSON.stringify(state.servers)); } catch(e) {}
    }

    // ===== TOAST =====
    let toastTimer = null;
    function showToast(msg, type = '') {
        toast.textContent = msg;
        toast.className = 'toast' + (type ? ' ' + type : '');
        clearTimeout(toastTimer);
        void toast.offsetWidth;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 4000);
    }

    // ===== PARSER =====
    function parseM3U(text) {
        const lines = text.split(/\r?\n/);
        const channels = [];
        let cur = {};
        for (const raw of lines) {
            const line = raw.trim();
            if (!line) continue;
            if (line.startsWith('#EXTINF:')) {
                let name = 'Unnamed';
                const nm = line.match(/#EXTINF:[^,]*,\s*(.+?)\s*$/);
                if (nm) name = nm[1].trim();
                let logo = '';
                const lm = line.match(/tvg-logo="([^"]*)"/);
                if (lm) logo = lm[1];
                let group = 'General';
                const gm = line.match(/group-title="([^"]*)"/);
                if (gm) group = gm[1];
                cur = { name, logo, group, url: '' };
            } else if ((line.startsWith('http://') || line.startsWith('https://')) && cur && !cur.url) {
                cur.url = line;
                channels.push({ ...cur });
                cur = {};
            }
        }
        // Handle orphan URLs
        for (const line of lines) {
            const t = line.trim();
            if ((t.startsWith('http://') || t.startsWith('https://')) && !channels.some(c => c.url === t)) {
                channels.push({ name: 'قناة ' + (channels.length + 1), url: t, group: 'General', logo: '' });
            }
        }
        return channels;
    }

    // ===== LOAD CHANNELS =====
    function loadChannels(source) {
        if (state.loading) return;
        
        let url = source || serverSelect.value;
        
        if (!url || url === '-- لا يوجد --') {
            showToast('❌ لا يوجد سيرفر', 'error');
            return;
        }
        
        // Check if it's a server name
        if (state.servers[url]) {
            url = state.servers[url];
        }
        
        if (!url.startsWith('http')) {
            showToast('❌ رابط غير صالح: ' + url, 'error');
            return;
        }

        // Clear
        state.channels = [];
        state.filtered = [];
        state.currentIndex = -1;
        state.videoLoaded = false;
        video.pause();
        video.src = '';
        placeholder.style.display = 'block';
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');

        state.loading = true;
        loadBtn.disabled = true;
        loadBtn.textContent = '⏳ جاري...';
        progressBar.classList.add('active');
        progressFill.style.width = '0%';
        statusText.textContent = '🔄 جاري الاتصال بسيرفر شهار...';
        statusText.className = 'status-text';
        loadingOverlay.classList.add('active');

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 45000);

        console.log('🔄 جاري التحميل من:', url);

        fetch(url, {
            signal: controller.signal,
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                'Accept': '*/*',
                'Accept-Encoding': 'gzip, deflate, br',
                'Accept-Language': 'ar,en;q=0.9',
                'Connection': 'keep-alive',
                'Referer': 'https://www.google.com/'
            }
        })
        .then(res => {
            clearTimeout(timeout);
            if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);
            progressFill.style.width = '40%';
            statusText.textContent = '📥 جاري القراءة...';
            return res.text();
        })
        .then(text => {
            progressFill.style.width = '60%';
            statusText.textContent = '🔍 جاري التحليل...';
            
            if (!text || text.length < 10) throw new Error('استجابة فارغة');
            if (text.includes('<!DOCTYPE') || text.includes('<html')) {
                throw new Error('تم استقبال HTML بدلاً من القنوات');
            }
            
            const chs = parseM3U(text);
            progressFill.style.width = '90%';
            if (chs.length === 0) throw new Error('لا توجد قنوات');
            
            onChannelsLoaded(chs);
        })
        .catch(err => {
            clearTimeout(timeout);
            state.loading = false;
            loadBtn.disabled = false;
            loadBtn.textContent = '📡 تحميل القنوات';
            progressBar.classList.remove('active');
            loadingOverlay.classList.remove('active');
            
            let msg = err.message;
            if (err.name === 'AbortError') msg = '⏱️ انتهت المهلة - السيرفر لم يستجب';
            else if (msg.includes('403')) msg = '⛔ ممنوع الوصول (403) - جرب سيرفر آخر';
            else if (msg.includes('Failed to fetch')) msg = '🌐 خطأ في الشبكة - تأكد من اتصال الإنترنت';
            else if (msg.includes('500')) msg = '⚠️ خطأ في السيرفر (500)';
            else if (msg.includes('404')) msg = '❌ الرابط غير موجود (404)';
            
            statusText.textContent = '❌ ' + msg;
            statusText.className = 'status-text error';
            showToast('❌ ' + msg, 'error');
            console.error('Load error:', err);
            
            // Try with proxy as fallback
            tryProxy(url);
        });
    }

    function tryProxy(url) {
        statusText.textContent = '🔄 محاولة عبر وكيل CORS...';
        showToast('🔄 محاولة عبر وكيل...');
        
        const proxy = 'https://cors-anywhere.herokuapp.com/' + url;
        fetch(proxy, {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Accept': '*/*'
            }
        })
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(text => {
            const chs = parseM3U(text);
            if (chs.length === 0) throw new Error('لا توجد قنوات');
            onChannelsLoaded(chs);
            showToast('✅ تم التحميل عبر الوكيل');
        })
        .catch(err => {
            state.loading = false;
            loadBtn.disabled = false;
            loadBtn.textContent = '📡 تحميل القنوات';
            progressBar.classList.remove('active');
            loadingOverlay.classList.remove('active');
            statusText.textContent = '❌ فشل التحميل: ' + err.message;
            statusText.className = 'status-text error';
            showToast('❌ فشل التحميل: ' + err.message, 'error');
        });
    }

    function onChannelsLoaded(channels) {
        state.channels = channels;
        state.filtered = [...channels];
        state.currentIndex = -1;
        state.loading = false;
        loadBtn.disabled = false;
        loadBtn.textContent = '📡 تحميل القنوات';
        progressBar.classList.remove('active');
        progressFill.style.width = '100%';
        loadingOverlay.classList.remove('active');

        // Groups
        const groups = new Set();
        for (const ch of channels) {
            if (ch.group) groups.add(ch.group);
        }
        groupSelect.innerHTML = '<option value="All">📂 كل المجموعات</option>';
        for (const g of [...groups].sort()) {
            const opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            groupSelect.appendChild(opt);
        }
        state.currentGroup = 'All';
        groupSelect.value = 'All';

        renderChannels();
        statusText.textContent = `✅ تم التحميل: ${channels.length} قناة من شهار`;
        statusText.className = 'status-text success';
        countLabel.textContent = channels.length + ' قناة';
        showToast(`✅ تم تحميل ${channels.length} قناة من شهار`);

        // Auto play first channel
        if (channels.length > 0) {
            setTimeout(() => {
                const first = channelList.querySelector('.channel-item');
                if (first) {
                    first.click();
                }
            }, 600);
        }
    }

    // ===== RENDER =====
    function renderChannels() {
        const search = state.search.toLowerCase().trim();
        const group = state.currentGroup;
        const favOnly = state.favView;

        let filtered = state.channels;
        if (group !== 'All') {
            filtered = filtered.filter(c => (c.group || 'General') === group);
        }
        if (search) {
            filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(search));
        }
        if (favOnly) {
            filtered = filtered.filter(c => state.favorites.has(c.url));
        }
        state.filtered = filtered;

        channelList.innerHTML = '';
        if (filtered.length === 0) {
            channelList.innerHTML = '<div style="text-align:center;padding:30px 10px;color:#5a6470;font-size:13px;">📺 لا توجد قنوات</div>';
            countLabel.textContent = '0 قناة';
            return;
        }

        for (let i = 0; i < filtered.length; i++) {
            const ch = filtered[i];
            const div = document.createElement('div');
            div.className = 'channel-item' + (i === state.currentIndex ? ' active' : '');
            const isFav = state.favorites.has(ch.url);
            div.innerHTML = `
                <span>${isFav ? '<span class="fav">⭐</span>' : ''} ${ch.name || 'Unnamed'}</span>
                ${ch.group ? `<span class="group-tag">${ch.group}</span>` : ''}
            `;
            div.dataset.index = i;
            div.addEventListener('click', () => playChannel(i));
            channelList.appendChild(div);
        }
        countLabel.textContent = filtered.length + ' قناة';
    }

    // ===== PLAY =====
    function playChannel(index) {
        const ch = state.filtered[index];
        if (!ch || !ch.url) {
            showToast('❌ لا يوجد رابط', 'error');
            return;
        }

        state.currentIndex = index;
        state.videoLoaded = true;
        state.isPlaying = true;

        document.querySelectorAll('.channel-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });

        placeholder.style.display = 'none';
        loadingOverlay.classList.add('active');

        video.src = ch.url;
        video.load();
        
        const promise = video.play();
        if (promise !== undefined) {
            promise.then(() => {
                loadingOverlay.classList.remove('active');
                state.isPlaying = true;
                playBtn.textContent = '⏸';
                playBtn.classList.add('playing');
                infoLabel.textContent = '▶️ ' + ch.name;
                infoLabel.className = 'info-label active';
                statusText.textContent = '▶️ ' + ch.name;
                statusText.className = 'status-text success';
            }).catch(err => {
                loadingOverlay.classList.remove('active');
                console.warn('Play error:', err);
                showToast('❌ لا يمكن تشغيل هذه القناة', 'error');
                // Try with proxy
                const proxy = 'https://cors-anywhere.herokuapp.com/' + ch.url;
                video.src = proxy;
                video.load();
                video.play().catch(() => {});
            });
        }

        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        infoLabel.textContent = '▶️ ' + ch.name;
        infoLabel.className = 'info-label active';
    }

    // ===== CONTROLS =====
    function togglePlay() {
        if (!state.videoLoaded) {
            const first = channelList.querySelector('.channel-item');
            if (first) first.click();
            return;
        }
        if (video.paused) {
            video.play().catch(() => {});
            state.isPlaying = true;
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing');
        } else {
            video.pause();
            state.isPlaying = false;
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
        }
    }

    function stopPlay() {
        video.pause();
        video.currentTime = 0;
        state.isPlaying = false;
        state.videoLoaded = false;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        infoLabel.textContent = '⏹️ تم الإيقاف';
        infoLabel.className = 'info-label';
        progressSlider.value = 0;
        placeholder.style.display = 'block';
        video.src = '';
    }

    function playNext() {
        if (state.filtered.length === 0) return;
        const n = (state.currentIndex + 1) % state.filtered.length;
        playChannel(n);
        scrollTo(n);
    }

    function playPrev() {
        if (state.filtered.length === 0) return;
        const n = state.currentIndex <= 0 ? state.filtered.length - 1 : state.currentIndex - 1;
        playChannel(n);
        scrollTo(n);
    }

    function scrollTo(index) {
        const items = channelList.querySelectorAll('.channel-item');
        if (items[index]) items[index].scrollIntoView({ block: 'nearest' });
    }

    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? '🔇' : '🔊';
    }

    function setVolume(val) {
        const v = parseInt(val);
        video.volume = Math.min(v / 200, 1);
        state.settings.volume = v;
        saveSettings();
        if (v === 0) muteBtn.textContent = '🔇';
        else if (v < 50) muteBtn.textContent = '🔉';
        else if (v < 100) muteBtn.textContent = '🔊';
        else muteBtn.textContent = '🔊';
    }

    function toggleFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(() => {});
        } else {
            document.documentElement.requestFullscreen().catch(() => {});
        }
    }

    function toggleFavView() {
        state.favView = !state.favView;
        favBtn.classList.toggle('fav-active');
        favBtn.textContent = state.favView ? '⭐ مفضلة (نشط)' : '⭐ المفضلة';
        renderChannels();
    }

    function toggleFavorite(index) {
        const ch = state.filtered[index];
        if (!ch) return;
        if (state.favorites.has(ch.url)) {
            state.favorites.delete(ch.url);
            showToast('⭐ تم الإزالة');
        } else {
            state.favorites.add(ch.url);
            showToast('⭐ تم الإضافة');
        }
        saveFavorites();
        renderChannels();
        const items = channelList.querySelectorAll('.channel-item');
        if (items[state.currentIndex]) items[state.currentIndex].classList.add('active');
    }

    // ===== MODAL =====
    function openModal(title, html) {
        modalTitle.textContent = title;
        modalBody.innerHTML = html;
        modalOverlay.classList.add('active');
    }

    function closeModal() {
        modalOverlay.classList.remove('active');
    }

    function openAddServer() {
        openModal('➕ إضافة سيرفر', `
            <div class="form-group">
                <label>🏷️ اسم السيرفر</label>
                <input type="text" id="newServerName" placeholder="مثال: سيرفر جديد" value="🐭 MOUSE AI - جديد">
            </div>
            <div class="form-group">
                <label>🔗 رابط السيرفر</label>
                <input type="text" id="newServerUrl" placeholder="http://..." value="http://">
            </div>
            <div class="modal-btns">
                <button class="action-btn" onclick="closeModal()">إلغاء</button>
                <button class="action-btn green" id="saveServerBtn">💾 حفظ</button>
            </div>
        `);
        document.getElementById('saveServerBtn').addEventListener('click', () => {
            const name = document.getElementById('newServerName').value.trim();
            const url = document.getElementById('newServerUrl').value.trim();
            if (!name || !url) {
                showToast('❌ أدخل الاسم والرابط', 'error');
                return;
            }
            if (!url.startsWith('http')) {
                showToast('❌ الرابط يجب أن يبدأ بـ http://', 'error');
                return;
            }
            state.servers[name] = url;
            saveServers();
            refreshServers();
            serverSelect.value = name;
            showToast('✅ تم الإضافة: ' + name);
            closeModal();
            setTimeout(() => loadChannels(name), 300);
        });
    }

    function openSettings() {
        openModal('⚙️ الإعدادات', `
            <div class="form-group">
                <label>🔊 مستوى الصوت</label>
                <input type="range" id="volSetting" min="0" max="200" value="${state.settings.volume || 100}" style="width:100%;">
                <span id="volDisplay" style="color:#00ff88;font-weight:bold;">${state.settings.volume || 100}%</span>
            </div>
            <div class="form-group">
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                    <input type="checkbox" id="autoLoadSetting" ${state.settings.autoLoad !== false ? 'checked' : ''}>
                    🚀 تحميل تلقائي عند البدء
                </label>
            </div>
            <div class="modal-btns">
                <button class="action-btn" onclick="closeModal()">إلغاء</button>
                <button class="action-btn green" id="saveSettingsBtn">💾 حفظ</button>
            </div>
        `);
        const volSlider = document.getElementById('volSetting');
        const volDisplay = document.getElementById('volDisplay');
        volSlider.addEventListener('input', () => {
            volDisplay.textContent = volSlider.value + '%';
        });
        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            state.settings.volume = parseInt(document.getElementById('volSetting').value);
            state.settings.autoLoad = document.getElementById('autoLoadSetting').checked;
            saveSettings();
            setVolume(state.settings.volume);
            showToast('✅ تم الحفظ');
            closeModal();
        });
    }

    function openManageServers() {
        const names = Object.keys(state.servers);
        let html = `<div style="margin-bottom:10px;color:#8b95a5;">${names.length} سيرفر(ات)</div>`;
        for (const name of names) {
            const url = state.servers[name];
            html += `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0a0c0f;border-radius:6px;margin-bottom:4px;border:1px solid #1e242c;">
                    <div style="flex:1;overflow:hidden;">
                        <div style="color:#00ff88;font-weight:bold;">${name}</div>
                        <div style="font-size:11px;color:#5a6470;word-break:break-all;">${url.substring(0, 50)}...</div>
                    </div>
                    <button class="action-btn red" style="border-color:#ff2a2a;color:#ff2a2a;padding:4px 12px;font-size:11px;" data-name="${name}">🗑️</button>
                </div>
            `;
        }
        html += `<div class="modal-btns"><button class="action-btn" onclick="closeModal()">إغلاق</button></div>`;
        openModal('📡 إدارة السيرفرات', html);
        modalBody.querySelectorAll('[data-name]').forEach(btn => {
            btn.addEventListener('click', () => {
                const name = btn.dataset.name;
                if (confirm('حذف "' + name + '"؟')) {
                    delete state.servers[name];
                    saveServers();
                    refreshServers();
                    showToast('🗑️ تم الحذف: ' + name);
                    openManageServers();
                }
            });
        });
    }

    // ===== REFRESH =====
    function refreshServers() {
        const current = serverSelect.value;
        serverSelect.innerHTML = '';
        const names = Object.keys(state.servers);
        if (names.length === 0) {
            const opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '-- لا يوجد --';
            serverSelect.appendChild(opt);
        } else {
            for (const name of names) {
                const opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                serverSelect.appendChild(opt);
            }
        }
        if (current && [...serverSelect.options].some(o => o.value === current)) {
            serverSelect.value = current;
        }
    }

    // ===== FILE =====
    function loadFile() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.m3u,.m3u8';
        input.onchange = () => {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const text = e.target.result;
                    const chs = parseM3U(text);
                    if (chs.length === 0) throw new Error('لا توجد قنوات');
                    state.channels = chs;
                    state.filtered = [...chs];
                    state.currentIndex = -1;
                    renderChannels();
                    // Update groups
                    const groups = new Set();
                    for (const ch of chs) {
                        if (ch.group) groups.add(ch.group);
                    }
                    groupSelect.innerHTML = '<option value="All">📂 كل المجموعات</option>';
                    for (const g of [...groups].sort()) {
                        const opt = document.createElement('option');
                        opt.value = g;
                        opt.textContent = g;
                        groupSelect.appendChild(opt);
                    }
                    state.currentGroup = 'All';
                    groupSelect.value = 'All';
                    statusText.textContent = `✅ تم التحميل: ${chs.length} قناة`;
                    statusText.className = 'status-text success';
                    countLabel.textContent = chs.length + ' قناة';
                    showToast(`✅ تم تحميل ${chs.length} قناة من الملف`);
                } catch(err) {
                    showToast('❌ ' + err.message, 'error');
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // ===== VIDEO EVENTS =====
    video.addEventListener('timeupdate', () => {
        if (video.duration) {
            progressSlider.value = Math.min((video.currentTime / video.duration) * 1000, 1000);
        }
    });

    video.addEventListener('play', () => {
        state.isPlaying = true;
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        placeholder.style.display = 'none';
        loadingOverlay.classList.remove('active');
    });

    video.addEventListener('pause', () => {
        state.isPlaying = false;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
    });

    video.addEventListener('ended', () => {
        state.isPlaying = false;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        playNext();
    });

    video.addEventListener('error', () => {
        loadingOverlay.classList.remove('active');
        showToast('⚠️ مشكلة في التشغيل', 'error');
    });

    progressSlider.addEventListener('input', (e) => {
        if (video.duration) {
            video.currentTime = (e.target.value / 1000) * video.duration;
        }
    });

    // ===== KEYBOARD =====
    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        switch(e.key) {
            case ' ': e.preventDefault(); togglePlay(); break;
            case 's': case 'S': stopPlay(); break;
            case 'ArrowRight': playNext(); break;
            case 'ArrowLeft': playPrev(); break;
            case 'ArrowUp': volSlider.value = Math.min(parseInt(volSlider.value) + 10, 200); setVolume(volSlider.value); break;
            case 'ArrowDown': volSlider.value = Math.max(parseInt(volSlider.value) - 10, 0); setVolume(volSlider.value); break;
            case 'm': case 'M': toggleMute(); break;
            case 'f': case 'F': toggleFullscreen(); break;
            case 'Escape': if (modalOverlay.classList.contains('active')) closeModal(); break;
        }
    });

    // ===== EVENTS =====
    loadBtn.addEventListener('click', () => {
        const sel = serverSelect.value;
        if (!sel || sel === '-- لا يوجد --') {
            showToast('❌ لا يوجد سيرفر', 'error');
            return;
        }
        loadChannels(sel);
    });

    fileBtn.addEventListener('click', loadFile);
    addBtn.addEventListener('click', openAddServer);
    settingsBtn.addEventListener('click', openSettings);

    // Add manage button
    const manageBtn = document.createElement('button');
    manageBtn.className = 'action-btn full';
    manageBtn.textContent = '⚙️ إدارة السيرفرات';
    manageBtn.style.marginTop = '4px';
    manageBtn.addEventListener('click', openManageServers);
    document.querySelector('.btn-row').appendChild(manageBtn);

    playBtn.addEventListener('click', togglePlay);
    stopBtn.addEventListener('click', stopPlay);
    prevBtn.addEventListener('click', playPrev);
    nextBtn.addEventListener('click', playNext);
    muteBtn.addEventListener('click', toggleMute);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    volSlider.addEventListener('input', (e) => setVolume(e.target.value));
    favBtn.addEventListener('click', toggleFavView);

    searchInput.addEventListener('input', (e) => {
        state.search = e.target.value;
        renderChannels();
    });

    groupSelect.addEventListener('change', (e) => {
        state.currentGroup = e.target.value;
        renderChannels();
    });

    modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModal();
    });

    // Context menu on channels
    channelList.addEventListener('contextmenu', (e) => {
        const item = e.target.closest('.channel-item');
        if (!item) return;
        const index = parseInt(item.dataset.index);
        const ch = state.filtered[index];
        if (!ch) return;
        e.preventDefault();
        const isFav = state.favorites.has(ch.url);
        const menu = [
            { label: '▶ تشغيل', action: () => playChannel(index) },
            { label: isFav ? '⭐ إزالة مفضلة' : '⭐ إضافة مفضلة', action: () => toggleFavorite(index) },
            { label: '📋 نسخ الرابط', action: () => { navigator.clipboard.writeText(ch.url).then(() => showToast('📋 تم النسخ')); } }
        ];
        let html = menu.map((m, i) =>
            `<div class="action-btn" style="width:100%;text-align:right;padding:6px 12px;margin:2px 0;border-radius:4px;border:1px solid #1e242c;cursor:pointer;" data-action="${i}">${m.label}</div>`
        ).join('');
        html += `<div class="modal-btns"><button class="action-btn" onclick="closeModal()">إغلاق</button></div>`;
        openModal('📺 القناة: ' + ch.name, html);
        modalBody.querySelectorAll('[data-action]').forEach((btn, i) => {
            btn.addEventListener('click', () => { menu[i].action(); closeModal(); });
        });
    });

    // ===== DRAG & DROP =====
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
        e.preventDefault();
        const files = e.dataTransfer.files;
        if (files.length > 0 && files[0].name.match(/\.m3u8?$/i)) {
            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const text = ev.target.result;
                    const chs = parseM3U(text);
                    if (chs.length === 0) throw new Error('لا توجد قنوات');
                    state.channels = chs;
                    state.filtered = [...chs];
                    state.currentIndex = -1;
                    renderChannels();
                    const groups = new Set();
                    for (const ch of chs) {
                        if (ch.group) groups.add(ch.group);
                    }
                    groupSelect.innerHTML = '<option value="All">📂 كل المجموعات</option>';
                    for (const g of [...groups].sort()) {
                        const opt = document.createElement('option');
                        opt.value = g;
                        opt.textContent = g;
                        groupSelect.appendChild(opt);
                    }
                    state.currentGroup = 'All';
                    groupSelect.value = 'All';
                    statusText.textContent = `✅ تم التحميل: ${chs.length} قناة`;
                    statusText.className = 'status-text success';
                    countLabel.textContent = chs.length + ' قناة';
                    showToast(`✅ تم تحميل ${chs.length} قناة`);
                } catch(err) {
                    showToast('❌ ' + err.message, 'error');
                }
            };
            reader.readAsText(files[0]);
            showToast('📁 جاري التحميل...');
        }
    });

    // ===== INIT =====
    function init() {
        loadData();
        refreshServers();
        setVolume(state.settings.volume || 100);

        // Select the MOUSE AI server
        const mouseServer = Object.keys(state.servers).find(k => k.includes('MOUSE AI'));
        if (mouseServer) {
            serverSelect.value = mouseServer;
        } else {
            const first = Object.keys(state.servers)[0];
            if (first) serverSelect.value = first;
        }

        if (state.settings.autoLoad !== false) {
            const selected = serverSelect.value;
            if (selected && selected !== '-- لا يوجد --') {
                setTimeout(() => loadChannels(selected), 600);
            }
        }

        // Make functions global
        window.closeModal = closeModal;
        window.showToast = showToast;

        console.log('🐭 MOUSE AI IPTV جاهز مع سيرفر شهار');
    }

    document.addEventListener('DOMContentLoaded', init);

})();
</script>

</body>
</html>
