<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>🐭м𝓞𝓊ŜⒺ AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}

body{

background:
radial-gradient(circle at top,#05315c,#010612 70%);

overflow-x:hidden;

color:#fff;

display:flex;

flex-direction:column;

align-items:center;

padding:40px;

min-height:100vh;

}

/*=====================
FALLING STARS
======================*/

#stars{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

overflow:hidden;

z-index:0;

}

.star{

position:absolute;

background:#fff;

border-radius:50%;

box-shadow:

0 0 6px #fff,
0 0 15px #00cfff,
0 0 30px #00cfff;

animation:fall linear infinite;

}

@keyframes fall{

0%{

transform:
translateY(-100px)
translateX(0);

opacity:1;

}

100%{

transform:
translateY(110vh)
translateX(-250px);

opacity:0;

}

}

/*=====================
LOGO
======================*/

.logo{

position:relative;

font-size:60px;

font-weight:bold;

letter-spacing:3px;

color:#9fe9ff;

margin-bottom:70px;

z-index:2;

text-shadow:

0 0 10px #00bfff,
0 0 25px #00bfff,
0 0 50px #00cfff,
0 0 90px #008cff;

animation:glow 2s infinite alternate;

}

.logo::before{

content:"🔥";

position:absolute;

top:-55px;

left:50%;

transform:translateX(-50%);

font-size:45px;

filter:

hue-rotate(180deg)

drop-shadow(0 0 12px #00cfff)

drop-shadow(0 0 35px #00cfff);

animation:fire 1s infinite;

}

@keyframes glow{

from{

text-shadow:

0 0 10px #00bfff,
0 0 20px #00bfff,
0 0 40px #00bfff;

}

to{

text-shadow:

0 0 20px #00ffff,
0 0 40px #00d9ff,
0 0 80px #00bfff,
0 0 120px #00bfff;

}

}

@keyframes fire{

0%{

transform:
translateX(-50%)
translateY(0);

}

50%{

transform:
translateX(-50%)
translateY(-10px);

}

100%{

transform:
translateX(-50%)
translateY(0);

}

}

/*=====================
ARTICLE
======================*/

.article{

position:relative;

z-index:2;

width:90%;

max-width:950px;

padding:40px;

background:rgba(255,255,255,.05);

border:2px solid #00bfff;

border-radius:20px;

backdrop-filter:blur(8px);

box-shadow:

0 0 30px #00bfff55,

inset 0 0 20px #00bfff22;

line-height:2.2;

font-size:23px;

}

.article::before{

content:"";

position:absolute;

top:-3px;
right:-3px;

width:80px;
height:80px;

border-top:5px solid #00d9ff;
border-right:5px solid #00d9ff;

}

.article::after{

content:"";

position:absolute;

bottom:-3px;
left:-3px;

width:80px;
height:80px;

border-bottom:5px solid #00d9ff;
border-left:5px solid #00d9ff;

}

.article h2{

margin:25px 0;

text-align:center;

color:#00e1ff;

font-size:35px;

text-shadow:

0 0 12px #00cfff;

}

.author{

margin-top:35px;

text-align:left;

font-size:25px;

font-weight:bold;

color:#8de9ff;

}

.share{

margin-top:35px;

padding:15px 40px;

font-size:22px;

border:none;

border-radius:12px;

background:#000;

color:white;

cursor:pointer;

border:2px solid #00cfff;

transition:.4s;

z-index:2;

}

.share:hover{

background:#00bfff;

color:black;

box-shadow:

0 0 25px #00bfff;

}

</style>

</head>

<body>

<div id="stars"></div>

<div class="logo">

🐭м𝓞𝓊ŜⒺ AI

</div>

<div class="article">

<p>
سنتطور مع أول إرهاصات التوقف عن
 الشيتة تضخيم التفاهات  تدشين المشاريع الصغيرة على أنها إنجازات تاريخية تحويل كل حدث عادي إلى ملحمة إعلامية
أما قبل ذلك... فسيظل شعار المرحلة


</p>

<h2>

بعاد... بعاد... بعاد

</h2>

<div class="author">

 🐭м𝓞𝓊ŜⒺ AI

</div>

</div>

<button class="share" onclick="shareX()">

🐦 مشاركة على X

</button>

<script>

/* النجوم */

const stars=document.getElementById("stars");

for(let i=0;i<160;i++){

let star=document.createElement("div");

star.className="star";

let size=Math.random()*3+1;

star.style.width=size+"px";
star.style.height=size+"px";

star.style.left=Math.random()*100+"%";

star.style.top=Math.random()*-1200+"px";

star.style.animationDuration=(Math.random()*6+4)+"s";

star.style.animationDelay=Math.random()*8+"s";

stars.appendChild(star);

}

/* مشاركة X */

function shareX(){

let text=`سنتطور مع أول إرهاصات التوقف عن الشيتة، وتضخيم التفاهات، وتدشين المشاريع الصغيرة على أنها إنجازات تاريخية... أما قبل ذلك فسيظل شعار المرحلة: بعاد... بعاد... بعاد`;

window.open(

"https://twitter.com/intent/tweet?text="+encodeURIComponent(text),

"_blank"

);

}

</script>

</body>
</html>
