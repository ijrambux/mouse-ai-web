<!DOCTYPE html>
<html dir="ltr" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐭м𝓞𝓊ŜⒺ AI - توليد فيديوهات وصور احترافية</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 45px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            display: inline-block;
            background: linear-gradient(90deg, #00d4ff, #0077ff, #a855f7, #00d4ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease-in-out infinite, float 3s ease-in-out infinite;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        /* ===== TABS ===== */
        .tabs {
            display: flex;
            gap: 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .tab-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            background: transparent;
            color: #666;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
            text-align: center;
            min-width: 100px;
        }
        .tab-btn.active {
            background: rgba(0, 212, 255, 0.08);
            color: #00d4ff;
            box-shadow: inset 0 -2px 0 #00d4ff;
        }
        .tab-btn:hover:not(.active) {
            color: #aaa;
            background: rgba(255, 255, 255, 0.03);
        }
        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            resize: vertical;
            font-family: inherit;
            min-height: 80px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.05), inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea::placeholder {
            color: #555;
        }
        /* ===== IMAGE UPLOAD ===== */
        .image-upload-area {
            margin-bottom: 20px;
            padding: 20px;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255, 255, 255, 0.02);
            display: none;
        }
        .image-upload-area:hover {
            border-color: rgba(0, 212, 255, 0.3);
            background: rgba(0, 212, 255, 0.02);
        }
        .image-upload-area.dragover {
            border-color: #00d4ff;
            background: rgba(0, 212, 255, 0.05);
        }
        .image-upload-area .upload-icon {
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }
        .image-upload-area .upload-text {
            color: #888;
            font-size: 14px;
        }
        .image-upload-area .upload-text strong {
            color: #00d4ff;
        }
        .image-preview {
            margin-top: 15px;
            display: none;
            position: relative;
            max-width: 100%;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .image-preview .remove-image {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: #ff6b6b;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }
        .image-preview .remove-image:hover {
            background: rgba(255, 0, 0, 0.3);
            transform: scale(1.1);
        }
        /* ===== OPTIONS ===== */
        .options-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .option-group {
            flex: 1;
            min-width: 130px;
        }
        .option-group .option-label {
            display: block;
            font-size: 13px;
            color: #888;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .option-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .opt-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            color: #777;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .opt-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #ccc;
        }
        .opt-btn.active {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .opt-btn .sub {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            font-weight: 400;
        }
        /* ===== GENERATE BUTTON ===== */
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 119, 255, 0.12));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 18px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            margin-top: 8px;
        }
        .generate-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 119, 255, 0.2));
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.1);
        }
        .generate-btn:active {
            transform: translateY(0px);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .generate-btn .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .generate-btn.loading .spinner {
            display: block;
        }
        .generate-btn.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* ===== VIDEO / IMAGE RESULT ===== */
        .result-wrapper {
            margin-top: 24px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
            position: relative;
        }
        .result-wrapper.show {
            display: block;
            animation: fadeSlide 0.5s ease-out;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-wrapper video {
            width: 100%;
            display: block;
            border-radius: 18px 18px 0 0;
        }
        .result-wrapper img {
            width: 100%;
            display: block;
            border-radius: 18px 18px 0 0;
        }
        .result-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 10px;
        }
        .result-controls .result-label {
            font-size: 13px;
            color: #00d4ff;
            font-weight: 600;
        }
        .result-controls .result-label span {
            opacity: 0.5;
            font-weight: 400;
            color: #888;
        }
        .download-btn {
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 119, 255, 0.15));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .download-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 119, 255, 0.25));
            border-color: rgba(0, 212, 255, 0.4);
            transform: scale(1.02);
        }
        .download-btn:active {
            transform: scale(0.98);
        }
        /* ===== IMAGE SIZE OPTIONS ===== */
        .size-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .size-options .opt-btn {
            padding: 4px 14px;
            font-size: 12px;
        }
        /* ===== LOG ===== */
        .log-box {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 150px;
            overflow-y: auto;
        }
        .log-box .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #666;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }
        .log-box .log-entry .time {
            color: #444;
            margin-right: 10px;
        }
        .log-box .log-entry.success {
            color: #00d4ff;
        }
        .log-box .log-entry.error {
            color: #ff6b6b;
        }
        .log-box .log-entry.info {
            color: #88ccff;
        }
        .log-box::-webkit-scrollbar {
            width: 4px;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 24px; }
            .logo { font-size: 32px; }
            .options-row { flex-direction: column; gap: 16px; }
            .tab-btn { font-size: 13px; padding: 12px 10px; }
            .result-controls { flex-direction: column; align-items: stretch; }
            .download-btn { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- HEADER -->
    <div class="header">
        <div class="logo">🐭м𝓞𝓊ŜⒺ AI</div>
        <div class="subtitle">توليد فيديوهات وصور احترافية بالذكاء الاصطناعي</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="video">📹 فيديو من نص</button>
        <button class="tab-btn" data-tab="image">🖼️ فيديو من صورة</button>
        <button class="tab-btn" data-tab="imagegen">🎨 توليد صورة</button>
    </div>

    <!-- PROMPT -->
    <div class="form-group">
        <label for="promptInput">📝 الوصف (Prompt)</label>
        <textarea id="promptInput" placeholder="اكتب وصفاً تفصيلياً، مثلاً: منظر غروب شمس فوق جبال، سينمائي بدقة عالية">Slow motion waves crashing against rocks, cinematic 4K</textarea>
    </div>

    <!-- IMAGE UPLOAD (للصورة إلى فيديو) -->
    <div id="imageUploadArea" class="image-upload-area">
        <span class="upload-icon">🖼️</span>
        <div class="upload-text">
            <strong>انقر أو اسحب</strong> صورة هنا لرفعها<br>
            <span style="font-size: 12px; color: #555;">يدعم JPG, PNG, WEBP (حتى 10 ميجابايت)</span>
        </div>
        <input type="file" id="imageInput" accept="image/*" style="display: none;">
        <div class="image-preview" id="imagePreview">
            <img id="previewImg" src="#" alt="معاينة الصورة">
            <button class="remove-image" id="removeImageBtn">✕</button>
        </div>
    </div>

    <!-- OPTIONS -->
    <div class="options-row">
        <!-- خيارات المدة (للفيديو) -->
        <div class="option-group" id="durationGroupWrapper">
            <span class="option-label">⏱️ المدة</span>
            <div class="option-buttons" id="durationGroup">
                <button class="opt-btn" data-value="5">5 ثوان</button>
                <button class="opt-btn active" data-value="10">10 ثوان</button>
            </div>
        </div>
        <!-- خيارات نسبة الأبعاد (للفيديو والصورة) -->
        <div class="option-group">
            <span class="option-label">📐 نسبة الأبعاد</span>
            <div class="option-buttons" id="aspectGroup">
                <button class="opt-btn active" data-value="16:9">16:9 <span class="sub">أفقي</span></button>
                <button class="opt-btn" data-value="9:16">9:16 <span class="sub">عمودي</span></button>
                <button class="opt-btn" data-value="1:1">1:1 <span class="sub">مربع</span></button>
            </div>
        </div>
        <!-- خيارات حجم الصورة (لـ Image Generation) -->
        <div class="option-group" id="sizeGroupWrapper" style="display: none;">
            <span class="option-label">📏 حجم الصورة</span>
            <div class="size-options" id="sizeGroup">
                <button class="opt-btn" data-value="256x256">256×256</button>
                <button class="opt-btn active" data-value="512x512">512×512</button>
                <button class="opt-btn" data-value="1024x1024">1024×1024</button>
                <button class="opt-btn" data-value="1024x1792">1024×1792</button>
                <button class="opt-btn" data-value="1792x1024">1792×1024</button>
            </div>
        </div>
    </div>

    <!-- GENERATE BUTTON -->
    <button class="generate-btn" id="generateBtn">
        <span class="btn-text">🚀 توليد</span>
        <span class="spinner"></span>
    </button>

    <!-- RESULT (فيديو أو صورة) -->
    <div class="result-wrapper" id="resultWrapper">
        <video id="videoPlayer" controls autoplay loop style="display: none;"></video>
        <img id="imageResult" src="#" alt="النتيجة" style="display: none; width: 100%;">
        <div class="result-controls">
            <div class="result-label">✨ 🐭м𝓞𝓊ŜⒺ AI <span>• تم التوليد بالذكاء الاصطناعي</span></div>
            <button class="download-btn" id="downloadBtn">⬇️ تحميل</button>
        </div>
    </div>

    <!-- LOG -->
    <div class="log-box" id="logBox">
        <div class="log-entry info"><span class="time">[الآن]</span> 🎬 مرحباً بك في 🐭м𝓞𝓊ŜⒺ AI!</div>
        <div class="log-entry info"><span class="time">[الآن]</span> 📝 اكتب وصفاً تفصيلياً للحصول على أفضل النتائج</div>
    </div>
</div>

<script>
    (function() {
        'use strict';

        // ---- DOM Elements ----
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const logBox = document.getElementById('logBox');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const durationBtns = document.querySelectorAll('#durationGroup .opt-btn');
        const aspectBtns = document.querySelectorAll('#aspectGroup .opt-btn');
        const sizeBtns = document.querySelectorAll('#sizeGroup .opt-btn');
        const resultWrapper = document.getElementById('resultWrapper');
        const videoPlayer = document.getElementById('videoPlayer');
        const imageResult = document.getElementById('imageResult');
        const downloadBtn = document.getElementById('downloadBtn');
        const imageUploadArea = document.getElementById('imageUploadArea');
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const removeImageBtn = document.getElementById('removeImageBtn');
        const durationGroupWrapper = document.getElementById('durationGroupWrapper');
        const sizeGroupWrapper = document.getElementById('sizeGroupWrapper');

        // ---- State ----
        let isGenerating = false;
        let currentTab = 'video';
        let selectedDuration = '10';
        let selectedAspect = '16:9';
        let selectedSize = '512x512';
        let currentResultBlobUrl = null;
        let currentResultType = 'video'; // 'video' or 'image'
        let uploadedImageData = null;

        const API_BASE = 'https://mouse-ai-nine.vercel.app';

        // ---- Helpers ----
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function resetButton() {
            generateBtn.classList.remove('loading');
            generateBtn.disabled = false;
            const span = generateBtn.querySelector('.btn-text');
            const labels = {
                'video': '🚀 توليد فيديو',
                'image': '🖼️ توليد فيديو من صورة',
                'imagegen': '🎨 توليد صورة'
            };
            span.textContent = labels[currentTab] || '🚀 توليد';
        }

        function setLoading() {
            generateBtn.classList.add('loading');
            generateBtn.disabled = true;
        }

        function showResult(url, type = 'video') {
            currentResultBlobUrl = url;
            currentResultType = type;
            
            if (type === 'video') {
                videoPlayer.style.display = 'block';
                imageResult.style.display = 'none';
                videoPlayer.src = url;
                videoPlayer.play().catch(() => {});
            } else {
                videoPlayer.style.display = 'none';
                imageResult.style.display = 'block';
                imageResult.src = url;
            }
            
            resultWrapper.classList.add('show');
            addLog(`✅ ${type === 'video' ? 'الفيديو' : 'الصورة'} جاهز للمشاهدة والتحميل`, 'success');
        }

        // ---- تحميل النتيجة ----
        downloadBtn.addEventListener('click', function() {
            if (!currentResultBlobUrl) {
                addLog('❌ لا يوجد نتيجة للتحميل. قم بالتوليد أولاً.', 'error');
                return;
            }
            const a = document.createElement('a');
            a.href = currentResultBlobUrl;
            const ext = currentResultType === 'video' ? 'mp4' : 'png';
            a.download = `MoUsE_AI_${currentResultType}_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.${ext}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            addLog(`⬇️ بدء تحميل ${currentResultType === 'video' ? 'الفيديو' : 'الصورة'}...`, 'info');
        });

        // ---- رفع الصورة ----
        function handleImageUpload(file) {
            if (!file) return;
            if (file.size > 10 * 1024 * 1024) {
                addLog('❌ حجم الصورة كبير جداً (الحد الأقصى 10 ميجابايت)', 'error');
                return;
            }
            const validTypes = ['image/jpeg', 'image/png', 'image/webp'];
            if (!validTypes.includes(file.type)) {
                addLog('❌ نوع الصورة غير مدعوم (JPG, PNG, WEBP فقط)', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedImageData = e.target.result;
                previewImg.src = uploadedImageData;
                imagePreview.style.display = 'block';
                imageUploadArea.querySelector('.upload-text').style.display = 'none';
                imageUploadArea.querySelector('.upload-icon').style.display = 'none';
                addLog(`✅ تم رفع الصورة: ${file.name} (${(file.size / 1024).toFixed(1)} كيلوبايت)`, 'success');
            };
            reader.readAsDataURL(file);
        }

        imageUploadArea.addEventListener('click', () => imageInput.click());
        imageInput.addEventListener('change', function() {
            if (this.files && this.files[0]) handleImageUpload(this.files[0]);
        });

        imageUploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            imageUploadArea.classList.add('dragover');
        });
        imageUploadArea.addEventListener('dragleave', () => {
            imageUploadArea.classList.remove('dragover');
        });
        imageUploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            imageUploadArea.classList.remove('dragover');
            if (e.dataTransfer.files && e.dataTransfer.files[0]) {
                handleImageUpload(e.dataTransfer.files[0]);
            }
        });

        removeImageBtn.addEventListener('click', function() {
            uploadedImageData = null;
            imagePreview.style.display = 'none';
            imageUploadArea.querySelector('.upload-text').style.display = 'block';
            imageUploadArea.querySelector('.upload-icon').style.display = 'block';
            imageInput.value = '';
            addLog('🔄 تم إزالة الصورة', 'info');
        });

        // ---- Tab Switching ----
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                
                // إخفاء كل العناصر الخاصة
                imageUploadArea.style.display = 'none';
                durationGroupWrapper.style.display = 'block';
                sizeGroupWrapper.style.display = 'none';
                
                // إظهار العناصر حسب التبويب
                if (currentTab === 'image') {
                    imageUploadArea.style.display = 'block';
                    if (!uploadedImageData) {
                        addLog('📷 يرجى رفع صورة لتوليد فيديو منها', 'info');
                    }
                } else if (currentTab === 'imagegen') {
                    durationGroupWrapper.style.display = 'none';
                    sizeGroupWrapper.style.display = 'block';
                }
                
                // إعادة تعيين النتيجة
                resultWrapper.classList.remove('show');
                videoPlayer.src = '';
                imageResult.src = '';
                currentResultBlobUrl = null;
                
                const labels = {
                    'video': '🚀 توليد فيديو',
                    'image': '🖼️ توليد فيديو من صورة',
                    'imagegen': '🎨 توليد صورة'
                };
                generateBtn.querySelector('.btn-text').textContent = labels[currentTab];
                addLog(`🔄 التبديل إلى: ${labels[currentTab]}`, 'info');
            });
        });

        // ---- Option Buttons ----
        function setupOptionButtons(buttons, stateKey) {
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    buttons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    if (stateKey === 'duration') selectedDuration = this.dataset.value;
                    else if (stateKey === 'aspect') selectedAspect = this.dataset.value;
                    else if (stateKey === 'size') selectedSize = this.dataset.value;
                    addLog(`⚙️ ${stateKey}: ${this.textContent.trim()}`, 'info');
                });
            });
        }
        setupOptionButtons(durationBtns, 'duration');
        setupOptionButtons(aspectBtns, 'aspect');
        setupOptionButtons(sizeBtns, 'size');

        // ---- Generate ----
        generateBtn.addEventListener('click', async function() {
            if (isGenerating) return;

            const prompt = promptInput.value.trim();
            if (!prompt || prompt.length < 5) {
                addLog('❌ الرجاء إدخال وصف (5 أحرف على الأقل)', 'error');
                return;
            }

            if (currentTab === 'image' && !uploadedImageData) {
                addLog('❌ يرجى رفع صورة أولاً', 'error');
                return;
            }

            isGenerating = true;
            setLoading();
            resultWrapper.classList.remove('show');
            videoPlayer.src = '';
            imageResult.src = '';
            currentResultBlobUrl = null;

            const modeNames = {
                'video': 'فيديو من نص',
                'image': 'فيديو من صورة',
                'imagegen': 'صورة'
            };
            addLog(`🚀 بدء توليد ${modeNames[currentTab]}...`, 'info');
            addLog(`📝 البرومبت: ${prompt.substring(0, 60)}...`, 'info');

            try {
                const formData = new FormData();
                formData.append('prompt', prompt);
                formData.append('mode', currentTab);
                formData.append('aspect', selectedAspect);
                
                if (currentTab === 'video' || currentTab === 'image') {
                    formData.append('duration', selectedDuration);
                }
                
                if (currentTab === 'imagegen') {
                    formData.append('size', selectedSize);
                }
                
                if (uploadedImageData) {
                    const response = await fetch(uploadedImageData);
                    const blob = await response.blob();
                    formData.append('image', blob, 'uploaded_image.jpg');
                }

                const response = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    body: formData,
                    signal: AbortSignal.timeout(310000)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const type = currentTab === 'imagegen' ? 'image' : 'video';
                    showResult(url, type);
                } else {
                    let errorMsg = `خطأ ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.detail) errorMsg += `: ${errData.detail}`;
                        else if (errData.message) errorMsg += `: ${errData.message}`;
                    } catch (e) {
                        const text = await response.text();
                        if (text) errorMsg += `: ${text.substring(0, 100)}`;
                    }
                    addLog(`❌ فشل التوليد: ${errorMsg}`, 'error');
                }
            } catch (err) {
                if (err.name === 'TimeoutError' || err.name === 'AbortError') {
                    addLog('❌ انتهى الوقت. الخادم مشغول، حاول مرة أخرى.', 'error');
                } else {
                    addLog(`❌ خطأ: ${err.message}`, 'error');
                }
            } finally {
                isGenerating = false;
                resetButton();
                addLog('⏳ جاهز لتوليد جديد', 'info');
            }
        });

        // ---- Check Server ----
        async function checkServer() {
            try {
                const res = await fetch(`${API_BASE}/status`, { signal: AbortSignal.timeout(5000) });
                if (res.ok) addLog('✅ الخادم متصل', 'success');
                else addLog('⚠️ الخادم يستجيب بشكل غير متوقع', 'error');
            } catch {
                addLog('❌ الخادم غير متاح', 'error');
            }
        }
        setTimeout(checkServer, 1000);

        // ---- Init ----
        addLog('', 'info');
        addLog(`⏱️ المدة: ${selectedDuration} ثانية | 📐 نسبة الأبعاد: ${selectedAspect}`, 'info');

    })();
</script>

</body>
</html>
