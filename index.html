<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOUSE AI - IPTV Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0d0d0d; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* HEADER */
        header { background: #1a1a1a; padding: 15px 30px; border-bottom: 2px solid #333; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand .icon { font-size: 30px; }
        .brand .text { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
        .brand .text span { color: #6c5ce7; }
        .header-icons { font-size: 20px; color: #aaa; cursor: pointer; }
        .header-icons i { margin-left: 15px; }

        /* LAYOUT */
        .app-container { display: flex; flex: 1; overflow: hidden; }
        
        /* SIDEBAR */
        .sidebar { width: 380px; background: #121212; border-left: 2px solid #222; display: flex; flex-direction: column; overflow: hidden; }
        .sidebar-header { padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; background: #161616; }
        .sidebar-header h3 { font-size: 16px; font-weight: 600; color: #aaa; letter-spacing: 1px; }
        
        .channels-list { flex: 1; overflow-y: auto; padding: 10px 15px; }
        .channels-list::-webkit-scrollbar { width: 5px; }
        .channels-list::-webkit-scrollbar-thumb { background: #6c5ce7; border-radius: 10px; }

        /* CHANNEL ITEM */
        .channel-item {
            display: flex; align-items: center; padding: 12px 10px; border-radius: 8px;
            cursor: pointer; transition: 0.2s; margin-bottom: 8px; position: relative;
        }
        .channel-item:hover { background: #1f1f1f; }
        .channel-item.active { background: #d90000; }
        .channel-item .num { width: 30px; font-size: 14px; color: #888; font-weight: bold; }
        .channel-item .logo { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin: 0 15px; }
        .channel-item .logo img { max-width: 100%; max-height: 100%; border-radius: 6px; }
        .channel-item .logo .fallback { width: 40px; height: 40px; background: #222; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .channel-item .name { flex: 1; font-size: 15px; font-weight: 600; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item.active .name { color: #fff; }
        .channel-item .fav { color: #555; font-size: 18px; transition: 0.2s; }
        .channel-item .fav:hover { color: #fff; }
        .channel-item.active .fav { color: #fff; }

        /* MAIN PLAYER */
        .main-player { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
        .video-wrapper { flex: 1; position: relative; background: #0a0a0a; display: flex; align-items: center; justify-content: center; }
        #videoPlayer { width: 100%; height: 100%; }
        
        .info-overlay {
            position: absolute; bottom: 40px; left: 40px; pointer-events: none;
            background: rgba(0,0,0,0.7); padding: 15px 25px; border-radius: 10px;
            border-left: 4px solid #d90000;
        }
        .info-overlay .tag { background: #d90000; color: #fff; padding: 2px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; display: inline-block; margin-bottom: 5px; }
        .info-overlay h2 { font-size: 22px; font-weight: bold; margin: 0; }

        /* RIGHT INFO PANEL */
        .info-panel {
            width: 350px; background: #151515; border-left: 1px solid #222; border-top: 1px solid #222;
            padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .info-panel .placeholder { color: #444; text-align: center; }
        .info-panel .placeholder i { font-size: 60px; margin-bottom: 20px; }
        .info-panel .placeholder h3 { font-size: 18px; font-weight: 400; }

        /* RESPONSIVE */
        @media (max-width: 1000px) { 
            .sidebar { width: 100%; height: 250px; border-top: 2px solid #222; border-left: none; }
            .app-container { flex-direction: column-reverse; }
            .main-player { height: 300px; }
            .info-panel { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="icon">🐭</span>
            <div class="text">MOUSE <span>AI</span></div>
        </div>
        <div class="header-icons">
            <i class="fas fa-search"></i>
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </header>

    <div class="app-container">
        
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-list" style="margin-left:10px;"></i> LIVE TV</h3>
                <span id="countText" style="font-size:13px; color:#555;">جاري التحميل...</span>
            </div>
            <div class="channels-list" id="channelsList">
                <div style="padding:20px; text-align:center; color:#666;">
                    <i class="fas fa-spinner fa-spin" style="font-size:30px; margin-bottom:15px; display:block;"></i>
                    جلب القنوات من السيرفر...
                </div>
            </div>
        </div>

        <!-- MAIN PLAYER -->
        <div class="main-player">
            <div class="video-wrapper">
                <video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto" style="width:100%; height:100%;"></video>
                <div class="info-overlay" id="overlayInfo">
                    <div class="tag">LIVE TV</div>
                    <h2 id="currentChannelName">اضغط على قناة للبدء</h2>
                </div>
            </div>
        </div>

        <!-- RIGHT INFO PANEL -->
        <div class="info-panel" id="infoPanel">
            <div class="placeholder">
                <i class="fas fa-play-circle"></i>
                <h3>Category name</h3>
                <p style="color:#555; margin-top:10px; font-size:14px;">اختر قناة لعرض التفاصيل</p>
            </div>
        </div>
    </div>

    <script>
        // إعداد مشغل الفيديو
        const player = videojs('videoPlayer', {
            controls: true, autoplay: true, preload: 'auto', fluid: true,
            html5: { vhs: { enableLowInitialPlaylist: true, smoothQualityChange: true } }
        });

        // بياناتك الخاصة (هنا وضعت بياناتك لتعمل)
        const M3U_URL = "http://melones.bollo.hofcepesp1.top:8080/get.php?username=ES0129178155217538&password=qfkt3nxdc5px&type=m3u_plus";
        
        // ------------------------------------------------------------------
        // ملاحظة هامة جداً: Vercel لا يسمح بالاتصال المباشر بخوادم خارجية (CORS).
        // الحل المؤقت لهذا: استخدام "CORS Proxy" مجاني لتمرير الطلب.
        // ------------------------------------------------------------------
        const PROXY_URL = "https://api.allorigins.win/raw?url="; 

        async function loadChannels() {
            try {
                // جلب ملف الـ M3U عبر الـ Proxy المخصص لـ Vercel
                const response = await fetch(PROXY_URL + encodeURIComponent(M3U_URL));
                const data = await response.text();
                
                const channels = parseM3U(data);
                if(channels.length > 0){
                    renderChannels(channels);
                } else {
                    document.getElementById('channelsList').innerHTML = '<div style="padding:20px; text-align:center; color:#666;">لم يتم العثور على قنوات في هذا الرابط.</div>';
                }
            } catch (error) {
                console.error(error);
                document.getElementById('channelsList').innerHTML = '<div style="padding:20px; text-align:center; color:#e74c3c;">فشل الاتصال بالسيرفر. تأكد من صحة البيانات.</div>';
                document.getElementById('countText').textContent = 'خطأ في الاتصال';
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let current = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    const name = parts.pop();
                    
                    // استخراج الشعار والمجموعة
                    const logoMatch = line.match(/tvg-logo="(.*?)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    const groupMatch = line.match(/group-title="(.*?)"/);
                    const group = groupMatch ? groupMatch[1] : 'أخرى';
                    
                    current = { name: name, logo: logo, group: group };
                } else if (line.startsWith('http') && current.name) {
                    current.url = line;
                    channels.push(current);
                    current = {};
                }
            });
            return channels;
        }

        function renderChannels(channels) {
            const listContainer = document.getElementById('channelsList');
            document.getElementById('countText').textContent = channels.length + ' قناة';
            
            listContainer.innerHTML = '';
            
            channels.forEach((ch, index) => {
                // تنسيق آمن للبيانات
                const safeUrl = ch.url.replace(/'/g, "\\'");
                const safeName = ch.name.replace(/'/g, "\\'");
                const safeLogo = ch.logo.replace(/'/g, "\\'");
                
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.setAttribute('onclick', `playChannel('${safeUrl}', '${safeName}', '${safeLogo}')`);
                
                item.innerHTML = `
                    <div class="num">${index + 1}</div>
                    <div class="logo">
                        ${safeLogo ? `<img src="${safeLogo}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />` : ''}
                        <div class="fallback" style="${safeLogo ? 'display:none;' : ''}"><i class="fas fa-tv"></i></div>
                    </div>
                    <div class="name">${safeName}</div>
                    <div class="fav"><i class="far fa-heart"></i></div>
                `;
                
                listContainer.appendChild(item);
            });
        }

        function playChannel(url, name, logo) {
            if(!url) return;
            
            player.src({ type: 'application/x-mpegURL', src: url });
            player.play();
            
            document.getElementById('currentChannelName').innerHTML = name;
            
            const panel = document.getElementById('infoPanel');
            panel.innerHTML = `
                <div style="text-align:center; width:100%;">
                    <div style="width:100px; height:100px; background:#222; border-radius:20px; margin:0 auto 20px; display:flex; align-items:center; justify-content:center; border:2px solid #d90000;">
                        ${logo ? `<img src="${logo}" style="max-width:80%; max-height:80%; border-radius:10px;" onerror="this.outerHTML='<i class=\'fas fa-tv\' style=\'font-size:40px; color:#555;\'></i>'" />` : `<i class="fas fa-tv" style="font-size:40px; color:#555;"></i>`}
                    </div>
                    <span style="background:#d90000; padding:4px 12px; border-radius:4px; font-weight:bold; font-size:12px;">LIVE TV</span>
                    <h2 style="margin-top:15px; font-size:24px;">${name}</h2>
                    <p style="color:#555; margin-top:10px;">قناة مباشرة عالية الجودة</p>
                </div>
            `;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.channel-item')?.classList.add('active');
        }

        // تشغيل التحميل فور فتح الصفحة
        loadChannels();
    </script>
</body>
</html>
