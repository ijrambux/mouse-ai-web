<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOUSE AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Tahoma, Arial, sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #05315c, #010612 70%);
            overflow: hidden;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* النجوم المتساقطة */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 15px #00cfff, 0 0 30px #00cfff;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px);
            }
            100% {
                transform: translate(-250px, 110vh);
                opacity: 0;
            }
        }

        /* الشعار الرئيسي */
        .logo {
            position: relative;
            font-size: 64px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-bottom: 40px;
            color: transparent;
            background: linear-gradient(90deg, #fff, #bff8ff, #00d9ff, #fff, #00d9ff, #bff8ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: water 5s linear infinite, pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 8px #00cfff) drop-shadow(0 0 25px #00cfff) drop-shadow(0 0 60px #008cff);
            text-align: center;
            width: 100%;
        }

        .logo::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 220, 255, 0.5), transparent 70%);
            filter: blur(25px);
            z-index: -1;
            animation: aura 4s infinite;
        }

        .logo::after {
            content: "";
            position: absolute;
            top: 0;
            left: -50%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
            transform: skewX(-25deg);
            animation: shine 3s infinite;
        }

        @keyframes water {
            to {
                background-position: 300% 0;
            }
        }

        @keyframes shine {
            to {
                left: 150%;
            }
        }

        @keyframes aura {
            50% {
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        @keyframes pulse {
            50% {
                transform: scale(1.04);
            }
        }

        /* مربع النص */
        .article {
            width: 90%;
            max-width: 950px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #00bfff;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            line-height: 2.2;
            font-size: 23px;
            margin-bottom: 30px;
            text-align: center;
        }

        .article p {
            margin-bottom: 20px;
        }

        .article h2 {
            font-size: 32px;
            color: #00d9ff;
            letter-spacing: 3px;
            margin: 10px 0;
        }

        .article .signature {
            font-size: 22px;
            margin-top: 20px;
            color: #ccc;
        }

        .article .signature span {
            color: #00d9ff;
        }

        /* زر المشاركة */
        .share {
            background: transparent;
            border: 2px solid #00bfff;
            color: #00d9ff;
            padding: 14px 35px;
            font-size: 20px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
            margin-top: 5px;
            font-weight: bold;
        }

        .share:hover {
            background: #00bfff;
            color: #010612;
            box-shadow: 0 0 30px #00bfff;
            transform: scale(1.05);
        }

        /* نص التذييل */
        .footer {
            margin-top: 25px;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            line-height: 1.6;
            letter-spacing: 1px;
        }

        .footer .x-handle {
            color: #00d9ff;
            font-weight: bold;
        }

        .footer .x-link {
            color: #00d9ff;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer .x-link:hover {
            text-shadow: 0 0 15px #00d9ff;
        }

        /* التوافق مع الشاشات الصغيرة */
        @media (max-width: 600px) {
            .logo {
                font-size: 40px;
            }
            .article {
                font-size: 18px;
                padding: 25px;
            }
            .article h2 {
                font-size: 26px;
            }
            .share {
                font-size: 17px;
                padding: 12px 25px;
            }
            .footer {
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div id="stars"></div>

    <!-- الشعار الرئيسي -->
    <div class="logo">🐭 MOUSE AI</div>

    <!-- المحتوى النصي -->
    <div class="article">
        <p>
            سنتطور مع أول إرهاصات التوقف عن<br />
            الشيتة، تضخيم التفاهات، تدشين المشاريع الصغيرة<br />
            على أنها إنجازات تاريخية، وتحويل كل حدث عادي<br />
            إلى ملحمة إعلامية.
        </p>
        <p style="font-size:20px; color:#aaa;">أما قبل ذلك... فسيظل شعار المرحلة</p>
        <h2>بعاد... بعاد... بعاد</h2>
        <div class="signature">✍ <span>🐭 MOUSE AI</span></div>
    </div>

    <!-- زر مشاركة X -->
    <button class="share" onclick="shareX()">🐦 تابعني على X</button>

    <!-- تذييل الصفحة -->
    <div class="footer">
        <span class="x-handle">@mouse0000000</span><br />
        <a href="https://x.com/mouse0000000" target="_blank" class="x-link">تابعني على X</a>
    </div>

    <script>
        // توليد النجوم المتساقطة
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 160; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * -1200 + 'px';
            star.style.animationDuration = (4 + Math.random() * 6) + 's';
            star.style.animationDelay = (Math.random() * 8) + 's';
            starsContainer.appendChild(star);
        }

        // وظيفة المشاركة على X
        function shareX() {
            const text = "سنتطور مع أول إرهاصات التوقف عن الشيتة، تضخيم التفاهات، تدشين المشاريع الصغيرة على أنها إنجازات تاريخية، وتحويل كل حدث عادي إلى ملحمة إعلامية. أما قبل ذلك... فسيظل شعار المرحلة بعاد... بعاد... بعاد 🐭 MOUSE AI";
            const url = encodeURIComponent(window.location.href);
            window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + url, '_blank');
        }
    </script>
</body>
</html>
