<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐭 MOUSE AI IPTV</title>
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiTU9VU0UgQUkgSVBUViIsInNob3J0X25hbWUiOiJNQUktSVBUViIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGEwYzBmIiwidGhlbWVfY29sb3IiOiIjMDBmZjg4In0=">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.0"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#0a0c0f;--card:#111418;--input:#161a20;--border:#1e242c;--green:#00ff88;--red:#ff2a2a;--text:#fff;--text2:#8b95a5}
        body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,Arial,sans-serif;height:100vh;overflow:hidden}
        .app{display:flex;height:100vh;gap:10px;padding:10px}
        .left{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
        .video-box{flex:1;background:#000;border-radius:16px;border:3px solid var(--green);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
        video{width:100%;height:100%;object-fit:contain}
        .placeholder{color:var(--text2);font-size:18px;text-align:center;padding:20px}
        .controls{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px;display:flex;flex-direction:column;gap:8px}
        .ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
        .btn{background:var(--input);border:2px solid var(--green);color:var(--green);padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:13px;font-family:inherit;transition:.2s}
        .btn:hover{background:var(--green);color:#0a0c0f}
        .btn.danger{border-color:var(--red);color:var(--red)}
        .btn.danger:hover{background:var(--red);color:#fff}
        .btn.play{background:linear-gradient(180deg,#ff2a2a,#cc2222);border-color:#ff2a2a;color:#fff;font-size:15px}
        .btn.play.active{background:linear-gradient(180deg,#00ff88,#00cc6a);border-color:#00ff88}
        .right{width:420px;min-width:320px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
        .panel{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px}
        .title{color:var(--green);font-size:22px;font-weight:bold;text-align:center}
        .ver{color:var(--text2);font-size:11px;text-align:center;margin-bottom:10px}
        select,input{background:var(--input);border:2px solid var(--border);color:var(--text);padding:8px;border-radius:8px;font-family:inherit;font-size:13px;width:100%;margin-bottom:6px}
        select:focus,input:focus{border-color:var(--green);outline:none}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
        .status{text-align:center;font-size:12px;color:var(--text2);min-height:18px;margin-top:4px}
        .status.err{color:var(--red)} .status.ok{color:var(--green)}
        .progress{height:6px;background:var(--input);border-radius:3px;overflow:hidden;margin:6px 0;display:none}
        .progress>div{height:100%;background:linear-gradient(90deg,#ff2a2a,#00ff88,#fff);width:0%;transition:.3s}
        .list{flex:1;overflow-y:auto;background:var(--card);border:2px solid var(--border);border-radius:10px;padding:4px}
        .list::-webkit-scrollbar{width:6px}
        .list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .ch{padding:10px 14px;border-bottom:1px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:.15s}
        .ch:hover{background:var(--input)}
        .ch.active{background:var(--green);color:#0a0c0f;font-weight:bold}
        .ch img{width:32px;height:32px;border-radius:4px;object-fit:cover;background:var(--input)}
        .ch-name{flex:1;font-size:13px}
        .count{text-align:center;color:var(--text2);font-size:11px}
        .bottom{display:flex;gap:6px}
        .footer{text-align:center;font-size:10px;color:var(--text2)}
        .footer a{color:var(--green);text-decoration:none}
        .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center}
        .modal.show{display:flex}
        .modal-box{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:24px;width:90%;max-width:420px}
        .modal-box h2{color:var(--green);margin-bottom:16px;text-align:center}
        .modal-box label{display:block;margin:8px 0 4px;color:var(--text2);font-size:13px}
        .modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
        .tabs{display:flex;gap:4px;margin-bottom:8px}
        .tab{flex:1;padding:8px;background:var(--input);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;text-align:center;font-size:12px}
        .tab.active{background:var(--green);color:#0a0c0f;font-weight:bold}
        .api-key-pos{position:fixed;top:10px;left:10px;background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:8px;font-size:11px;color:var(--text2);z-index:100}
        .api-key-pos input{background:transparent;border:none;color:var(--green);font-family:monospace;width:180px;font-size:11px}
        @media(max-width:900px){.app{flex-direction:column}.right{width:100%;height:45%}}
    </style>
</head>
<body>
    <!-- إدخال API Key -->
    <div class="api-key-pos">
        🔑 API Key: <input type="password" id="apiKeyInput" value="mouse-ai-iptv-2024-secure" onchange="API_KEY=this.value">
    </div>

    <div class="app">
        <div class="left">
            <div class="video-box" id="vbox">
                <div class="placeholder" id="ph">🎯 اختر قناة للتشغيل</div>
                <video id="vid" style="display:none" playsinline></video>
            </div>
            <div class="controls">
                <input type="range" id="prog" min="0" max="1000" value="0" style="width:100%;margin-bottom:8px">
                <div class="ctrl-row">
                    <button class="btn" onclick="prev()">⏮ سابق</button>
                    <button class="btn play" id="pbtn" onclick="togglePlay()">▶ تشغيل</button>
                    <button class="btn danger" onclick="stop()">⏹ إيقاف</button>
                    <button class="btn" onclick="next()">⏭ تالي</button>
                    <div style="flex:1"></div>
                    <button class="btn" onclick="toggleMute()" id="mbtn">🔊</button>
                    <input type="range" min="0" max="100" value="100" style="width:90px" oninput="setVol(this.value)">
                    <button class="btn" onclick="toggleFS()">⛶</button>
                </div>
                <div style="text-align:center;color:var(--text2);font-size:13px" id="info">🎯 جاهز</div>
            </div>
        </div>

        <div class="right">
            <div class="panel">
                <div class="title">🐭 MOUSE AI IPTV</div>
                <div class="ver">v8.0 — السيرفر المحلي الآمن</div>
                
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('play',this)">▶ مشاهدة</div>
                    <div class="tab" onclick="switchTab('manage',this)">⚙️ إدارة</div>
                </div>

                <div id="tab-play">
                    <select id="srvSel"></select>
                    <div class="grid2">
                        <button class="btn" onclick="loadSrv()">📡 تحميل</button>
                        <button class="btn" onclick="document.getElementById('fup').click()">📁 ملف</button>
                    </div>
                    <div class="progress" id="pbar"><div id="pfill"></div></div>
                    <div class="status" id="st">🚀 جاهز</div>
                </div>

                <div id="tab-manage" style="display:none">
                    <input type="text" id="sn" placeholder="اسم السيرفر">
                    <input type="text" id="su" placeholder="رابط M3U">
                    <div class="grid2">
                        <button class="btn" onclick="addSrv()">➕ إضافة</button>
                        <button class="btn danger" onclick="delSrv()">🗑️ حذف</button>
                    </div>
                    <div class="status" id="mst" style="margin-top:6px">أضف سيرفرك الخاص</div>
                </div>
            </div>

            <div class="panel" style="padding:8px 12px">
                <select id="grp" onchange="render()"><option value="">📂 كل المجموعات</option></select>
                <input type="text" id="src" placeholder="🔍 بحث..." oninput="render()">
            </div>

            <div class="list" id="lst"></div>
            <div class="count" id="cnt">0 قناة</div>

            <div class="bottom">
                <button class="btn" id="fbtn" onclick="toggleFav()" style="flex:1">⭐ المفضلة</button>
                <button class="btn" onclick="refresh()" style="flex:1">🔄 تحديث</button>
            </div>
            <div class="footer"><a href="https://x.com/0000000000388p" target="_blank">🐭 @mouse0000000</a></div>
        </div>
    </div>

    <input type="file" id="fup" style="display:none" accept=".m3u,.m3u8" onchange="loadFile(this)">

    <script>
        // ===== الإعدادات =====
        const BASE_URL = ""; // فارغ = نفس السيرفر. للـ Vercel: "https://your-ngrok-url"
        let API_KEY = document.getElementById("apiKeyInput").value;
        let channels = [], filtered = [], favs = new Set(), cur = -1, hls = null, showFav = false;

        const $ = id => document.getElementById(id);
        const vid = $("vid"), ph = $("ph"), pbtn = $("pbtn"), info = $("info"), st = $("st");

        // ===== API =====
        async function api(path, opts = {}) {
            const url = (BASE_URL || "") + path;
            const res = await fetch(url, {
                ...opts,
                headers: {
                    "X-API-Key": API_KEY,
                    "Content-Type": "application/json",
                    ...opts.headers
                }
            });
            if (res.status === 401) throw new Error("API Key غير صحيح");
            if (!res.ok) throw new Error((await res.json()).error || "خطأ غير معروف");
            return res.json();
        }

        // ===== تحميل =====
        async function loadSrv() {
            const url = $("srvSel").value;
            if (!url) return;
            prog(20); st.textContent = "🔄 جاري التحميل...";
            try {
                const data = await api("/api/load", {
                    method: "POST",
                    body: JSON.stringify({ url })
                });
                channels = data.channels || [];
                updateGroups(); render(); prog(100);
                st.textContent = `✅ ${data.count} قناة`;
                st.className = "status ok";
                if (channels.length) setTimeout(() => play(0), 300);
            } catch (e) {
                prog(0); st.textContent = "❌ " + e.message; st.className = "status err";
            }
        }

        async function loadFile(input) {
            const file = input.files[0]; if (!file) return;
            const text = await file.text();
            // تحليل محلي
            const lines = text.split(/\r?\n/);
            const chs = []; let cur = null;
            for (let l of lines) {
                l = l.trim(); if (!l) continue;
                if (l.startsWith("#EXTINF:")) {
                    const nm = (l.match(/,(.+)$/) || [, "Unnamed"])[1].trim();
                    const gr = (l.match(/group-title="([^"]*)"/) || [, "General"])[1];
                    const lg = (l.match(/tvg-logo="([^"]*)"/) || [, ""])[1];
                    cur = { name: nm, group: gr, logo: lg, url: "" };
                } else if (l.startsWith("http") && cur) {
                    cur.url = l; chs.push({ ...cur }); cur = null;
                }
            }
            channels = chs; updateGroups(); render();
            st.textContent = `✅ ${chs.length} قناة من الملف`; st.className = "status ok";
            if (chs.length) setTimeout(() => play(0), 300);
            input.value = "";
        }

        async function refresh() {
            try {
                const data = await api("/api/channels");
                channels = data.channels || [];
                updateGroups(); render();
                st.textContent = `🔄 ${data.count} قناة محفوظة`;
            } catch (e) {
                st.textContent = "❌ " + e.message; st.className = "status err";
            }
        }

        // ===== إدارة السيرفرات =====
        async function addSrv() {
            const name = $("sn").value.trim(), url = $("su").value.trim();
            if (!name || !url) return alert("أدخل الاسم والرابط");
            try {
                await api("/api/servers", { method: "POST", body: JSON.stringify({ name, url }) });
                $("mst").textContent = `✅ تم إضافة ${name}`; $("mst").className = "status ok";
                loadServers(); $("sn").value = ""; $("su").value = "";
            } catch (e) {
                $("mst").textContent = "❌ " + e.message; $("mst").className = "status err";
            }
        }

        async function delSrv() {
            const name = $("srvSel").options[$("srvSel").selectedIndex].text;
            if (!name || !confirm(`حذف ${name}؟`)) return;
            try {
                await api(`/api/servers/${encodeURIComponent(name)}`, { method: "DELETE" });
                $("mst").textContent = `✅ تم الحذف`; loadServers();
            } catch (e) {
                $("mst").textContent = "❌ " + e.message;
            }
        }

        async function loadServers() {
            try {
                const data = await api("/api/servers");
                const sel = $("srvSel");
                sel.innerHTML = "";
                for (const [name, url] of Object.entries(data.servers || {})) {
                    const o = document.createElement("option");
                    o.value = url; o.textContent = name;
                    sel.appendChild(o);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ===== عرض =====
        function updateGroups() {
            const grps = [...new Set(channels.map(c => c.group).filter(g => g))].sort();
            const sel = $("grp");
            const cur = sel.value;
            sel.innerHTML = '<option value="">📂 كل المجموعات</option>';
            grps.forEach(g => { const o = document.createElement("option"); o.value = g; o.textContent = g; sel.appendChild(o); });
            if (grps.includes(cur)) sel.value = cur;
        }

        function render() {
            const s = $("src").value.trim().toLowerCase();
            const g = $("grp").value;
            filtered = channels.filter(c => {
                if (g && c.group !== g) return false;
                if (s && !c.name.toLowerCase().includes(s)) return false;
                if (showFav && !favs.has(c.url)) return false;
                return true;
            });

            $("lst").innerHTML = "";
            filtered.forEach((c, i) => {
                const d = document.createElement("div");
                d.className = "ch" + (i === cur ? " active" : "");
                d.onclick = () => play(i);
                const isF = favs.has(c.url);
                d.innerHTML = `<img src="${c.logo || 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'}" onerror="this.style.display='none'"><span class="ch-name">${isF ? '⭐ ' : ''}${c.name}</span>`;
                d.oncontextmenu = e => { e.preventDefault(); toggleFavItem(c.url); };
                $("lst").appendChild(d);
            });
            $("cnt").textContent = filtered.length + " قناة";
        }

        // ===== تشغيل =====
        async function play(idx) {
            if (idx < 0 || idx >= filtered.length) return;
            cur = idx;
            const ch = filtered[idx];
            document.querySelectorAll(".ch").forEach((e, i) => e.classList.toggle("active", i === idx));
            info.textContent = `▶️ ${ch.name}`;
            ph.style.display = "none"; vid.style.display = "block";

            if (hls) { hls.destroy(); hls = null; }

            // استخدم Proxy السيرفر لتجاوز CORS
            const proxyUrl = `${BASE_URL}/api/proxy?url=${encodeURIComponent(ch.url)}&api_key=${API_KEY}`;

            if (Hls.isSupported() && (ch.url.includes(".m3u8") || ch.url.includes("output="))) {
                hls = new Hls({ enableWorker: true, maxBufferLength: 30 });
                hls.loadSource(proxyUrl);
                hls.attachMedia(vid);
                hls.on(Hls.Events.MANIFEST_PARSED, () => vid.play().catch(() => {}));
            } else {
                vid.src = proxyUrl;
                vid.play().catch(() => {});
            }

            pbtn.textContent = "⏸"; pbtn.classList.add("active");
            // تسجيل تشغيل
            api("/api/play", { method: "POST", body: JSON.stringify({ name: ch.name }) }).catch(() => {});
        }

        function togglePlay() {
            if (!vid.src) return;
            if (vid.paused) { vid.play(); pbtn.textContent = "⏸"; pbtn.classList.add("active"); }
            else { vid.pause(); pbtn.textContent = "▶"; pbtn.classList.remove("active"); }
        }

        function stop() {
            if (hls) { hls.destroy(); hls = null; }
            vid.pause(); vid.src = ""; vid.style.display = "none"; ph.style.display = "block";
            pbtn.textContent = "▶"; pbtn.classList.remove("active"); info.textContent = "⏹️ تم الإيقاف"; cur = -1;
            document.querySelectorAll(".ch").forEach(e => e.classList.remove("active"));
        }

        function next() { if (filtered.length) play((cur + 1) % filtered.length); }
        function prev() { if (filtered.length) play((cur - 1 + filtered.length) % filtered.length); }
        function toggleMute() { vid.muted = !vid.muted; $("mbtn").textContent = vid.muted ? "🔇" : "🔊"; }
        function setVol(v) { vid.volume = v / 100; }
        function toggleFS() {
            const el = $("vbox");
            if (!document.fullscreenElement) el.requestFullscreen().catch(() => {});
            else document.exitFullscreen();
        }

        function toggleFav() {
            showFav = !showFav;
            $("fbtn").style.background = showFav ? "var(--green)" : "";
            $("fbtn").style.color = showFav ? "#0a0c0f" : "";
            render();
        }

        function toggleFavItem(url) {
            if (favs.has(url)) favs.delete(url); else favs.add(url);
            localStorage.setItem("mouse_favs", JSON.stringify([...favs]));
            render();
        }

        // ===== مساعدات =====
        function prog(p) { $("pbar").style.display = p > 0 && p < 100 ? "block" : "none"; $("pfill").style.width = p + "%"; }
        function switchTab(t, el) {
            document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
            el.classList.add("active");
            $("tab-play").style.display = t === "play" ? "block" : "none";
            $("tab-manage").style.display = t === "manage" ? "block" : "none";
        }

        // ===== اختصارات =====
        document.addEventListener("keydown", e => {
            if (e.target.tagName === "INPUT") return;
            if (e.key === " ") { e.preventDefault(); togglePlay(); }
            else if (e.key === "ArrowRight") next();
            else if (e.key === "ArrowLeft") prev();
            else if (e.key === "ArrowUp") vid.volume = Math.min(1, vid.volume + 0.1);
            else if (e.key === "ArrowDown") vid.volume = Math.max(0, vid.volume - 0.1);
            else if (e.key === "f" || e.key === "F") toggleFS();
            else if (e.key === "m" || e.key === "M") toggleMute();
        });

        vid.addEventListener("timeupdate", () => {
            if (vid.duration) $("prog").value = (vid.currentTime / vid.duration) * 1000;
        });
        $("prog").addEventListener("input", function () {
            if (vid.duration) vid.currentTime = (this.value / 1000) * vid.duration;
        });

        // ===== بدء =====
        const savedFavs = localStorage.getItem("mouse_favs");
        if (savedFavs) favs = new Set(JSON.parse(savedFavs));
        loadServers();
        refresh();
    </script>
</body>
</html>
