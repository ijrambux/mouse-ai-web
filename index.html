    <script>
        // ============================================================
        //  MOUSE AI IPTV Pro v4.0 - Full Web Application
        //  FIXED VERSION - All bugs resolved
        // ============================================================

        (function() {
            'use strict';

            // ===== CONSTANTS =====
            const APP_NAME = 'MOUSE AI IPTV';
            const APP_VERSION = '4.0.0 ULTIMATE';
            const STORAGE_KEY = 'mouse_ai_settings_v4';
            const FAV_KEY = 'mouse_ai_favorites_v4';
            const SERVERS_KEY = 'mouse_ai_servers_v4';
            const HISTORY_KEY = 'mouse_ai_history_v4';

            // ===== SAMPLE SERVER FOR TESTING =====
            // This is a public test M3U URL - replace with your own
            const SAMPLE_SERVER = {
                name: '🎯 Sample Server (Test)',
                url: 'http://line.watchtivo-8k.com:80/get.php?username=demo&password=demo&type=m3u_plus'
            };

            // ===== STATE =====
            let state = {
                channels: [],
                filtered: [],
                favorites: new Set(),
                customServers: {},
                settings: { volume: 100, muteOnStart: false, autoLoad: false, showServerInfo: true, timeout: 30 },
                history: [],
                currentIndex: -1,
                isPlaying: false,
                isMuted: false,
                isFullscreen: false,
                serverInfo: {},
                selectedServer: '',
                loading: false,
                favView: false,
                currentGroup: 'All Groups',
                searchQuery: '',
                videoLoaded: false
            };

            // ===== DOM REFS =====
            const video = document.getElementById('videoPlayer');
            const videoContainer = document.getElementById('videoContainer');
            const placeholder = document.getElementById('videoPlaceholder');
            const serverInfo = document.getElementById('serverInfo');
            const progressSlider = document.getElementById('progressSlider');
            const playBtn = document.getElementById('playBtn');
            const stopBtn = document.getElementById('stopBtn');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const muteBtn = document.getElementById('muteBtn');
            const volSlider = document.getElementById('volSlider');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const infoLabel = document.getElementById('infoLabel');
            const serverSelect = document.getElementById('serverSelect');
            const loadBtn = document.getElementById('loadBtn');
            const fileBtn = document.getElementById('fileBtn');
            const addCodeBtn = document.getElementById('addCodeBtn');
            const manageBtn = document.getElementById('manageBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const statusLabel = document.getElementById('statusLabel');
            const groupSelect = document.getElementById('groupSelect');
            const searchInput = document.getElementById('searchInput');
            const channelList = document.getElementById('channelList');
            const countLabel = document.getElementById('countLabel');
            const favBtn = document.getElementById('favBtn');
            const settingsBtn = document.getElementById('settingsBtn');
            const xBtn = document.getElementById('xBtn');
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const toast = document.getElementById('toast');

            // ===== STORAGE =====
            function loadData() {
                try {
                    const s = localStorage.getItem(STORAGE_KEY);
                    if (s) state.settings = { ...state.settings, ...JSON.parse(s) };
                } catch (e) { console.warn('Settings load error', e); }

                try {
                    const f = localStorage.getItem(FAV_KEY);
                    if (f) state.favorites = new Set(JSON.parse(f));
                } catch (e) { console.warn('Favorites load error', e); }

                try {
                    const c = localStorage.getItem(SERVERS_KEY);
                    if (c) {
                        state.customServers = JSON.parse(c);
                    } else {
                        // Add a sample server if no servers exist
                        state.customServers = {};
                        // Uncomment to add sample server automatically:
                        // state.customServers[SAMPLE_SERVER.name] = { url: SAMPLE_SERVER.url, info: { type: 'xtream', host: 'Sample' } };
                        // saveServers();
                    }
                } catch (e) {
                    console.warn('Servers load error', e);
                    state.customServers = {};
                    saveServers();
                }

                try {
                    const h = localStorage.getItem(HISTORY_KEY);
                    if (h) state.history = JSON.parse(h);
                } catch (e) { console.warn('History load error', e); }
            }

            function saveSettings() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.settings)); } catch (e) {}
            }

            function saveFavorites() {
                try { localStorage.setItem(FAV_KEY, JSON.stringify([...state.favorites])); } catch (e) {}
            }

            function saveServers() {
                try { localStorage.setItem(SERVERS_KEY, JSON.stringify(state.customServers)); } catch (e) {}
            }

            function saveHistory() {
                try { localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history.slice(-50))); } catch (e) {}
            }

            // ===== TOAST =====
            let toastTimeout = null;

            function showToast(msg, type = 'success') {
                toast.textContent = msg;
                toast.className = 'toast ' + type;
                clearTimeout(toastTimeout);
                void toast.offsetWidth;
                toast.classList.add('show');
                toastTimeout = setTimeout(() => toast.classList.remove('show'), 4000);
            }

            // ===== PARSER =====
            function parseM3U(content) {
                const lines = content.split(/\r?\n/);
                const channels = [];
                let current = {};
                for (const raw of lines) {
                    const line = raw.trim();
                    if (!line) continue;
                    if (line.startsWith('#EXTINF:')) {
                        const parts = line.split(',');
                        const name = parts.length > 1 ? parts.slice(1).join(',').trim() : line;
                        let logo = '';
                        const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                        if (logoMatch) logo = logoMatch[1];
                        let group = 'General';
                        const groupMatch = line.match(/group-title="([^"]*)"/);
                        if (groupMatch) group = groupMatch[1];
                        current = { name: name || 'Unnamed', logo, group, url: '' };
                    } else if (line.startsWith('http://') || line.startsWith('https://')) {
                        if (current && !current.url) {
                            current.url = line;
                            channels.push({ ...current });
                            current = {};
                        }
                    }
                }
                // Also handle URLs that might not have #EXTINF before them
                for (const line of lines) {
                    const trimmed = line.trim();
                    if ((trimmed.startsWith('http://') || trimmed.startsWith('https://')) && 
                        !channels.some(c => c.url === trimmed)) {
                        channels.push({ name: 'Channel ' + (channels.length + 1), url: trimmed, group: 'General', logo: '' });
                    }
                }
                return channels.filter(c => c.url);
            }

            function parseCode(text) {
                text = text.trim();
                if (!text) return { type: 'empty', data: {} };

                // Xtream
                let m = text.match(/(https?:\/\/[^\/\s]+(?::\d+)?)(?:[^\s]*)\?.*username=([^&\s]+).*password=([^&\s]+)/i);
                if (m) {
                    return { type: 'xtream', data: { host: m[1], username: m[2], password: m[3], raw: text } };
                }

                // CCcam
                m = text.match(/[Cc][:;]\s*(\S+)\s+(\d+)\s+(\S+)\s+(\S+)/);
                if (m) {
                    return { type: 'cccam', data: { host: m[1], port: m[2], user: m[3], pass: m[4], raw: text } };
                }

                // Newcamd
                m = text.match(/[Nn][:;]\s*(\S+)\s+(\d+)\s+(\S+)\s+(\S+)/);
                if (m) {
                    return { type: 'newcamd', data: { host: m[1], port: m[2], user: m[3], pass: m[4], raw: text } };
                }

                // MAC
                const macs = text.match(/[0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}/g);
                if (macs) {
                    const host = text.match(/https?:\/\/[^\s<>"{}|^`\[\]]+/);
                    return { type: 'mac', data: { macs, host: host ? host[0] : '', raw: text } };
                }

                // Portal / Stalker
                const portalMatch = text.match(/(https?:\/\/\S+?)(?:\/c\/|\/stalker_portal\/|\/portal\/|\/server\/|\/get\.php|\/player_api\.php)/i);
                if (portalMatch) {
                    return { type: 'portal', data: { host: portalMatch[1].replace(/\/+$/, ''), raw: text } };
                }

                // M3U URL
                const m3uMatch = text.match(/(https?:\/\/\S+\.(?:m3u|m3u8)(?:\?\S+)?)/i);
                if (m3uMatch) {
                    return { type: 'm3u_url', data: { url: m3uMatch[1], raw: text } };
                }

                // Generic URL
                const urlMatch = text.match(/https?:\/\/[^\s<>"{}|^`\[\]]+/);
                if (urlMatch) {
                    return { type: 'generic', data: { host: urlMatch[0].replace(/[^a-zA-Z0-9_/:.-]$/, ''), raw: text } };
                }

                return { type: 'unknown', data: { raw: text } };
            }

            function buildXtreamUrl(host, user, pass, type = 'm3u_plus') {
                if (!host || !user || !pass) return '';
                return `${host.replace(/\/+$/, '')}/get.php?username=${user}&password=${pass}&type=${type}`;
            }

            // ===== LOAD CHANNELS =====
            function loadChannels(source) {
                if (state.loading) return;
                state.loading = true;
                updateUIForLoading(true);
                progressBar.classList.add('active');
                progressFill.style.width = '0%';
                statusLabel.textContent = '🔄 Connecting...';
                statusLabel.className = 'status-label';

                let url = source || serverSelect.value;

                if (!url || url === '' || url === '-- No servers added yet --') {
                    showToast('❌ No server selected. Please add a server first.', 'error');
                    state.loading = false;
                    updateUIForLoading(false);
                    progressBar.classList.remove('active');
                    statusLabel.textContent = '⚠️ No server available';
                    statusLabel.className = 'status-label error';
                    return;
                }

                // Check if it's a custom server entry
                if (state.customServers[url]) {
                    const data = state.customServers[url];
                    state.serverInfo = data.info || {};
                    url = data.url;
                }

                if (!url || !url.startsWith('http')) {
                    showToast('❌ Invalid server URL', 'error');
                    state.loading = false;
                    updateUIForLoading(false);
                    progressBar.classList.remove('active');
                    statusLabel.textContent = '❌ Invalid URL';
                    statusLabel.className = 'status-label error';
                    return;
                }

                loadFromUrl(url);
            }

            function loadFromUrl(url) {
                statusLabel.textContent = '🔄 Connecting to server...';
                statusLabel.className = 'status-label';
                progressFill.style.width = '15%';

                const timeout = (state.settings.timeout || 30) * 1000;

                // Create AbortController for timeout
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), timeout);

                fetch(url, {
                    signal: controller.signal,
                    headers: {
                        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                        'Accept': '*/*',
                        'Accept-Encoding': 'gzip, deflate, br'
                    }
                })
                .then(res => {
                    clearTimeout(timeoutId);
                    if (!res.ok) throw new Error(`HTTP ${res.status} - ${res.statusText}`);
                    progressFill.style.width = '40%';
                    statusLabel.textContent = '📥 Reading data...';
                    return res.text();
                })
                .then(text => {
                    progressFill.style.width = '60%';
                    statusLabel.textContent = '🔍 Parsing channels...';
                    
                    if (!text || text.length < 10) {
                        throw new Error('Empty response from server');
                    }
                    
                    const channels = parseM3U(text);
                    progressFill.style.width = '90%';
                    
                    if (channels.length === 0) {
                        throw new Error('No channels found in the response');
                    }
                    
                    onChannelsLoaded(channels);
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    state.loading = false;
                    updateUIForLoading(false);
                    progressBar.classList.remove('active');
                    let errorMsg = err.message;
                    if (err.name === 'AbortError') {
                        errorMsg = 'Connection timeout - Server took too long to respond';
                    } else if (err.message.includes('Failed to fetch')) {
                        errorMsg = 'Network error - Check your internet connection or CORS policy';
                    }
                    statusLabel.textContent = '❌ Error: ' + errorMsg;
                    statusLabel.className = 'status-label error';
                    showToast('❌ ' + errorMsg, 'error');
                    console.error('Load error:', err);
                });
            }

            function processContent(content, source) {
                statusLabel.textContent = '⚙️ Processing...';
                progressFill.style.width = '40%';
                setTimeout(() => {
                    const channels = parseM3U(content);
                    progressFill.style.width = '90%';
                    onChannelsLoaded(channels);
                }, 100);
            }

            function onChannelsLoaded(channels) {
                state.channels = channels;
                state.filtered = [...channels];
                state.currentIndex = -1;
                state.loading = false;
                updateUIForLoading(false);
                progressBar.classList.remove('active');
                progressFill.style.width = '100%';

                // Update groups
                const groups = new Set();
                for (const ch of channels) {
                    if (ch.group) groups.add(ch.group);
                }
                groupSelect.innerHTML = '<option value="All Groups">📂 All Groups</option>';
                for (const g of [...groups].sort()) {
                    const opt = document.createElement('option');
                    opt.value = g;
                    opt.textContent = g;
                    groupSelect.appendChild(opt);
                }
                state.currentGroup = 'All Groups';
                groupSelect.value = 'All Groups';

                // Update server info
                if (state.settings.showServerInfo && Object.keys(state.serverInfo).length > 0) {
                    const parts = [];
                    if (state.serverInfo.created) parts.push(`📅 Created: ${state.serverInfo.created}`);
                    if (state.serverInfo.expire) parts.push(`⏳ Expire: ${state.serverInfo.expire}`);
                    if (state.serverInfo.duration) parts.push(`⏱️ Duration: ${state.serverInfo.duration}`);
                    if (state.serverInfo.hits_by) parts.push(`👤 By: ${state.serverInfo.hits_by}`);
                    if (parts.length > 0) {
                        serverInfo.textContent = parts.join('  |  ');
                        serverInfo.classList.add('active');
                    }
                } else {
                    serverInfo.classList.remove('active');
                }

                renderChannels();
                statusLabel.textContent = `✅ Loaded: ${channels.length} channels`;
                statusLabel.className = 'status-label success';
                countLabel.textContent = `${channels.length} channels`;
                showToast(`✅ Loaded ${channels.length} channels`, 'success');

                if (state.settings.autoLoad && channels.length > 0) {
                    setTimeout(() => {
                        const firstItem = channelList.querySelector('.channel-item');
                        if (firstItem) firstItem.click();
                    }, 500);
                }
            }

            function updateUIForLoading(loading) {
                loadBtn.disabled = loading;
                fileBtn.disabled = loading;
                addCodeBtn.disabled = loading;
                manageBtn.disabled = loading;
                serverSelect.disabled = loading;
                searchInput.disabled = loading;
                if (loading) {
                    loadBtn.textContent = '⏳ Loading...';
                } else {
                    loadBtn.textContent = '📡 Load Channels';
                }
            }

            // ===== RENDER CHANNELS =====
            function renderChannels() {
                const search = state.searchQuery.toLowerCase().trim();
                const group = state.currentGroup;
                const favOnly = state.favView;

                let filtered = state.channels;
                if (group !== 'All Groups') {
                    filtered = filtered.filter(c => (c.group || 'General') === group);
                }
                if (search) {
                    filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(search));
                }
                if (favOnly) {
                    filtered = filtered.filter(c => state.favorites.has(c.url));
                }
                state.filtered = filtered;

                channelList.innerHTML = '';
                if (filtered.length === 0) {
                    const empty = document.createElement('div');
                    empty.style.cssText = 'text-align:center;padding:40px 20px;color:var(--text-muted);font-size:14px;';
                    empty.innerHTML = '📺 No channels found<br><span style="font-size:12px;">Try changing filters or add a new server</span>';
                    channelList.appendChild(empty);
                    countLabel.textContent = '0 channels';
                    return;
                }

                for (let i = 0; i < filtered.length; i++) {
                    const ch = filtered[i];
                    const div = document.createElement('div');
                    div.className = 'channel-item' + (i === state.currentIndex ? ' active' : '');
                    const isFav = state.favorites.has(ch.url);
                    div.innerHTML = `
                        <span class="channel-name">${isFav ? '<span class="fav-star">⭐</span>' : ''}${ch.name || 'Unnamed'}</span>
                        ${ch.group ? `<span class="channel-group">${ch.group}</span>` : ''}
                    `;
                    div.dataset.index = i;
                    div.addEventListener('click', () => playChannel(i));
                    div.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        showChannelMenu(e.clientX, e.clientY, i);
                    });
                    channelList.appendChild(div);
                }

                countLabel.textContent = `${filtered.length} channels`;
            }

            // ===== PLAY CHANNEL =====
            function playChannel(index) {
                const ch = state.filtered[index];
                if (!ch || !ch.url) {
                    showToast('❌ Channel has no URL', 'error');
                    return;
                }

                state.currentIndex = index;
                state.isPlaying = true;

                // Update active state
                document.querySelectorAll('.channel-item').forEach((el, i) => {
                    el.classList.toggle('active', i === index);
                });

                // Load video
                video.src = ch.url;
                video.load();
                video.play().catch(err => {
                    console.warn('Play error:', err);
                    showToast('❌ Playback error: ' + err.message, 'error');
                    state.isPlaying = false;
                    updatePlayButton();
                });

                infoLabel.textContent = `▶️ Playing: ${ch.name || 'Unnamed'}`;
                infoLabel.className = 'info-label active';
                statusLabel.textContent = `▶️ Playing: ${ch.name || 'Unnamed'}`;
                statusLabel.className = 'status-label success';
                placeholder.style.display = 'none';
                state.videoLoaded = true;
                updatePlayButton();

                // Add to history
                if (!state.history.includes(ch.url)) {
                    state.history.push(ch.url);
                    saveHistory();
                }
            }

            // ===== VIDEO CONTROLS =====
            function togglePlayPause() {
                if (!state.videoLoaded) {
                    const first = channelList.querySelector('.channel-item');
                    if (first) first.click();
                    return;
                }
                if (video.paused) {
                    video.play().catch(() => {});
                    state.isPlaying = true;
                } else {
                    video.pause();
                    state.isPlaying = false;
                }
                updatePlayButton();
            }

            function stopPlayback() {
                video.pause();
                video.currentTime = 0;
                state.isPlaying = false;
                updatePlayButton();
                infoLabel.textContent = '⏹️ Stopped';
                infoLabel.className = 'info-label';
                progressSlider.value = 0;
            }

            function playNext() {
                if (state.filtered.length === 0) return;
                const next = (state.currentIndex + 1) % state.filtered.length;
                playChannel(next);
                scrollToChannel(next);
            }

            function playPrev() {
                if (state.filtered.length === 0) return;
                const prev = state.currentIndex <= 0 ? state.filtered.length - 1 : state.currentIndex - 1;
                playChannel(prev);
                scrollToChannel(prev);
            }

            function scrollToChannel(index) {
                const items = channelList.querySelectorAll('.channel-item');
                if (items[index]) {
                    items[index].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }

            function updatePlayButton() {
                if (state.isPlaying && !video.paused) {
                    playBtn.textContent = '⏸';
                    playBtn.classList.add('playing');
                } else {
                    playBtn.textContent = '▶';
                    playBtn.classList.remove('playing');
                }
            }

            function toggleMute() {
                video.muted = !video.muted;
                state.isMuted = video.muted;
                muteBtn.textContent = video.muted ? '🔇' : '🔊';
            }

            function setVolume(val) {
                const v = parseInt(val);
                video.volume = Math.min(v / 200, 1);
                state.settings.volume = v;
                saveSettings();
                if (v === 0) muteBtn.textContent = '🔇';
                else if (v < 50) muteBtn.textContent = '🔉';
                else if (v < 100) muteBtn.textContent = '🔊';
                else muteBtn.textContent = '🔊';
            }

            function toggleFullscreen() {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(() => {});
                    state.isFullscreen = false;
                } else {
                    document.documentElement.requestFullscreen().catch(() => {});
                    state.isFullscreen = true;
                }
            }

            // ===== CONTEXT MENU =====
            function showChannelMenu(x, y, index) {
                const ch = state.filtered[index];
                if (!ch) return;
                const isFav = state.favorites.has(ch.url);

                const items = [
                    { label: '▶ Play', action: () => playChannel(index) },
                    { label: isFav ? '⭐ Remove from Favorites' : '⭐ Add to Favorites', action: () => toggleFavorite(index) },
                    { label: '📋 Copy URL', action: () => { navigator.clipboard.writeText(ch.url).then(() => showToast('📋 URL copied!', 'success')); } },
                    { label: 'ℹ️ Channel Info', action: () => showChannelInfo(index) }
                ];

                const menuHtml = items.map((item, i) =>
                    `<div class="action-btn" style="width:100%;text-align:left;padding:8px 16px;margin:2px 0;border-radius:6px;border:1px solid var(--border);cursor:pointer;" data-action="${i}">${item.label}</div>`
                ).join('');

                modalTitle.textContent = '📺 Channel Menu';
                modalBody.innerHTML = `
                    <div style="margin-bottom:12px;font-size:14px;color:var(--text-secondary);">
                        <strong style="color:var(--green);">${ch.name || 'Unnamed'}</strong>
                        ${ch.group ? ` · ${ch.group}` : ''}
                    </div>
                    <div style="display:flex;flex-direction:column;gap:4px;">
                        ${menuHtml}
                    </div>
                    <div class="btn-row-modal">
                        <button class="action-btn white" onclick="closeModal()">Close</button>
                    </div>
                `;
                modalOverlay.classList.add('active');

                setTimeout(() => {
                    const btns = modalBody.querySelectorAll('[data-action]');
                    btns.forEach((btn, i) => {
                        btn.addEventListener('click', () => {
                            items[i].action();
                            closeModal();
                        });
                    });
                }, 50);
            }

            function showChannelInfo(index) {
                const ch = state.filtered[index];
                if (!ch) return;
                const info = `
                    <div style="margin-bottom:8px;"><strong style="color:var(--green);">📺 Name:</strong> ${ch.name || 'Unknown'}</div>
                    <div style="margin-bottom:8px;"><strong style="color:var(--green);">📂 Group:</strong> ${ch.group || 'Not set'}</div>
                    <div style="margin-bottom:8px;"><strong style="color:var(--green);">🔗 URL:</strong> <span style="color:var(--green-dim);word-break:break-all;font-size:12px;">${ch.url}</span></div>
                    <div style="margin-bottom:8px;"><strong style="color:var(--green);">🖼️ Logo:</strong> ${ch.logo || 'Not available'}</div>
                `;
                modalTitle.textContent = 'ℹ️ Channel Info';
                modalBody.innerHTML = `
                    ${info}
                    <div class="btn-row-modal">
                        <button class="action-btn white" onclick="closeModal()">Close</button>
                    </div>
                `;
                modalOverlay.classList.add('active');
            }

            function toggleFavorite(index) {
                const ch = state.filtered[index];
                if (!ch) return;
                if (state.favorites.has(ch.url)) {
                    state.favorites.delete(ch.url);
                    showToast('⭐ Removed from favorites', 'success');
                } else {
                    state.favorites.add(ch.url);
                    showToast('⭐ Added to favorites', 'success');
                }
                saveFavorites();
                renderChannels();
                const items = channelList.querySelectorAll('.channel-item');
                if (items[state.currentIndex]) {
                    items[state.currentIndex].classList.add('active');
                }
            }

            // ===== MODAL =====
            window.closeModal = function() {
                modalOverlay.classList.remove('active');
            };

            function openAddCodeModal() {
                modalTitle.textContent = '🐭 Add IPTV Server';
                modalBody.innerHTML = `
                    <div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px;">
                        🔥 Paste any server code - supports CCcam, Newcamd, MAC, Xtream, Portal, Stalker, M3U
                    </div>
                    <div class="form-group">
                        <label>📝 Paste your code:</label>
                        <textarea id="codeInput" placeholder="Example: C: server.com 12000 user pass&#10;http://host.com:8080/get.php?username=user&password=pass&type=m3u_plus&#10;A0:BB:3E:18:9E:02&#10;N: server.com 12000 user pass 01 02 03 04 05 06 07 08 09 10 11 12 13 14"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>🏷️ Server Name</label>
                            <input type="text" id="serverNameInput" placeholder="My Server">
                        </div>
                        <div class="form-group">
                            <label>📦 Type</label>
                            <select id="serverTypeInput">
                                <option value="m3u_plus">m3u_plus (recommended)</option>
                                <option value="m3u">m3u (standard)</option>
                            </select>
                        </div>
                    </div>
                    <div id="previewUrl" style="margin-top:12px;padding:12px;background:var(--bg-dark);border:2px solid var(--border);border-radius:10px;color:var(--text-muted);font-family:monospace;font-size:12px;word-break:break-all;min-height:40px;transition:all 0.3s ease;">
                        ⚡ Final URL will appear here...
                    </div>
                    <div class="btn-row-modal">
                        <button class="action-btn white" onclick="closeModal()">Cancel</button>
                        <button class="action-btn green" id="addServerBtn">➕ Add Server</button>
                    </div>
                `;
                modalOverlay.classList.add('active');

                const codeInput = document.getElementById('codeInput');
                const nameInput = document.getElementById('serverNameInput');
                const typeInput = document.getElementById('serverTypeInput');
                const preview = document.getElementById('previewUrl');
                const addBtn = document.getElementById('addServerBtn');

                let parsedData = null;

                function parseAndPreview() {
                    const text = codeInput.value.trim();
                    if (!text) {
                        preview.textContent = '⚡ Paste code to analyze...';
                        preview.style.borderColor = 'var(--border)';
                        preview.style.color = 'var(--text-muted)';
                        return;
                    }
                    const result = parseCode(text);
                    parsedData = result;
                    let url = '';
                    let name = nameInput.value.trim() || '';

                    if (result.type === 'xtream') {
                        const d = result.data;
                        url = buildXtreamUrl(d.host, d.username, d.password, typeInput.value);
                        if (!name) name = `Xtream (${d.host})`;
                    } else if (result.type === 'cccam') {
                        const d = result.data;
                        url = `http://${d.host}:${d.port}/get.php?username=${d.user}&password=${d.pass}&type=${typeInput.value}`;
                        if (!name) name = `CCcam (${d.host})`;
                    } else if (result.type === 'newcamd') {
                        const d = result.data;
                        url = `http://${d.host}:${d.port}/get.php?username=${d.user}&password=${d.pass}&type=${typeInput.value}`;
                        if (!name) name = `Newcamd (${d.host})`;
                    } else if (result.type === 'mac') {
                        const d = result.data;
                        if (d.host && d.macs && d.macs.length > 0) {
                            url = `${d.host.replace(/\/+$/, '')}/stalker_portal/server/load.php?type=stb&action=handshake&mac=${d.macs[0]}`;
                        }
                        if (!name) name = `MAC (${d.macs ? d.macs[0] : 'Unknown'})`;
                    } else if (result.type === 'portal' || result.type === 'stalker') {
                        const d = result.data;
                        url = `${d.host}/get.php?type=${typeInput.value}`;
                        if (!name) name = `Portal (${d.host})`;
                    } else if (result.type === 'm3u_url') {
                        url = result.data.url;
                        if (!name) name = `M3U URL`;
                    } else if (result.type === 'generic') {
                        url = result.data.host;
                        if (!name) name = `Generic (${url})`;
                    } else {
                        preview.textContent = '❌ Unknown format. Please check the code.';
                        preview.style.borderColor = 'var(--red)';
                        preview.style.color = 'var(--red)';
                        return;
                    }

                    if (url) {
                        preview.textContent = url;
                        preview.style.borderColor = 'var(--green)';
                        preview.style.color = 'var(--green)';
                        if (!nameInput.value.trim() && name) {
                            nameInput.value = name;
                        }
                    } else {
                        preview.textContent = '⚠️ Could not build URL. Please check the code.';
                        preview.style.borderColor = 'var(--fire-orange)';
                        preview.style.color = 'var(--fire-orange)';
                    }
                }

                codeInput.addEventListener('input', parseAndPreview);
                nameInput.addEventListener('input', parseAndPreview);
                typeInput.addEventListener('change', parseAndPreview);

                addBtn.addEventListener('click', () => {
                    const name = nameInput.value.trim();
                    const url = preview.textContent.trim();
                    if (!name) {
                        showToast('❌ Please enter a server name', 'error');
                        return;
                    }
                    if (!url || url.startsWith('⚡') || url.startsWith('⚠️') || url.startsWith('❌') || url === 'Final URL will appear here...') {
                        showToast('❌ Invalid URL. Check the code.', 'error');
                        return;
                    }
                    state.customServers[name] = {
                        url: url,
                        info: parsedData ? parsedData.data : {}
                    };
                    saveServers();
                    refreshServerSelect();
                    serverSelect.value = name;
                    showToast(`✅ Added: ${name}`, 'success');
                    closeModal();
                    setTimeout(() => loadChannels(name), 300);
                });

                setTimeout(() => codeInput.focus(), 100);
            }

            function openSettingsModal() {
                modalTitle.textContent = '⚙️ Settings';
                const s = state.settings;
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label>🔊 Default Volume</label>
                        <input type="range" id="volSetting" min="0" max="200" value="${s.volume || 100}" style="width:100%;">
                        <span id="volDisplay" style="color:var(--green);font-weight:bold;">${s.volume || 100}%</span>
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                            <input type="checkbox" id="muteSetting" ${s.muteOnStart ? 'checked' : ''}>
                            🔇 Mute on startup
                        </label>
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                            <input type="checkbox" id="autoLoadSetting" ${s.autoLoad ? 'checked' : ''}>
                            🚀 Auto-load on startup
                        </label>
                    </div>
                    <div class="form-group">
                        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;">
                            <input type="checkbox" id="showInfoSetting" ${s.showServerInfo !== undefined ? (s.showServerInfo ? 'checked' : '') : 'checked'}>
                            ℹ️ Show server info
                        </label>
                    </div>
                    <div class="form-group">
                        <label>⏱️ Connection timeout (seconds)</label>
                        <input type="number" id="timeoutSetting" value="${s.timeout || 30}" min="5" max="120">
                    </div>
                    <div class="btn-row-modal">
                        <button class="action-btn white" onclick="closeModal()">Cancel</button>
                        <button class="action-btn green" id="saveSettingsBtn">💾 Save</button>
                    </div>
                `;
                modalOverlay.classList.add('active');

                const volSlider = document.getElementById('volSetting');
                const volDisplay = document.getElementById('volDisplay');
                volSlider.addEventListener('input', () => {
                    volDisplay.textContent = volSlider.value + '%';
                });

                document.getElementById('saveSettingsBtn').addEventListener('click', () => {
                    state.settings.volume = parseInt(volSlider.value);
                    state.settings.muteOnStart = document.getElementById('muteSetting').checked;
                    state.settings.autoLoad = document.getElementById('autoLoadSetting').checked;
                    state.settings.showServerInfo = document.getElementById('showInfoSetting').checked;
                    state.settings.timeout = parseInt(document.getElementById('timeoutSetting').value) || 30;
                    saveSettings();
                    setVolume(state.settings.volume);
                    if (state.settings.muteOnStart) {
                        video.muted = true;
                        state.isMuted = true;
                        muteBtn.textContent = '🔇';
                    }
                    showToast('✅ Settings saved!', 'success');
                    closeModal();
                });
            }

            function openManageServers() {
                const servers = { ...state.customServers };
                const names = Object.keys(servers);

                if (names.length === 0) {
                    showToast('📭 No servers found. Add one first!', 'error');
                    return;
                }

                let html = `<div style="margin-bottom:12px;color:var(--text-secondary);font-size:13px;">📡 ${names.length} server(s) configured</div>`;
                for (const name of names) {
                    const data = servers[name];
                    const infoType = data.info ? data.info.type || 'custom' : 'custom';
                    const shortUrl = data.url ? data.url.substring(0, 50) + (data.url.length > 50 ? '...' : '') : '';
                    html += `
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg-input);border-radius:10px;margin-bottom:6px;border:1px solid var(--border);transition:all 0.2s ease;">
                            <div style="flex:1;overflow:hidden;">
                                <div style="font-weight:bold;color:var(--green);">${name}</div>
                                <div style="font-size:11px;color:var(--text-muted);word-break:break-all;">${shortUrl}</div>
                                <div style="font-size:10px;color:var(--text-muted);">📦 ${infoType.toUpperCase()}</div>
                            </div>
                            <button class="action-btn red" style="padding:4px 14px;font-size:11px;border-color:var(--red);color:var(--red);" data-name="${name}">🗑️ Delete</button>
                        </div>
                    `;
                }
                html += `<div class="btn-row-modal"><button class="action-btn white" onclick="closeModal()">Close</button></div>`;

                modalTitle.textContent = '📡 Manage Servers';
                modalBody.innerHTML = html;
                modalOverlay.classList.add('active');

                modalBody.querySelectorAll('[data-name]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const name = btn.dataset.name;
                        if (confirm(`⚠️ Delete server '${name}'?`)) {
                            delete state.customServers[name];
                            saveServers();
                            refreshServerSelect();
                            showToast(`🗑️ Deleted: ${name}`, 'success');
                            openManageServers();
                        }
                    });
                });
            }

            // ===== SERVER SELECT =====
            function refreshServerSelect() {
                const current = serverSelect.value;
                serverSelect.innerHTML = '';
                const customNames = Object.keys(state.customServers);

                if (customNames.length === 0) {
                    const opt = document.createElement('option');
                    opt.value = '';
                    opt.textContent = '-- No servers added yet --';
                    serverSelect.appendChild(opt);
                } else {
                    for (const name of customNames) {
                        const opt = document.createElement('option');
                        opt.value = name;
                        opt.textContent = name;
                        serverSelect.appendChild(opt);
                    }
                }

                if (current && [...serverSelect.options].some(o => o.value === current)) {
                    serverSelect.value = current;
                }
            }

            // ===== FILE LOAD =====
            function loadFile() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.m3u,.m3u8';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const content = ev.target.result;
                            state.loading = true;
                            updateUIForLoading(true);
                            progressBar.classList.add('active');
                            progressFill.style.width = '30%';
                            statusLabel.textContent = `📁 Loading: ${file.name}`;
                            statusLabel.className = 'status-label';
                            setTimeout(() => {
                                const channels = parseM3U(content);
                                if (channels.length === 0) {
                                    throw new Error('No channels found in file');
                                }
                                progressFill.style.width = '90%';
                                state.serverInfo = {};
                                onChannelsLoaded(channels);
                                statusLabel.textContent = `✅ Loaded from file: ${file.name}`;
                                statusLabel.className = 'status-label success';
                                showToast(`✅ Loaded ${channels.length} channels from file`, 'success');
                            }, 200);
                        } catch (err) {
                            showToast('❌ Error reading file: ' + err.message, 'error');
                            state.loading = false;
                            updateUIForLoading(false);
                            progressBar.classList.remove('active');
                            statusLabel.textContent = '❌ Error reading file';
                            statusLabel.className = 'status-label error';
                        }
                    };
                    reader.readAsText(file);
                };
                input.click();
            }

            // ===== DRAG & DROP =====
            document.addEventListener('dragover', (e) => e.preventDefault());
            document.addEventListener('drop', (e) => {
                e.preventDefault();
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const file = files[0];
                    if (file.name.match(/\.m3u8?$/i)) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            try {
                                const content = ev.target.result;
                                state.loading = true;
                                updateUIForLoading(true);
                                progressBar.classList.add('active');
                                progressFill.style.width = '30%';
                                statusLabel.textContent = `📁 Loading: ${file.name}`;
                                statusLabel.className = 'status-label';
                                setTimeout(() => {
                                    const channels = parseM3U(content);
                                    if (channels.length === 0) {
                                        throw new Error('No channels found in file');
                                    }
                                    progressFill.style.width = '90%';
                                    state.serverInfo = {};
                                    onChannelsLoaded(channels);
                                    statusLabel.textContent = `✅ Loaded from file: ${file.name}`;
                                    statusLabel.className = 'status-label success';
                                    showToast(`✅ Loaded ${channels.length} channels from file`, 'success');
                                }, 200);
                            } catch (err) {
                                showToast('❌ Error reading file: ' + err.message, 'error');
                                state.loading = false;
                                updateUIForLoading(false);
                                progressBar.classList.remove('active');
                                statusLabel.textContent = '❌ Error reading file';
                                statusLabel.className = 'status-label error';
                            }
                        };
                        reader.readAsText(file);
                        showToast(`📁 Loading: ${file.name}`, 'success');
                    }
                }
            });

            // ===== INIT =====
            function init() {
                loadData();
                refreshServerSelect();

                // Apply settings
                setVolume(state.settings.volume || 100);
                if (state.settings.muteOnStart) {
                    video.muted = true;
                    state.isMuted = true;
                    muteBtn.textContent = '🔇';
                }

                // Show initial status
                const serverCount = Object.keys(state.customServers).length;
                if (serverCount === 0) {
                    statusLabel.textContent = '📭 No servers. Click "Add Server" to start!';
                    statusLabel.className = 'status-label';
                    showToast('📭 Add your first server to start watching!', 'success');
                } else {
                    statusLabel.textContent = '🚀 Ready. Select a server and press Load.';
                    statusLabel.className = 'status-label';
                    showToast(`🐭 ${APP_NAME} v${APP_VERSION} ready`, 'success');
                }

                // Load auto
                if (state.settings.autoLoad && serverCount > 0) {
                    setTimeout(() => {
                        const firstServer = Object.keys(state.customServers)[0];
                        if (firstServer) {
                            serverSelect.value = firstServer;
                            loadChannels(firstServer);
                        }
                    }, 500);
                }

                // ===== EVENT LISTENERS =====
                // Server
                serverSelect.addEventListener('change', () => {
                    state.selectedServer = serverSelect.value;
                });

                // Buttons
                loadBtn.addEventListener('click', () => {
                    const selected = serverSelect.value;
                    if (!selected || selected === '-- No servers added yet --') {
                        showToast('❌ Please add a server first', 'error');
                        return;
                    }
                    loadChannels(selected);
                });
                fileBtn.addEventListener('click', loadFile);
                addCodeBtn.addEventListener('click', openAddCodeModal);
                manageBtn.addEventListener('click', openManageServers);
                settingsBtn.addEventListener('click', openSettingsModal);

                favBtn.addEventListener('click', () => {
                    state.favView = !state.favView;
                    favBtn.classList.toggle('fav-active');
                    favBtn.textContent = state.favView ? '⭐ Favorites (Active)' : '⭐ Favorites';
                    renderChannels();
                });

                // Search
                searchInput.addEventListener('input', (e) => {
                    state.searchQuery = e.target.value;
                    renderChannels();
                });

                // Group
                groupSelect.addEventListener('change', (e) => {
                    state.currentGroup = e.target.value;
                    renderChannels();
                });

                // Video controls
                playBtn.addEventListener('click', togglePlayPause);
                stopBtn.addEventListener('click', stopPlayback);
                prevBtn.addEventListener('click', playPrev);
                nextBtn.addEventListener('click', playNext);
                muteBtn.addEventListener('click', toggleMute);
                fullscreenBtn.addEventListener('click', toggleFullscreen);

                volSlider.addEventListener('input', (e) => {
                    setVolume(e.target.value);
                });

                progressSlider.addEventListener('input', (e) => {
                    if (video.duration) {
                        const pos = (e.target.value / 1000) * video.duration;
                        video.currentTime = pos;
                    }
                });

                // X / Twitter button hover effect
                xBtn.addEventListener('mouseenter', () => {
                    xBtn.style.transform = 'scale(1.02)';
                });
                xBtn.addEventListener('mouseleave', () => {
                    xBtn.style.transform = 'scale(1)';
                });

                // Video events
                video.addEventListener('timeupdate', () => {
                    if (video.duration) {
                        const pct = (video.currentTime / video.duration) * 1000;
                        progressSlider.value = Math.min(pct, 1000);
                    }
                });

                video.addEventListener('play', () => {
                    state.isPlaying = true;
                    updatePlayButton();
                    infoLabel.className = 'info-label active';
                });

                video.addEventListener('pause', () => {
                    state.isPlaying = false;
                    updatePlayButton();
                });

                video.addEventListener('ended', () => {
                    state.isPlaying = false;
                    updatePlayButton();
                    playNext();
                });

                video.addEventListener('error', (e) => {
                    console.warn('Video error:', e);
                    showToast('❌ Playback error - The channel may be offline', 'error');
                    state.isPlaying = false;
                    updatePlayButton();
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => {
                    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
                    switch (e.key) {
                        case ' ':
                            e.preventDefault();
                            togglePlayPause();
                            break;
                        case 's':
                        case 'S':
                            stopPlayback();
                            break;
                        case 'ArrowRight':
                            playNext();
                            break;
                        case 'ArrowLeft':
                            playPrev();
                            break;
                        case 'ArrowUp':
                            volSlider.value = Math.min(parseInt(volSlider.value) + 10, 200);
                            setVolume(volSlider.value);
                            break;
                        case 'ArrowDown':
                            volSlider.value = Math.max(parseInt(volSlider.value) - 10, 0);
                            setVolume(volSlider.value);
                            break;
                        case 'm':
                        case 'M':
                            toggleMute();
                            break;
                        case 'f':
                        case 'F':
                            toggleFullscreen();
                            break;
                        case 'Escape':
                            if (document.fullscreenElement) {
                                document.exitFullscreen().catch(() => {});
                            }
                            if (modalOverlay.classList.contains('active')) {
                                closeModal();
                            }
                            break;
                    }
                });

                // Fullscreen change
                document.addEventListener('fullscreenchange', () => {
                    state.isFullscreen = !!document.fullscreenElement;
                });

                // Modal close on overlay click
                modalOverlay.addEventListener('click', (e) => {
                    if (e.target === modalOverlay) closeModal();
                });

                console.log(`🐭 ${APP_NAME} v${APP_VERSION} initialized`);
            }

            // ===== START =====
            document.addEventListener('DOMContentLoaded', init);

            // Expose for inline onclick
            window.closeModal = closeModal;
            window.showToast = showToast;
            window.loadChannels = loadChannels;
            window.playChannel = playChannel;
            window.toggleFavorite = toggleFavorite;
            window.showChannelInfo = showChannelInfo;
            window.openAddCodeModal = openAddCodeModal;
            window.openSettingsModal = openSettingsModal;
            window.openManageServers = openManageServers;
            window.toggleFullscreen = toggleFullscreen;
            window.togglePlayPause = togglePlayPause;
            window.stopPlayback = stopPlayback;
            window.playNext = playNext;
            window.playPrev = playPrev;
            window.toggleMute = toggleMute;
            window.setVolume = setVolume;

        })();
    </script>
</body>
</html>
