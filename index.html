<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>🔴 البث المباشر - MOUSE AI</title>
    <meta name="description" content="شاهد البث المباشر الآن من MOUSE AI" />
    
    <!-- ============================================================ -->
    <!--   وسوم X Player Card - المفتاح لعرض الفيديو داخل التغريدة      -->
    <!-- ============================================================ -->
    <meta name="twitter:card" content="player" />
    <meta name="twitter:site" content="@mouse0000000" />
    <meta name="twitter:title" content="🔴 البث المباشر - MOUSE AI" />
    <meta name="twitter:description" content="شاهد البث المباشر الآن - محتوى تقني حصري من MOUSE AI" />
    <meta name="twitter:player" content="https://mouse-ai-live.netlify.app/live.html" />
    <meta name="twitter:player:width" content="560" />
    <meta name="twitter:player:height" content="429" />
    <meta name="twitter:image" content="https://via.placeholder.com/1200x630/ff0000/ffffff?text=MOUSE+AI+LIVE" />
    
    <!-- وسوم Open Graph لمنصات أخرى -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="🔴 البث المباشر - MOUSE AI" />
    <meta property="og:description" content="شاهد البث المباشر الآن من MOUSE AI" />
    <meta property="og:image" content="https://via.placeholder.com/1200x630/ff0000/ffffff?text=MOUSE+AI+LIVE" />
    <meta property="og:video" content="https://mouse-ai-live.netlify.app/live.html" />
    <meta property="og:video:width" content="560" />
    <meta property="og:video:height" content="429" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 30% 10%, #05315c, #010612 75%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Stars Background */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 15px #00cfff, 0 0 30px #00cfff;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translate(-200px, 110vh);
                opacity: 0;
            }
        }
        
        .container {
            position: relative;
            z-index: 1;
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 0, 0, 0.3);
            border-radius: 24px;
            padding: 30px;
            backdrop-filter: blur(10px);
            transition: all .3s ease;
        }
        .container:hover {
            border-color: rgba(255, 0, 0, 0.6);
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.1);
        }
        
        /* ===== HEADER WITH LOGO ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: clamp(28px, 4vw, 40px);
            font-weight: 900;
            color: transparent;
            background: linear-gradient(90deg, #fff, #bff8ff, #00d9ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: water 5s linear infinite;
            filter: drop-shadow(0 0 15px #00cfff);
            user-select: none;
        }
        @keyframes water {
            to {
                background-position: 300% 0;
            }
        }
        
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ff0000;
            color: #fff;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }
        .live-badge .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        /* ===== VIDEO WRAPPER ===== */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 16px;
        }
        
        /* ===== INFO ===== */
        .info {
            margin-top: 20px;
            text-align: center;
        }
        .info .title {
            font-size: 24px;
            font-weight: 700;
            color: #00d9ff;
            margin-bottom: 5px;
        }
        .info .description {
            color: rgba(255, 255, 255, 0.5);
            font-size: 15px;
        }
        
        /* ===== SHARE BUTTONS ===== */
        .share-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            justify-content: center;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            transition: all .3s ease;
            border: none;
            cursor: pointer;
        }
        .share-btn:hover {
            transform: scale(1.05);
        }
        .share-btn.twitter {
            background: #000;
        }
        .share-btn.twitter:hover {
            background: #1a1a1a;
        }
        .share-btn.facebook {
            background: #1877f2;
        }
        .share-btn.facebook:hover {
            background: #166fe5;
        }
        .share-btn.whatsapp {
            background: #25d366;
        }
        .share-btn.whatsapp:hover {
            background: #20b857;
        }
        .share-btn.telegram {
            background: #0088cc;
        }
        .share-btn.telegram:hover {
            background: #0077b3;
        }
        .share-btn.copy {
            background: rgba(255, 255, 255, 0.1);
        }
        .share-btn.copy:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding-top: 20px;
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
        }
        
        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: rgba(0, 191, 255, 0.2);
            border: 1px solid #00bfff;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: #fff;
            font-weight: 500;
            z-index: 2000;
            animation: slideUp .5s ease;
            display: none;
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #00ff66;
            background: rgba(0, 255, 100, 0.2);
        }
        .toast.error {
            border-color: #ff4444;
            background: rgba(255, 50, 50, 0.2);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* X Icon */
        .x-icon-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
        }
        .x-icon-small svg {
            width: 12px;
            height: 12px;
            fill: #010612;
        }
        
        @media(max-width: 768px) {
            .container {
                padding: 20px;
            }
            .header {
                flex-direction: column;
                text-align: center;
            }
            .info .title {
                font-size: 20px;
            }
        }
        @media(max-width: 480px) {
            .container {
                padding: 15px;
            }
            .share-btn {
                padding: 6px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Stars Background -->
    <div id="stars"></div>

    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="logo">🐭 MOUSE AI</div>
            <div class="live-badge">
                <span class="dot"></span>
                بث مباشر
            </div>
        </div>

        <!-- ===== VIDEO ===== -->
        <div class="video-wrapper">
            <!-- هنا ضع كود التضمين من فيسبوك أو Dailymotion أو أي مصدر بث -->
            <iframe 
                src="https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2Feptv.dz%2Fvideos%2F1542336614253892%2F&show_text=true&width=560&t=0"
                allowfullscreen="true"
                allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share">
            </iframe>
        </div>

        <!-- ===== INFO ===== -->
        <div class="info">
            <div class="title">🎥 البث المباشر - MOUSE AI</div>
            <div class="description">شاهد البث المباشر الآن - محتوى تقني حصري</div>
        </div>

        <!-- ===== SHARE BUTTONS ===== -->
        <div class="share-section">
            <button onclick="shareOnX()" class="share-btn twitter">
                <span class="x-icon-small">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                </span>
                شارك على X
            </button>
            <a href="#" onclick="shareLive('facebook')" class="share-btn facebook">فيسبوك</a>
            <a href="#" onclick="shareLive('whatsapp')" class="share-btn whatsapp">واتساب</a>
            <a href="#" onclick="shareLive('telegram')" class="share-btn telegram">تلغرام</a>
            <button onclick="copyLink()" class="share-btn copy">📋 نسخ الرابط</button>
        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <p>🐭 MOUSE AI • 2026 • جميع الحقوق محفوظة</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== STARS ==========
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = (Math.random() * -1000) + 'px';
            star.style.animationDuration = (5 + Math.random() * 7) + 's';
            star.style.animationDelay = (Math.random() * 10) + 's';
            star.style.opacity = 0.4 + Math.random() * 0.6;
            document.getElementById('stars').appendChild(star);
        }

        // ========== SHARE FUNCTIONS ==========

        function shareOnX() {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent('🔴 شاهد البث المباشر الآن من MOUSE AI');
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'width=600,height=500');
        }

        function shareLive(platform) {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent('🔴 بث مباشر - MOUSE AI');
            const links = {
                facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
                whatsapp: `https://wa.me/?text=${text}%20${url}`,
                telegram: `https://t.me/share/url?url=${url}&text=${text}`
            };
            window.open(links[platform], '_blank', 'width=600,height=500');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('📋 تم نسخ الرابط', 'success');
            }).catch(() => {
                showToast('⚠️ فشل النسخ', 'error');
            });
        }

        // ========== TOAST ==========
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            if (type === 'success') toast.classList.add('success');
            if (type === 'error') toast.classList.add('error');
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => toast.classList.remove('show'), 4000);
        }

        console.log('🚀 MOUSE AI - البث المباشر جاهز للنشر على X!');
    </script>
</body>
</html>
