<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOUSE AI IPTV Pro v4.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- ===== LEFT PANEL ===== -->
        <div class="left-panel">
            <div class="video-container" id="videoContainer">
                <video id="videoPlayer" controls playsinline></video>
                <div class="video-placeholder" id="videoPlaceholder">
                    <div class="logo-text">🐭 MOUSE AI</div>
                    <p>🎬 حدد قناة للمشاهدة</p>
                </div>
                <div class="loading-overlay" id="loadingOverlay">
                    <div class="spinner"></div>
                    <span>جاري التحميل...</span>
                </div>
            </div>

            <div class="server-info" id="serverInfo"></div>

            <div class="controls">
                <input type="range" class="progress-slider" id="progressSlider" min="0" max="1000" value="0">
                <div class="btn-row">
                    <button class="ctrl-btn" id="prevBtn">⏮</button>
                    <button class="ctrl-btn play-btn" id="playBtn">▶</button>
                    <button class="ctrl-btn red" id="stopBtn">⏹</button>
                    <button class="ctrl-btn" id="nextBtn">⏭</button>
                    <span style="flex:1;"></span>
                    <button class="ctrl-btn white" id="muteBtn">🔊</button>
                    <input type="range" class="vol-slider" id="volSlider" min="0" max="200" value="100">
                    <button class="ctrl-btn white" id="fullscreenBtn">⛶</button>
                </div>
                <div class="info-label" id="infoLabel">🎯 جاهز - اختر قناة للمشاهدة</div>
            </div>
        </div>

        <!-- ===== RIGHT PANEL ===== -->
        <div class="right-panel">
            <div class="logo"><div class="animated-logo">🐭 MOUSE AI</div></div>
            <div class="subtitle">⚡ IPTV PRO</div>
            <div class="version">v4.0.0 ULTIMATE 🔥</div>

            <div class="server-section">
                <label>📡 اختر المصدر:</label>
                <select class="server-select" id="serverSelect">
                    <option value="">-- لا يوجد سيرفرات --</option>
                </select>
                <div class="btn-grid">
                    <button class="action-btn green" id="loadBtn">📡 تحميل القنوات</button>
                    <button class="action-btn white" id="fileBtn">📁 ملف M3U</button>
                    <button class="action-btn green full" id="addCodeBtn">➕ إضافة سيرفر</button>
                    <button class="action-btn white full" id="manageBtn">⚙️ إدارة السيرفرات</button>
                </div>
                <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
                <div class="status-label" id="statusLabel">🚀 جاهز. اضغط تحميل للبدء.</div>
            </div>

            <select class="group-select" id="groupSelect"><option value="All Groups">📂 كل المجموعات</option></select>
            <input type="text" class="search-input" id="searchInput" placeholder="🔍 بحث عن قناة...">

            <div class="channel-list" id="channelList">
                <div style="text-align:center;padding:40px 20px;color:var(--text-muted);">
                    📺 لا توجد قنوات<br>
                    <span style="font-size:12px;">أضف سيرفر واضغط تحميل</span>
                </div>
            </div>

            <div class="channel-count" id="countLabel">0 قناة</div>

            <div class="bottom-btns">
                <button class="action-btn" id="favBtn">⭐ المفضلة</button>
                <button class="action-btn white" id="settingsBtn">⚙️ الإعدادات</button>
            </div>

            <a href="https://x.com/mouse0000000" target="_blank" class="x-btn">
                <svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                @mouse0000000
            </a>

            <div class="footer">
                © 2025 MOUSE AI | <a href="https://x.com/mouse0000000" target="_blank">🐭 @mouse0000000</a>
            </div>
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <div class="modal-title" id="modalTitle">🐭 MOUSE AI</div>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script src="script.js"></script>
</body>
</html>
