<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-dark: #0a0c0f;
  --bg-card: #111418;
  --bg-input: #161a20;
  --border: #1e242c;
  --green: #00ff88;
  --green-dim: #00cc6a;
  --red: #ff2a2a;
  --red-dim: #cc2222;
  --white: #ffffff;
  --text-primary: #ffffff;
  --text-secondary: #8b95a5;
  --text-muted: #5a6470;
  --fire-orange: #ff6b35;
}
body {
  background: var(--bg-dark);
  color: var(--text-primary);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===== HEADER ===== */
.header {
  background: linear-gradient(135deg, #0f1525 0%, #1a1f35 100%);
  border-bottom: 2px solid var(--green);
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 100;
}
.logo {
  font-size: 28px;
  animation: fireGlow 2s ease-in-out infinite;
}
@keyframes fireGlow {
  0%, 100% { filter: drop-shadow(0 0 5px #00ff88); }
  25% { filter: drop-shadow(0 0 15px #ffd700); }
  50% { filter: drop-shadow(0 0 10px #ff2a2a); }
  75% { filter: drop-shadow(0 0 15px #ffffff); }
}
.header-title {
  font-size: 16px;
  font-weight: bold;
  color: var(--green);
  text-shadow: 0 0 10px rgba(0,255,136,0.3);
}
.header-version {
  font-size: 10px;
  color: var(--text-muted);
}

/* ===== VIDEO PLAYER ===== */
.video-container {
  position: relative;
  background: #000;
  border: 3px solid var(--green);
  border-radius: 12px;
  margin: 8px 12px;
  overflow: hidden;
  flex-shrink: 0;
}
video {
  width: 100%;
  height: 220px;
  display: block;
  background: #000;
}
.video-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.6);
  color: var(--green);
  font-size: 14px;
  font-weight: bold;
}

/* ===== CONTROLS ===== */
.controls {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg-card);
  border-radius: 10px;
  margin: 0 12px 8px;
  border: 2px solid var(--border);
}
.btn {
  background: linear-gradient(180deg, var(--green) 0%, var(--green-dim) 100%);
  border: 2px solid var(--green);
  border-radius: 10px;
  padding: 10px 16px;
  color: #0a0c0f;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  min-width: 44px;
  text-align: center;
}
.btn-red {
  background: linear-gradient(180deg, var(--red) 0%, var(--red-dim) 100%);
  border-color: var(--red);
  color: white;
}
.btn-white {
  background: linear-gradient(180deg, var(--white) 0%, #e0e0e0 100%);
  border-color: var(--white);
  color: #0a0c0f;
}
.btn-small { padding: 8px 12px; font-size: 12px; }
.btn:active { transform: scale(0.95); }

input[type="range"] {
  flex: 1;
  -webkit-appearance: none;
  height: 6px;
  background: var(--bg-input);
  border-radius: 3px;
  outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  background: var(--green);
  border-radius: 50%;
  border: 2px solid white;
  cursor: pointer;
}

/* ===== SERVER BAR ===== */
.server-bar {
  display: flex;
  gap: 8px;
  padding: 0 12px 8px;
  flex-wrap: wrap;
}
select, input[type="text"] {
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  flex: 1;
  min-width: 120px;
}
select:focus, input:focus { border-color: var(--green); }

/* ===== CHANNELS LIST ===== */
.channels-section {
  flex: 1;
  overflow-y: auto;
  padding: 0 12px 12px;
}
.channel-item {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.2s;
}
.channel-item:hover, .channel-item.active {
  border-color: var(--green);
  background: #1a2028;
}
.channel-item.active {
  background: var(--green);
  color: #0a0c0f;
}
.channel-item .fav-star {
  color: var(--fire-orange);
  font-size: 16px;
}
.channel-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
}
.channel-group {
  font-size: 10px;
  color: var(--text-muted);
  background: var(--bg-input);
  padding: 3px 8px;
  border-radius: 6px;
}
.channel-item.active .channel-group {
  background: rgba(0,0,0,0.2);
  color: #0a0c0f;
}

/* ===== TABS ===== */
.tabs {
  display: flex;
  gap: 4px;
  padding: 0 12px 8px;
}
.tab {
  flex: 1;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: var(--text-secondary);
  cursor: pointer;
}
.tab.active {
  background: var(--green);
  border-color: var(--green);
  color: #0a0c0f;
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-card);
  border: 2px solid var(--green);
  border-radius: 16px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 20px;
}
.modal-title {
  font-size: 18px;
  font-weight: bold;
  color: var(--green);
  margin-bottom: 15px;
  text-align: center;
}
.modal-row {
  margin-bottom: 12px;
}
.modal-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
textarea {
  width: 100%;
  background: var(--bg-input);
  border: 2px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  color: var(--text-primary);
  font-size: 12px;
  font-family: Consolas, monospace;
  resize: vertical;
  min-height: 100px;
  outline: none;
}
textarea:focus { border-color: var(--green); }

/* ===== INFO BAR ===== */
.info-bar {
  padding: 6px 12px;
  font-size: 11px;
  color: var(--green);
  text-align: center;
  background: var(--bg-card);
  border-radius: 6px;
  margin: 0 12px 8px;
  border-left: 3px solid var(--green);
  display: none;
}
.info-bar.show { display: block; }

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 6px;
  font-size: 10px;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
}
.footer a { color: var(--green); text-decoration: none; }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg-dark); }
::-webkit-scrollbar-thumb { background: var(--green); border-radius: 3px; }

/* ===== RESPONSIVE ===== */
@media (min-width: 768px) {
  #app { flex-direction: row; }
  .left-panel { width: 60%; display: flex; flex-direction: column; }
  .right-panel { width: 40%; border-right: 2px solid var(--border); display: flex; flex-direction: column; }
  video { height: 100%; max-height: 60vh; }
}
</style>

let allChannels = [];
let filteredChannels = [];
let currentChannel = -1;
let favorites = JSON.parse(localStorage.getItem('mouse_ai_favorites') || '[]');
let customServers = JSON.parse(localStorage.getItem('mouse_ai_servers') || '[]');
let currentTab = 'all';
let currentGroup = 'all';

// ===== PARSER =====
function parseM3U(content) {
  const lines = content.split('\\n');
  const channels = [];
  let current = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTINF:')) {
      const parts = line.split(',', 1);
      const name = line.includes(',') ? line.substring(line.indexOf(',') + 1).trim() : line;
      let logo = '';
      const logoMatch = line.match(/tvg-logo="([^"]+)"/);
      if (logoMatch) logo = logoMatch[1];
      let group = 'General';
      const groupMatch = line.match(/group-title="([^"]+)"/);
      if (groupMatch) group = groupMatch[1];
      current = { name, logo, group };
    } else if (line.startsWith('http') && current) {
      current.url = line;
      channels.push(current);
      current = null;
    }
  }
  return channels;
}

function parseCode(text) {
  text = text.trim();
  if (!text) return null;

  // Xtream
  let m = text.match(/(https?:\\/\\/[^/\\s]+(?::\\d+)?)(?:\\/[^\\s]*)?\\?.*username=([^&\\s]+).*password=([^&\\s]+)/i);
  if (m) return { type: 'xtream', url: `${m[1]}/get.php?username=${m[2]}&password=${m[3]}&type=m3u_plus` };

  // CCcam
  m = text.match(/^[Cc][:;]\\s*(\\S+)\\s+(\\d+)\\s+(\\S+)\\s+(\\S+)/m);
  if (m) return { type: 'cccam', url: `http://${m[1]}:${m[2]}/get.php?username=${m[3]}&password=${m[4]}&type=m3u_plus` };

  // MAC
  const macs = text.match(/[0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}[:-][0-9A-Fa-f]{2}/g);
  if (macs) {
    const hostMatch = text.match(/(https?:\\/\\/\\S+)/);
    if (hostMatch) return { type: 'mac', url: `${hostMatch[1].replace(/\\/$/, '')}/stalker_portal/server/load.php?type=stb&action=handshake&mac=${macs[0]}` };
  }

  // M3U URL
  m = text.match(/(https?:\\/\\/\\S+\\.(?:m3u|m3u8)(?:\\?\\S+)?)/i);
  if (m) return { type: 'm3u', url: m[1] };

  // Generic host
  m = text.match(/(https?:\\/\\/\\S+)/);
  if (m) return { type: 'generic', url: m[1] };

  return null;
}

// ===== LOADING =====
async function loadChannels() {
  const sel = document.getElementById('serverSelect').value;
  const list = document.getElementById('channelsList');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">⏳ جارٍ التحميل...</div>';

  try {
    let content;
    if (sel === 'builtin') {
      content = BUILTIN_M3U;
    } else {
      const res = await fetch(sel, { 
        headers: { 'User-Agent': 'Mozilla/5.0' },
        mode: 'no-cors'
      });
      content = await res.text();
    }
    allChannels = parseM3U(content);
    updateGroups();
    applyFilter();
    showInfo(`✅ تم تحميل ${allChannels.length} قناة`);
  } catch (e) {
    list.innerHTML = `<div style="text-align:center;padding:40px;color:var(--red);">❌ خطأ: ${e.message}</div>`;
  }
}

function updateGroups() {
  const groups = [...new Set(allChannels.map(c => c.group))];
  const select = document.getElementById('groupSelect');
  select.innerHTML = '<option value="all">📂 كل المجموعات</option>';
  groups.forEach(g => {
    select.innerHTML += `<option value="${g}">${g}</option>`;
  });
}

function applyFilter() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const group = document.getElementById('groupSelect').value;

  filteredChannels = allChannels.filter(ch => {
    if (currentTab === 'fav' && !favorites.includes(ch.url)) return false;
    if (group !== 'all' && ch.group !== group) return false;
    if (search && !ch.name.toLowerCase().includes(search)) return false;
    return true;
  });

  renderChannels();
}

function renderChannels() {
  const list = document.getElementById('channelsList');
  if (filteredChannels.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">لا توجد قنوات</div>';
    return;
  }

  list.innerHTML = filteredChannels.map((ch, i) => {
    const isFav = favorites.includes(ch.url);
    const isActive = i === currentChannel;
    return `
      <div class="channel-item ${isActive ? 'active' : ''}" onclick="playChannel(${i})" oncontextmenu="event.preventDefault(); toggleFav('${ch.url}')">
        <span class="fav-star">${isFav ? '⭐' : ''}</span>
        <span class="channel-name">${ch.name}</span>
        <span class="channel-group">${ch.group}</span>
      </div>
    `;
  }).join('');
}

// ===== PLAYBACK =====
function playChannel(index) {
  if (index < 0 || index >= filteredChannels.length) return;
  currentChannel = index;
  const ch = filteredChannels[index];
  const video = document.getElementById('videoPlayer');
  const overlay = document.getElementById('videoOverlay');

  overlay.style.display = 'none';
  video.src = ch.url;
  video.play().catch(e => {
    overlay.style.display = 'flex';
    overlay.textContent = '❌ لا يمكن التشغيل - جرب مشغل خارجي';
  });

  document.getElementById('playBtn').textContent = '⏸';
  renderChannels();
}

function togglePlay() {
  const video = document.getElementById('videoPlayer');
  const btn = document.getElementById('playBtn');
  if (video.paused) {
    video.play();
    btn.textContent = '⏸';
  } else {
    video.pause();
    btn.textContent = '▶';
  }
}

function stopVideo() {
  const video = document.getElementById('videoPlayer');
  video.pause();
  video.src = '';
  currentChannel = -1;
  document.getElementById('playBtn').textContent = '▶';
  document.getElementById('videoOverlay').style.display = 'flex';
  document.getElementById('videoOverlay').textContent = 'اختر قناة للتشغيل';
  renderChannels();
}

function playNext() {
  if (currentChannel < filteredChannels.length - 1) playChannel(currentChannel + 1);
  else playChannel(0);
}

function playPrev() {
  if (currentChannel > 0) playChannel(currentChannel - 1);
  else playChannel(filteredChannels.length - 1);
}

function setVolume(v) {
  document.getElementById('videoPlayer').volume = v / 100;
}

function toggleMute() {
  const video = document.getElementById('videoPlayer');
  const btn = document.getElementById('muteBtn');
  video.muted = !video.muted;
  btn.textContent = video.muted ? '🔇' : '🔊';
}

function toggleFullscreen() {
  const container = document.getElementById('videoContainer');
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else {
    container.requestFullscreen();
  }
}

// ===== FAVORITES =====
function toggleFav(url) {
  if (favorites.includes(url)) {
    favorites = favorites.filter(u => u !== url);
  } else {
    favorites.push(url);
  }
  localStorage.setItem('mouse_ai_favorites', JSON.stringify(favorites));
  applyFilter();
}

// ===== TABS =====
function setTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.getElementById('searchBar').style.display = tab === 'search' ? 'flex' : 'none';
  applyFilter();
}

function doSearch() { applyFilter(); }
function filterGroup() { applyFilter(); }
function onServerChange() { loadChannels(); }

// ===== MODAL =====
function showAddCode() {
  document.getElementById('addCodeModal').classList.add('show');
}
function closeModal() {
  document.getElementById('addCodeModal').classList.remove('show');
  document.getElementById('parseResult').textContent = '';
}

function parseCode() {
  const text = document.getElementById('codeInput').value;
  const name = document.getElementById('manualName').value;
  const manualUrl = document.getElementById('manualUrl').value;
  const resultDiv = document.getElementById('parseResult');

  if (manualUrl) {
    addCustomServer(name || 'Custom Server', manualUrl);
    resultDiv.innerHTML = '<span style="color:var(--green)">✅ تم الإضافة!</span>';
    setTimeout(closeModal, 1000);
    return;
  }

  const result = parseCode(text);
  if (result) {
    addCustomServer(name || result.type, result.url);
    resultDiv.innerHTML = `<span style="color:var(--green)">✅ تم الكشف: ${result.type} | تم الإضافة!</span>`;
    setTimeout(closeModal, 1500);
  } else {
    resultDiv.innerHTML = '<span style="color:var(--red)">❌ لم يتم الكشف عن الكود</span>';
  }
}

function addCustomServer(name, url) {
  customServers.push({ name, url });
  localStorage.setItem('mouse_ai_servers', JSON.stringify(customServers));
  const sel = document.getElementById('serverSelect');
  sel.innerHTML += `<option value="${url}">${name}</option>`;
  sel.value = url;
}

function showInfo(msg) {
  const bar = document.getElementById('infoBar');
  bar.textContent = msg;
  bar.classList.add('show');
  setTimeout(() => bar.classList.remove('show'), 4000);
}

// ===== INIT =====
window.onload = function() {
  // Load custom servers
  customServers.forEach(s => {
    document.getElementById('serverSelect').innerHTML += `<option value="${s.url}">${s.name}</option>`;
  });
  // Auto-load builtin
  allChannels = parseM3U(BUILTIN_M3U);
  updateGroups();
  applyFilter();
  showInfo('✅ جاهز - اضغط تحميل للسيرفرات الخارجية');
};
