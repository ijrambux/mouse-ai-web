<!DOCTYPE html>
<html dir="ltr" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 MoUsE AI - توليد فيديوهات احترافية</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        /* ===== MAIN CARD ===== */
        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 45px;
            max-width: 820px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo {
            font-size: 52px;
            font-weight: 800;
            background: linear-gradient(90deg, #00d4ff, #0077ff, #00d4ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fireMove 3s ease-in-out infinite;
            letter-spacing: -1px;
            text-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
        }
        @keyframes fireMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .subtitle {
            color: #888;
            font-size: 16px;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        .status-badge {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(0, 212, 255, 0.08);
            color: #00d4ff;
            border: 1px solid rgba(0, 212, 255, 0.15);
            backdrop-filter: blur(10px);
            transition: all 0.3s;
        }
        .status-badge.error {
            color: #ff6b6b;
            border-color: rgba(255, 107, 107, 0.2);
            background: rgba(255, 107, 107, 0.08);
        }
        /* ===== GLASS BUTTONS ===== */
        .glass-btn {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: 0.3px;
        }
        .glass-btn:hover {
            background: rgba(0, 212, 255, 0.12);
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.15);
        }
        .glass-btn:active {
            transform: translateY(0px);
        }
        .glass-btn.danger:hover {
            background: rgba(255, 107, 107, 0.12);
            border-color: rgba(255, 107, 107, 0.3);
            box-shadow: 0 8px 30px rgba(255, 107, 107, 0.1);
        }
        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #ccc;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        .form-group textarea,
        .form-group input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 18px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            resize: vertical;
            font-family: inherit;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea:focus,
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.4);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.05), inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea {
            min-height: 120px;
        }
        .form-group .hint {
            color: #666;
            font-size: 12px;
            margin-top: 8px;
            letter-spacing: 0.3px;
        }
        /* ===== SETTINGS ===== */
        .settings-row {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 18px 24px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .settings-row .item {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-row .label {
            color: #888;
            font-size: 14px;
        }
        .settings-row .value {
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            background: rgba(0, 212, 255, 0.08);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        /* ===== GENERATE BUTTON ===== */
        .generate-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 119, 255, 0.15));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(0, 212, 255, 0.05);
            letter-spacing: 0.5px;
        }
        .generate-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(0, 119, 255, 0.25));
            border-color: rgba(0, 212, 255, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(0, 212, 255, 0.15);
        }
        .generate-btn:active {
            transform: translateY(0px);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .generate-btn .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .generate-btn.loading .spinner {
            display: block;
        }
        .generate-btn.loading .btn-text {
            display: none;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* ===== STATUS LOG ===== */
        .log-box {
            margin-top: 28px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 18px;
            padding: 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 200px;
            overflow-y: auto;
        }
        .log-box .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 13px;
            color: #888;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        .log-box .log-entry .time {
            color: #555;
            margin-right: 12px;
        }
        .log-box .log-entry.success {
            color: #00d4ff;
        }
        .log-box .log-entry.error {
            color: #ff6b6b;
        }
        .log-box .log-entry.info {
            color: #aaddff;
        }
        /* ===== SCROLLBAR ===== */
        .log-box::-webkit-scrollbar {
            width: 6px;
        }
        .log-box::-webkit-scrollbar-track {
            background: transparent;
        }
        .log-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 24px; }
            .logo { font-size: 34px; }
            .settings-row { flex-direction: column; gap: 12px; }
            .glass-btn { padding: 8px 16px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <!-- HEADER -->
    <div class="header">
        <div class="logo">🎬 MoUsE AI</div>
        <div class="subtitle">توليد فيديوهات احترافية بالذكاء الاصطناعي</div>
        <div class="status-badge" id="statusBadge">🔄 جاري التحقق...</div>
    </div>

    <!-- PROMPT -->
    <div class="form-group">
        <label for="promptInput">📝 وصف الفيديو (البرومبت)</label>
        <textarea id="promptInput" placeholder="مثال: غروب شمس سينمائي فوق المحيط مع طيور تحلق في السماء، جودة عالية 8K UHD">غروب شمس سينمائي فوق المحيط مع طيور تحلق في السماء، جودة عالية 8K UHD</textarea>
        <div class="hint">💡 اكتب وصفاً تفصيلياً للحصول على نتائج أفضل</div>
    </div>

    <!-- SETTINGS -->
    <div class="form-group">
        <label>⚙️ الإعدادات</label>
        <div class="settings-row">
            <div class="item"><span class="label">⏱️ المدة:</span><span class="value">10 ثواني</span></div>
            <div class="item"><span class="label">📐 نسبة الأبعاد:</span><span class="value">16:9 (أفقي)</span></div>
        </div>
    </div>

    <!-- GENERATE BUTTON -->
    <button class="generate-btn" id="generateBtn">
        <span class="btn-text">🚀 توليد الفيديو</span>
        <span class="spinner"></span>
    </button>

    <!-- STATUS LOG -->
    <div class="log-box" id="logBox">
        <div class="log-entry info"><span class="time">[الآن]</span> 🎬 مرحباً بك في MoUsE AI!</div>
        <div class="log-entry info"><span class="time">[الآن]</span> 📝 اكتب وصفاً تفصيلياً للحصول على أفضل النتائج</div>
    </div>
</div>

<script>
    // ============================================================
    // 🎬 MoUsE AI - واجهة ويب احترافية (الخادم مخفي)
    // ============================================================

    (function() {
        'use strict';

        // ---- عناصر DOM ----
        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const logBox = document.getElementById('logBox');
        const statusBadge = document.getElementById('statusBadge');

        // ---- حالة التطبيق ----
        let isGenerating = false;
        // الخادم مخفي هنا (غير ظاهر في الواجهة)
        const API_BASE = 'https://mouse-ai-nine.vercel.app';

        // ---- دوال مساعدة ----
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function setStatus(text, isOk = true) {
            statusBadge.textContent = text;
            statusBadge.className = 'status-badge' + (isOk ? '' : ' error');
        }

        function resetButton() {
            generateBtn.classList.remove('loading');
            generateBtn.disabled = false;
            const span = generateBtn.querySelector('.btn-text');
            if (span) span.textContent = '🚀 توليد الفيديو';
        }

        function setLoading() {
            generateBtn.classList.add('loading');
            generateBtn.disabled = true;
            const span = generateBtn.querySelector('.btn-text');
            if (span) span.textContent = '⏳ جاري التوليد...';
        }

        // ---- التحقق من حالة الخادم ----
        async function checkServerStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`, { signal: AbortSignal.timeout(5000) });
                if (response.ok) {
                    setStatus(`✅ الخادم متصل`, true);
                    addLog('✅ الخادم جاهز للعمل', 'success');
                } else {
                    setStatus('⚠️ الخادم: يستجيب ولكن مع خطأ', false);
                    addLog('⚠️ استجابة غير متوقعة من الخادم', 'error');
                }
            } catch (err) {
                setStatus('❌ الخادم: غير متاح (تحقق من اتصالك)', false);
                addLog('❌ فشل الاتصال بالخادم: ' + err.message, 'error');
            }
        }

        // ---- توليد الفيديو ----
        generateBtn.addEventListener('click', async function() {
            if (isGenerating) return;

            const prompt = promptInput.value.trim();
            if (!prompt || prompt.length < 5) {
                addLog('❌ الرجاء إدخال وصف للفيديو (5 أحرف على الأقل)', 'error');
                return;
            }

            isGenerating = true;
            setLoading();
            addLog('🚀 بدء توليد الفيديو...', 'info');
            addLog(`📝 البرومبت: ${prompt.substring(0, 60)}...`, 'info');

            try {
                const formData = new FormData();
                formData.append('prompt', prompt);

                const response = await fetch(`${API_BASE}/generate`, {
                    method: 'POST',
                    body: formData,
                    signal: AbortSignal.timeout(310000)
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `video_${new Date().toISOString().slice(0,19).replace(/[:-]/g, '')}.mp4`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    addLog('✅ تم توليد الفيديو بنجاح! تم التحميل تلقائياً.', 'success');
                } else {
                    let errorMsg = `خطأ ${response.status}`;
                    try {
                        const errData = await response.json();
                        if (errData.detail) errorMsg += `: ${errData.detail}`;
                        else if (errData.message) errorMsg += `: ${errData.message}`;
                    } catch (e) {
                        const text = await response.text();
                        if (text) errorMsg += `: ${text.substring(0, 100)}`;
                    }
                    addLog(`❌ فشل التوليد: ${errorMsg}`, 'error');
                }
            } catch (err) {
                if (err.name === 'TimeoutError' || err.name === 'AbortError') {
                    addLog('❌ انتهى الوقت. قد يكون الخادم مشغولاً، حاول مرة أخرى.', 'error');
                } else {
                    addLog(`❌ خطأ: ${err.message}`, 'error');
                }
            } finally {
                isGenerating = false;
                resetButton();
                addLog('⏳ جاهز لتوليد فيديو جديد', 'info');
            }
        });

        // ---- تهيئة ----
        addLog('', 'info');
        addLog('⏱️ مدة الفيديو: 10 ثواني (ثابتة)', 'info');
        checkServerStatus();

        // تحديث الحالة كل 30 ثانية
        setInterval(checkServerStatus, 30000);

    })();
</script>

</body>
</html>
