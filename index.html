<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>🐭м𝓞𝓊ŜⒺ AI</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{background:radial-gradient(circle at top,#05315c,#010612 70%);overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;padding:40px;min-height:100vh}
#stars{position:fixed;inset:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff,0 0 15px #00cfff,0 0 30px #00cfff;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-100px)}100%{transform:translate(-250px,110vh);opacity:0}}
.logo{position:relative;font-size:64px;font-weight:bold;letter-spacing:4px;margin-bottom:70px;color:transparent;background:linear-gradient(90deg,#fff,#bff8ff,#00d9ff,#fff,#00d9ff,#bff8ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:water 5s linear infinite,pulse 2s ease-in-out infinite;filter:drop-shadow(0 0 8px #00cfff) drop-shadow(0 0 25px #00cfff) drop-shadow(0 0 60px #008cff)}
.logo:before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(0,220,255,.5),transparent 70%);filter:blur(25px);z-index:-1;animation:aura 4s infinite}
.logo:after{content:"";position:absolute;top:0;left:-50%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent);transform:skewX(-25deg);animation:shine 3s infinite}
@keyframes water{to{background-position:300% 0}}
@keyframes shine{to{left:150%}}
@keyframes aura{50%{transform:translate(-50%,-50%) scale(1.2)}}
@keyframes pulse{50%{transform:scale(1.04)}}
.article{width:90%;max-width:950px;padding:40px;background:rgba(255,255,255,.05);border:2px solid #00bfff;border-radius:20px;backdrop-filter:blur(8px);line-height:2.2;font-size:23px}
.share{margin-top:25px;padding:14px 35px;font-size:20px}
</style></head><body>
<div id="stars"></div>
<div class="logo">🐭м𝓞𝓊ŜⒺ AI</div>
<div class="article">
<p>سنتطور مع أول إرهاصات التوقف عن الشيتة، تضخيم التفاهات، تدشين المشاريع الصغيرة على أنها إنجازات تاريخية، وتحويل كل حدث عادي إلى ملحمة إعلامية. أما قبل ذلك... فسيظل شعار المرحلة.</p>
<h2 style="text-align:center;color:#00d9ff">بعاد... بعاد... بعاد</h2>
<div>✍ 🐭м𝓞𝓊ŜⒺ AI</div>
</div>
<button class="share" onclick="shareX()">🐦 مشاركة على X</button>
<script>
const s=document.getElementById("stars");
for(let i=0;i<160;i++){let d=document.createElement("div");d.className="star";let z=Math.random()*3+1;d.style.width=z+"px";d.style.height=z+"px";d.style.left=Math.random()*100+"%";d.style.top=Math.random()*-1200+"px";d.style.animationDuration=(4+Math.random()*6)+"s";d.style.animationDelay=(Math.random()*8)+"s";s.appendChild(d);}
function shareX(){const t="سنتطور مع أول إرهاصات التوقف عن الشيتة... بعاد... بعاد... بعاد";window.open("https://twitter.com/intent/tweet?text="+encodeURIComponent(t)+"&url="+encodeURIComponent(location.href),"_blank");}
</script></body></html>
