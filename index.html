<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOUSE AI - Smart IPTV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a0a; color: #fff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        header { background: #141414; padding: 12px 25px; border-bottom: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand .icon { font-size: 26px; }
        .brand .text { font-size: 22px; font-weight: 900; color: #fff; }
        .brand .text span { color: #6c5ce7; }
        
        .search-area { display: flex; align-items: center; background: #1f1f1f; border-radius: 25px; padding: 5px 15px; border: 1px solid #333; }
        .search-area input { background: transparent; border: none; color: #fff; padding: 6px 10px; outline: none; width: 180px; font-size: 14px; }
        .search-area input::placeholder { color: #666; }
        .search-area i { color: #666; }

        .app-container { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 380px; background: #111; border-left: 1px solid #222; display: flex; flex-direction: column; }
        .sidebar-header { padding: 12px 15px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; font-size: 14px; color: #aaa; }
        
        .channels-list { flex: 1; overflow-y: auto; padding: 5px 10px; }
        .channels-list::-webkit-scrollbar { width: 4px; }
        .channels-list::-webkit-scrollbar-thumb { background: #6c5ce7; border-radius: 10px; }

        .channel-item {
            display: flex; align-items: center; padding: 7px 10px; border-radius: 6px;
            cursor: pointer; transition: 0.15s; margin-bottom: 3px;
        }
        .channel-item:hover { background: #1e1e1e; }
        .channel-item.active { background: #c00; color: #fff; }
        .channel-item .num { width: 28px; font-size: 12px; color: #666; font-weight: bold; }
        .channel-item .logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; margin: 0 12px; background: #1a1a1a; border-radius: 5px; overflow: hidden; }
        .channel-item .logo img { max-width: 100%; max-height: 100%; }
        .channel-item .logo .fallback { font-size: 14px; color: #444; }
        .channel-item .name { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .main-player { flex: 1; background: #000; display: flex; flex-direction: column; position: relative; }
        .video-wrapper { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; }
        #videoPlayer { width: 100%; height: 100%; }

        .info-overlay {
            position: absolute; bottom: 30px; left: 30px; pointer-events: none;
            background: rgba(0,0,0,0.6); padding: 12px 20px; border-radius: 8px; border-left: 4px solid #c00;
        }
        .info-overlay .tag { background: #c00; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 10px; font-weight: bold; display: inline-block; margin-bottom: 3px; }
        .info-overlay h2 { font-size: 18px; font-weight: bold; margin: 0; }

        .info-panel { width: 300px; background: #111; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .info-panel .empty { color: #444; text-align: center; }
        .info-panel .empty i { font-size: 50px; margin-bottom: 15px; }
        
        @media (max-width: 800px) { 
            .sidebar { width: 100%; height: 250px; border-top: 1px solid #222; border-left: none; }
            .app-container { flex-direction: column-reverse; }
            .main-player { height: 300px; }
            .info-panel { display: none; }
            .search-area input { width: 120px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="icon">🐭</span>
            <div class="text">MOUSE <span>AI</span></div>
        </div>
        <div class="search-area">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="بحث عن قناة..." onkeyup="filterChannels()" />
        </div>
    </header>

    <div class="app-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>📺 <span id="channelCount">0</span> قناة</span>
                <span>LIVE TV</span>
            </div>
            <div class="channels-list" id="channelsList">
                <div style="padding:30px; text-align:center; color:#444;">
                    <i class="fas fa-spinner fa-spin" style="font-size:25px; margin-bottom:10px; display:block;"></i>
                    جاري تحميل القنوات...
                </div>
            </div>
        </div>

        <div class="main-player">
            <div class="video-wrapper">
                <video id="videoPlayer" class="video-js vjs-default-skin" controls preload="auto" style="width:100%; height:100%;"></video>
                <div class="info-overlay" id="overlayInfo">
                    <div class="tag">LIVE</div>
                    <h2 id="currentChannelName">اضغط على قناة</h2>
                </div>
            </div>
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="empty">
                <i class="fas fa-play-circle"></i>
                <h3>اختر قناة</h3>
                <p style="font-size:13px; margin-top:8px;">ستظهر التفاصيل هنا</p>
            </div>
        </div>
    </div>

    <script>
        const player = videojs('videoPlayer', {
            controls: true, autoplay: true, preload: 'auto', fluid: true,
            html5: { vhs: { enableLowInitialPlaylist: true, smoothQualityChange: true } }
        });

        // هذا هو الرابط الجديد الذي سيذهب إلى خادم Vercel الخاص بك
        const API_URL = "/api/proxy"; 

        let allChannels = [];

        async function loadChannels() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error('فشل الاتصال بالسيرفر');
                }
                
                const data = await response.text();

                allChannels = parseM3U(data);
                if(allChannels.length > 0){
                    allChannels.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
                    renderChannels(allChannels);
                } else {
                    document.getElementById('channelsList').innerHTML = '<div style="padding:30px; text-align:center; color:#666;">لا توجد قنوات متاحة.</div>';
                }
            } catch (error) {
                document.getElementById('channelsList').innerHTML = `
                    <div style="padding:30px; text-align:center; color:#c00;">
                        <i class="fas fa-exclamation-triangle" style="font-size:30px; display:block; margin-bottom:10px;"></i>
                        خطأ في الاتصال بالسيرفر.<br>
                        <span style="font-size:13px; color:#666;">${error.message}</span>
                    </div>
                `;
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const channels = [];
            let current = {};

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const parts = line.split(',');
                    const name = parts.pop();
                    const logoMatch = line.match(/tvg-logo="(.*?)"/);
                    const logo = logoMatch ? logoMatch[1] : '';
                    current = { name: name, logo: logo };
                } else if (line.startsWith('http') && current.name) {
                    current.url = line;
                    channels.push(current);
                    current = {};
                }
            });
            return channels;
        }

        function renderChannels(channels) {
            const listContainer = document.getElementById('channelsList');
            document.getElementById('channelCount').textContent = channels.length;
            listContainer.innerHTML = '';

            channels.forEach((ch, index) => {
                const item = document.createElement('div');
                item.className = 'channel-item';
                item.setAttribute('data-name', ch.name.toLowerCase());
                item.setAttribute('onclick', `playChannel('${ch.url.replace(/'/g, "\\'")}', '${ch.name.replace(/'/g, "\\'")}', '${ch.logo.replace(/'/g, "\\'")}')`);
                
                const safeLogo = ch.logo ? ch.logo : '';
                item.innerHTML = `
                    <div class="num">${index + 1}</div>
                    <div class="logo">
                        ${safeLogo ? `<img src="${safeLogo}" onerror="this.style.display='none'; this.parentElement.innerHTML+='<i class=\\'fas fa-tv fallback\\'></i>';" />` : `<i class="fas fa-tv fallback"></i>`}
                    </div>
                    <div class="name">${ch.name}</div>
                `;
                listContainer.appendChild(item);
            });
        }

        function filterChannels() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const items = document.querySelectorAll('.channel-item');
            let visibleCount = 0;

            items.forEach(item => {
                const name = item.getAttribute('data-name');
                if (name.includes(query)) {
                    item.style.display = 'flex';
                    visibleCount++;
                } else {
                    item.style.display = 'none';
                }
            });
            document.getElementById('channelCount').textContent = visibleCount;
        }

        function playChannel(url, name, logo) {
            if(!url) return;
            player.src({ type: 'application/x-mpegURL', src: url });
            player.play();
            
            document.getElementById('currentChannelName').innerHTML = name;
            
            const panel = document.getElementById('infoPanel');
            panel.innerHTML = `
                <div style="text-align:center; width:100%;">
                    <div style="width:80px; height:80px; background:#1a1a1a; border-radius:15px; margin:0 auto 15px; display:flex; align-items:center; justify-content:center; border:2px solid #c00;">
                        ${logo ? `<img src="${logo}" style="max-width:70%; max-height:70%; border-radius:8px;" onerror="this.outerHTML='<i class=\\'fas fa-tv\\' style=\\'font-size:30px; color:#555;\\'></i>'" />` : `<i class="fas fa-tv" style="font-size:30px; color:#555;"></i>`}
                    </div>
                    <span style="background:#c00; padding:3px 10px; border-radius:3px; font-size:11px;">LIVE TV</span>
                    <h2 style="margin-top:10px; font-size:20px;">${name}</h2>
                </div>
            `;

            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.channel-item')?.classList.add('active');
        }

        loadChannels();
    </script>
</body>
</html>
