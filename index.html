<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐭 MOUSE AI - Live Tech Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #6c5ce7;
            --bg-dark: #0b0d17;
            --bg-card: #131626;
            --border-color: #2a2d44;
            --text-white: #ffffff;
            --text-light: #a0a3bd;
            --radius: 16px;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Global Reset */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-white); overflow-x: hidden; min-height: 100vh; }

        /* ===== BACKGROUND STARS ===== */
        #stars-container { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .star { position: absolute; background: #00d4ff; border-radius: 50%; box-shadow: 0 0 15px #00d4ff; animation: twinkle var(--duration) infinite alternate; }
        @keyframes twinkle { 
            0% { opacity: 0.1; transform: scale(0.4); } 
            100% { opacity: 1; transform: scale(1.2); } 
        }

        /* ============================================================
           HEADER / NAVIGATION (Like IPTV Professional Design)
           ============================================================ */
        header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(11, 13, 23, 0.85); backdrop-filter: blur(20px);
            padding: 15px 30px; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }

        /* Animated Logo */
        .brand-logo {
            display: flex; align-items: center; gap: 15px;
            text-decoration: none; cursor: pointer;
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 5px rgba(108, 92, 231, 0.2)); }
            50% { transform: translateY(-4px); filter: drop-shadow(0 0 25px rgba(108, 92, 231, 0.8)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 0 5px rgba(108, 92, 231, 0.2)); }
        }
        .brand-logo .icon { font-size: 32px; display: inline-block; }
        .brand-logo .text-group { display: flex; flex-direction: column; }
        .brand-logo .text-group .main { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
        .brand-logo .text-group .main span { color: #a29bfe; }
        .brand-logo .text-group .sub { font-size: 10px; color: var(--text-light); letter-spacing: 3px; text-transform: uppercase; margin-top: -2px; }

        .nav-actions { display: flex; gap: 15px; align-items: center; }
        .btn-toggle-admin {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-color);
            color: var(--text-light); padding: 8px 16px; border-radius: 30px;
            cursor: pointer; transition: var(--transition); font-size: 13px; font-weight: 600;
        }
        .btn-toggle-admin:hover { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 20px rgba(108, 92, 231, 0.3); }

        /* ============================================================
           MAIN CONTAINER
           ============================================================ */
        .container { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        /* ===== HERO SECTION ===== */
        .hero { text-align: center; padding: 40px 0 60px 0; position: relative; }
        .hero h1 { font-size: clamp(32px, 5vw, 54px); font-weight: 800; }
        .hero h1 span { color: #a29bfe; }
        .hero p { color: var(--text-light); font-size: 18px; margin-top: 15px; max-width: 600px; margin-left: auto; margin-right: auto; line-height: 1.6; }

        /* ============================================================
           ADMIN DASHBOARD (Hidden by default, shown with toggle)
           ============================================================ */
        .admin-panel {
            display: none; /* Hidden */
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 30px; margin-bottom: 50px;
            box-shadow: var(--shadow);
        }
        .admin-panel.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        
        .admin-panel h2 { margin-bottom: 20px; color: #fff; display: flex; align-items: center; gap: 10px; }
        .admin-panel h2 i { color: var(--primary); }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; color: var(--text-light); margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 14px; border-radius: 10px;
            background: rgba(255,255,255,0.04); border: 1px solid var(--border-color);
            color: #fff; font-size: 15px; outline: none; transition: var(--transition);
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); background: rgba(108, 92, 231, 0.05); }
        .form-group textarea { min-height: 180px; resize: vertical; }
        
        .btn-publish {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #6c5ce7, #a29bfe); color: #fff;
            font-size: 17px; font-weight: 700; cursor: pointer; transition: var(--transition);
        }
        .btn-publish:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(108, 92, 231, 0.4); }

        /* ============================================================
           POSTS GRID (Like IPTV Channel Grid)
           ============================================================ */
        .grid-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .grid-header h2 { font-size: 22px; font-weight: 700; }
        .grid-header h2 i { color: var(--primary); margin-left: 10px; }
        .grid-header .live-indicator { background: #e74c3c; padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: 1px; animation: pulseLive 1.5s infinite; }
        @keyframes pulseLive { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .posts-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px;
        }

        .post-card {
            background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: var(--radius); padding: 25px; cursor: pointer;
            transition: var(--transition); position: relative; overflow: hidden;
        }
        .post-card:hover {
            transform: translateY(-8px); border-color: var(--primary);
            box-shadow: 0 15px 40px rgba(108, 92, 231, 0.15);
        }
        .post-card .badge { position: absolute; top: 15px; left: 15px; background: #e74c3c; padding: 2px 12px; border-radius: 12px; font-size: 10px; font-weight: 700; animation: pulseLive 1.5s infinite; }
        
        .post-card .title { font-size: 20px; font-weight: 700; margin-bottom: 10px; line-height: 1.4; }
        .post-card .meta { font-size: 12px; color: var(--text-light); margin-bottom: 15px; display: flex; gap: 15px; }
        .post-card .excerpt { color: var(--text-light); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .post-card .read-more { display: inline-block; margin-top: 15px; color: var(--primary); font-weight: 600; font-size: 14px; }

        /* ============================================================
           MODAL (Article Viewer)
           ============================================================ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(10px);
            z-index: 9999; display: none; align-items: center; justify-content: center; padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        .modal-overlay.active { display: flex; }
        
        .modal-box {
            background: var(--bg-dark); border: 1px solid var(--border-color);
            border-radius: var(--radius); max-width: 800px; width: 100%;
            max-height: 90vh; overflow-y: auto; padding: 40px;
            position: relative; box-shadow: 0 30px 80px rgba(0,0,0,0.8);
        }
        .modal-box::-webkit-scrollbar { width: 4px; }
        .modal-box::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        .modal-close {
            position: sticky; top: 0; float: left; background: rgba(255, 50, 50, 0.1);
            border: 1px solid rgba(255, 50, 50, 0.2); border-radius: 50%; width: 40px; height: 40px;
            color: #e74c3c; font-size: 20px; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: #e74c3c; color: #fff; transform: rotate(90deg); }
        
        .modal-title { font-size: 30px; font-weight: 800; margin-bottom: 15px; margin-top: 10px; line-height: 1.3; }
        .modal-meta { color: var(--text-light); font-size: 14px; margin-bottom: 25px; display: block; }
        .modal-body { color: #d1d5db; line-height: 1.9; font-size: 17px; white-space: pre-wrap; }

        /* ============================================================
           FOOTER
           ============================================================ */
        footer {
            position: relative; z-index: 1; border-top: 1px solid var(--border-color);
            padding: 40px 20px; margin-top: 80px; text-align: center; background: rgba(11, 13, 23, 0.5);
        }
        footer .social-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        footer .social-links a { color: var(--text-light); font-size: 20px; transition: var(--transition); }
        footer .social-links a:hover { color: var(--primary); transform: translateY(-3px); }
        footer p { color: rgba(255,255,255,0.3); font-size: 13px; }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        .toast {
            position: fixed; bottom: 30px; right: 30px; background: #1e293b;
            border: 1px solid var(--border-color); padding: 12px 24px; border-radius: 12px;
            color: #fff; font-weight: 600; z-index: 10000; display: none;
            animation: slideUp 0.4s ease; box-shadow: var(--shadow);
        }
        .toast.show { display: block; }
        .toast.success { border-color: #10b981; background: rgba(16, 185, 129, 0.1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            header { padding: 12px 15px; flex-direction: column; gap: 10px; }
            .brand-logo .text-group .main { font-size: 20px; }
            .posts-grid { grid-template-columns: 1fr; }
            .modal-box { padding: 25px; }
            .modal-title { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- Background Stars -->
    <div id="stars-container"></div>

    <!-- Header -->
    <header>
        <a href="#" class="brand-logo" onclick="location.reload()">
            <span class="icon">🐭</span>
            <div class="text-group">
                <span class="main">MOUSE <span>AI</span></span>
                <span class="sub">Live Tech Hub</span>
            </div>
        </a>
        <div class="nav-actions">
            <button class="btn-toggle-admin" onclick="toggleAdmin()">
                <i class="fas fa-lock"></i> لوحة التحكم
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        
        <!-- Hero -->
        <div class="hero">
            <h1>🐭 مرحباً بك في <span>MOUSE AI</span></h1>
            <p>منصتك الاحترافية لمقالات التقنية، الذكاء الاصطناعي، وأحدث الأخبار الرقمية. ابقَ على اطلاع دائم.</p>
        </div>

        <!-- Admin Dashboard (Hidden) -->
        <div class="admin-panel" id="adminPanel">
            <h2><i class="fas fa-pen-fancy"></i> إنشاء مقال جديد</h2>
            <div class="form-group">
                <label>عنوان المقال</label>
                <input type="text" id="postTitle" placeholder="اكتب عنواناً جذاباً..." />
            </div>
            <div class="form-group">
                <label>محتوى المقال</label>
                <textarea id="postContent" placeholder="اكتب محتوى المقال هنا..."></textarea>
            </div>
            <button class="btn-publish" onclick="publishPost()"><i class="fas fa-rocket"></i> نشر المقال الآن</button>
        </div>

        <!-- Posts Grid -->
        <div class="grid-header">
            <h2><i class="fas fa-bolt"></i> أحدث المقالات الحية</h2>
            <span class="live-indicator">LIVE</span>
        </div>
        <div class="posts-grid" id="postsGrid">
            <!-- JS will inject content here -->
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="https://x.com/mouse0000000" target="_blank"><i class="fab fa-x-twitter"></i></a>
            <a href="#"><i class="fab fa-youtube"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>
        </div>
        <p>🐭 MOUSE AI • 2026 • جميع الحقوق محفوظة • مصمم ليكون احترافياً</p>
    </footer>

    <!-- Modal -->
    <div class="modal-overlay" id="postModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // 1. GENERATE STARS
        // ============================================================
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + 'vw';
            star.style.top = Math.random() * 100 + 'vh';
            star.style.setProperty('--duration', (Math.random() * 4 + 3) + 's');
            star.style.animationDelay = Math.random() * 10 + 's';
            starsContainer.appendChild(star);
        }

        // ============================================================
        // 2. DATA MANAGEMENT (Simulating a DB using LocalStorage)
        // ============================================================
        let posts = [];
        let currentPostId = null;

        function loadData() {
            const stored = localStorage.getItem('mouse_ai_pro_posts');
            if (stored) {
                posts = JSON.parse(stored);
            } else {
                // Default Post
                posts = [{
                    id: Date.now() + 1,
                    title: '🚀 الذكاء الاصطناعي: ثورة العصر الحديث',
                    content: 'الذكاء الاصطناعي أصبح يغير حياتنا اليومية. من السيارات ذاتية القيادة إلى المساعدين الصوتيين، هذه التقنية تقود العالم نحو مستقبل جديد. في هذا المقال سنتعرف على أساسياته وتطبيقاته العملية.',
                    date: new Date().toLocaleDateString('ar-SA')
                }];
                saveData();
            }
            renderPosts();
        }

        function saveData() {
            localStorage.setItem('mouse_ai_pro_posts', JSON.stringify(posts));
        }

        // ============================================================
        // 3. ADMIN FUNCTIONS (Publishing)
        // ============================================================
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('active');
            if(panel.classList.contains('active')) {
                panel.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function publishPost() {
            const titleInput = document.getElementById('postTitle');
            const contentInput = document.getElementById('postContent');
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (!title || !content) {
                showToast('⚠️ الرجاء ملء العنوان والمحتوى', 'error');
                return;
            }

            const newPost = {
                id: Date.now(),
                title: title,
                content: content,
                date: new Date().toLocaleDateString('ar-SA')
            };

            posts.unshift(newPost);
            saveData();
            renderPosts();

            titleInput.value = '';
            contentInput.value = '';
            document.getElementById('adminPanel').classList.remove('active');
            showToast('✅ تم نشر المقال بنجاح!', 'success');
        }

        // ============================================================
        // 4. RENDER POSTS (Professional Grid)
        // ============================================================
        function renderPosts() {
            const grid = document.getElementById('postsGrid');

            if (posts.length === 0) {
                grid.innerHTML = `
                    <div style="grid-column:1/-1; text-align:center; padding:80px 20px; color:rgba(255,255,255,0.3);">
                        <i class="fas fa-file-alt" style="font-size:70px; margin-bottom:20px;"></i>
                        <h3 style="color:#fff; font-weight:600;">لا توجد مقالات بعد</h3>
                        <p>قم بنشر مقالك الأول من لوحة التحكم.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = posts.map(post => {
                const excerpt = post.content.substring(0, 150) + (post.content.length > 150 ? '...' : '');
                // Determine if it's "New" (today)
                const isNew = new Date().toLocaleDateString('ar-SA') === post.date;
                
                return `
                    <div class="post-card" onclick="openPost(${post.id})">
                        ${isNew ? '<span class="badge">جديد 🔴</span>' : ''}
                        <div class="title">${post.title}</div>
                        <div class="meta">
                            <span><i class="far fa-calendar-alt"></i> ${post.date}</span>
                            <span><i class="far fa-eye"></i> المتابعة</span>
                        </div>
                        <div class="excerpt">${excerpt}</div>
                        <div class="read-more">اقرأ المزيد <i class="fas fa-arrow-left"></i></div>
                    </div>
                `;
            }).join('');
        }

        // ============================================================
        // 5. OPEN & CLOSE MODAL (Reading Full Article)
        // ============================================================
        function openPost(id) {
            const post = posts.find(p => p.id === id);
            if (!post) return;

            currentPostId = id;
            const modal = document.getElementById('postModal');
            const body = document.getElementById('modalBody');

            body.innerHTML = `
                <div class="modal-title">${post.title}</div>
                <span class="modal-meta">📅 ${post.date}</span>
                <div class="modal-body">${post.content}</div>
            `;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('postModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // Close modal via Escape key or clicking outside
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
        document.getElementById('postModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ============================================================
        // 6. TOAST SYSTEM
        // ============================================================
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            if (type === 'success') toast.classList.add('success');
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => toast.classList.remove('show'), 3500);
        }

        // ============================================================
        // 7. INIT
        // ============================================================
        loadData();

        console.log('🐭 MOUSE AI Professional Hub Loaded.');
        console.log('🔐 Click "لوحة التحكم" in the top right to write an article.');
    </script>
</body>
</html>
