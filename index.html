    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:radial-gradient(circle at 30% 10%,#05315c,#010612 75%);min-height:100vh;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#fff;position:relative;overflow-x:hidden;padding:20px}
        
        #stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
        .star{position:absolute;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff,0 0 15px #00cfff,0 0 30px #00cfff;animation:fall linear infinite}
        @keyframes fall{0%{transform:translateY(-100px) translateX(0);opacity:1}100%{transform:translate(-200px,110vh);opacity:0}}
        
        .container{position:relative;z-index:1;max-width:1200px;margin:0 auto}
        
        .header{display:flex;justify-content:space-between;align-items:center;padding:20px 0;border-bottom:1px solid rgba(0,191,255,0.2);margin-bottom:30px;flex-wrap:wrap;gap:15px}
        .logo{font-size:clamp(28px,5vw,48px);font-weight:900;color:transparent;background:linear-gradient(90deg,#fff,#bff8ff,#00d9ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;animation:water 5s linear infinite;filter:drop-shadow(0 0 15px #00cfff);user-select:none;cursor:pointer}
        @keyframes water{to{background-position:300% 0}}
        .header-actions{display:flex;gap:12px;flex-wrap:wrap}
        
        .btn{padding:10px 24px;border:2px solid rgba(0,191,255,0.4);background:rgba(255,255,255,0.05);color:#fff;border-radius:30px;cursor:pointer;font-size:15px;font-weight:600;transition:all .3s ease;backdrop-filter:blur(8px);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
        .btn:hover{background:#00bfff;border-color:#00bfff;color:#010612;box-shadow:0 0 30px rgba(0,191,255,0.3);transform:translateY(-2px)}
        .btn-warning{border-color:rgba(255,165,0,0.4)}.btn-warning:hover{background:#ff9900;border-color:#ff9900;color:#010612}
        .btn-live{background:rgba(255,0,0,0.15);border-color:#ff0000;color:#ff4444;animation:pulse-btn 2s ease-in-out infinite}
        .btn-live:hover{background:#ff0000;border-color:#ff0000;color:#fff}
        @keyframes pulse-btn{0%,100%{box-shadow:0 0 10px rgba(255,0,0,0.2)}50%{box-shadow:0 0 30px rgba(255,0,0,0.5)}}
        
        /* ===== LIVE STREAM ===== */
        .live-stream{background:rgba(255,255,255,0.03);border:2px solid rgba(255,0,0,0.3);border-radius:24px;padding:20px;margin-bottom:30px;backdrop-filter:blur(10px);transition:all .3s ease;position:relative}
        .live-stream:hover{border-color:rgba(255,0,0,0.6);box-shadow:0 0 50px rgba(255,0,0,0.1)}
        .live-badge{position:absolute;top:-12px;right:30px;background:#ff0000;color:#fff;padding:4px 20px;border-radius:30px;font-size:14px;font-weight:700;animation:pulse 1.5s ease-in-out infinite;display:flex;align-items:center;gap:8px;box-shadow:0 0 30px rgba(255,0,0,0.4)}
        .live-badge .dot{display:inline-block;width:10px;height:10px;background:#fff;border-radius:50%;animation:blink 1s ease-in-out infinite}
        @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
        .live-stream .video-wrapper{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:16px;background:rgba(0,0,0,0.5)}
        .live-stream .video-wrapper iframe{position:absolute;top:0;left:0;width:100%;height:100%;border-radius:16px;border:none}
        
        /* Share Buttons */
        .live-share{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px;justify-content:center;padding-top:15px;border-top:1px solid rgba(255,255,255,0.05)}
        .live-share .share-label{color:rgba(255,255,255,0.4);font-size:14px;display:flex;align-items:center;gap:8px}
        .share-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:20px;text-decoration:none;color:#fff;font-size:13px;font-weight:600;transition:all .3s ease;border:none;cursor:pointer}
        .share-btn:hover{transform:scale(1.05)}
        .share-btn.facebook{background:#1877f2}.share-btn.facebook:hover{background:#166fe5}
        .share-btn.twitter{background:#000}.share-btn.twitter:hover{background:#1a1a1a}
        .share-btn.whatsapp{background:#25d366}.share-btn.whatsapp:hover{background:#20b857}
        .share-btn.telegram{background:#0088cc}.share-btn.telegram:hover{background:#0077b3}
        .share-btn.copy{background:rgba(255,255,255,0.1)}.share-btn.copy:hover{background:rgba(255,255,255,0.2)}
        
        /* Twitter Share Preview */
        .twitter-preview{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:20px;margin-top:15px;text-align:center}
        .twitter-preview .preview-title{color:#00d9ff;font-size:16px;margin-bottom:8px}
        .twitter-preview .preview-desc{color:rgba(255,255,255,0.4);font-size:13px;margin-bottom:12px}
        .twitter-preview .preview-box{background:rgba(0,0,0,0.3);border-radius:12px;padding:15px;border:1px solid rgba(255,255,255,0.05);max-width:500px;margin:0 auto}
        .twitter-preview .preview-box .preview-video{background:rgba(255,0,0,0.1);border-radius:8px;padding:40px 20px;color:rgba(255,255,255,0.3);font-size:14px;border:1px dashed rgba(255,0,0,0.2)}
        .twitter-preview .preview-box .preview-video .live-icon{font-size:32px;display:block;margin-bottom:8px}
        
        /* Posts */
        .section-divider{display:flex;align-items:center;gap:15px;margin:30px 0 20px}
        .section-divider .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(0,191,255,0.3),transparent)}
        .section-divider h2{color:#00d9ff;font-size:20px;white-space:nowrap}
        
        .posts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:25px;margin-top:10px}
        .post-card{background:rgba(255,255,255,0.05);border:1px solid rgba(0,191,255,0.15);border-radius:20px;overflow:hidden;backdrop-filter:blur(8px);transition:all .3s ease;cursor:pointer}
        .post-card:hover{transform:translateY(-5px);border-color:rgba(0,191,255,0.4);box-shadow:0 10px 40px rgba(0,0,0,0.4)}
        .post-card .post-thumbnail{width:100%;height:200px;object-fit:cover}
        .post-card .post-content{padding:20px}
        .post-card .post-title{font-size:20px;font-weight:700;color:#fff;margin-bottom:10px;line-height:1.4}
        .post-card .post-excerpt{color:#aac8e0;font-size:15px;line-height:1.8;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
        .post-card .post-meta{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05);font-size:13px;color:rgba(255,255,255,0.4)}
        .post-card .post-tags{color:#00d9ff;font-size:12px}
        
        /* Modal */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(15px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
        .modal-overlay.active{display:flex;animation:fadeIn .3s ease}
        .modal-content{background:radial-gradient(circle at top,#05315c,#010612 70%);border:2px solid rgba(0,191,255,0.3);border-radius:24px;max-width:900px;width:100%;padding:40px;max-height:90vh;overflow-y:auto;position:relative}
        .modal-content .close-modal{position:sticky;top:0;float:left;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:28px;cursor:pointer;width:40px;height:40px;border-radius:50%;transition:all .3s ease;display:flex;align-items:center;justify-content:center}
        .modal-content .close-modal:hover{background:#ff3333;transform:rotate(90deg)}
        .modal-content .modal-title{font-size:28px;font-weight:700;margin:15px 0 10px;color:#00d9ff}
        .modal-content .modal-body{font-size:18px;line-height:2.2;color:#e8f4ff;white-space:pre-wrap}
        .modal-content .modal-media{width:100%;max-height:400px;object-fit:cover;border-radius:12px;margin:15px 0}
        
        /* Comments */
        .modal-comments{margin-top:25px;border-top:1px solid rgba(0,191,255,0.2);padding-top:20px}
        .modal-comments h3{color:#00d9ff;margin-bottom:15px}
        .modal-comments .comment-form textarea{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,191,255,0.2);border-radius:12px;color:#fff;resize:vertical;min-height:80px;font-family:inherit;margin-bottom:10px}
        .modal-comments .comment-form textarea:focus{outline:none;border-color:#00d9ff}
        .comment-item{background:rgba(255,255,255,0.05);border:1px solid rgba(0,191,255,0.1);border-radius:16px;padding:18px;margin-bottom:12px}
        .comment-item .comment-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:5px}
        .comment-item .comment-author{font-weight:700;color:#00d9ff}
        .comment-item .comment-date{font-size:12px;color:rgba(255,255,255,0.3)}
        .comment-item .comment-body{color:#e8f4ff;line-height:1.8}
        
        /* Admin */
        .admin-panel{display:none;background:rgba(255,255,255,0.03);border:1px solid rgba(0,191,255,0.2);border-radius:20px;padding:30px;margin-bottom:30px}
        .admin-panel.active{display:block;animation:fadeIn .3s ease}
        .admin-panel h2{color:#00d9ff;margin-bottom:20px}
        .admin-panel input,.admin-panel textarea,.admin-panel select{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(0,191,255,0.2);border-radius:12px;color:#fff;font-family:inherit;margin-bottom:12px}
        .admin-panel input:focus,.admin-panel textarea:focus,.admin-panel select:focus{outline:none;border-color:#00d9ff}
        .admin-panel .form-row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
        .admin-panel .form-row .full{grid-column:1/-1}
        
        .empty-state{text-align:center;padding:60px 20px;color:rgba(255,255,255,0.3);grid-column:1/-1}
        .footer{text-align:center;padding:30px 0 10px;border-top:1px solid rgba(0,191,255,0.1);margin-top:40px;color:rgba(255,255,255,0.2);font-size:14px}
        
        .toast{position:fixed;bottom:30px;right:30px;padding:15px 30px;background:rgba(0,191,255,0.2);border:1px solid #00bfff;border-radius:12px;backdrop-filter:blur(10px);color:#fff;font-weight:500;z-index:2000;animation:slideUp .5s ease;display:none}
        .toast.show{display:block}.toast.error{border-color:#ff4444;background:rgba(255,50,50,0.2)}.toast.success{border-color:#00ff66;background:rgba(0,255,100,0.2)}
        @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
        
        .x-icon-small{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#fff;border-radius:50%}
        .x-icon-small svg{width:14px;height:14px;fill:#010612}
        .admin-secret-link{position:fixed;bottom:10px;left:10px;opacity:0.03;font-size:10px;color:rgba(255,255,255,0.1);transition:all .3s ease;cursor:pointer;z-index:50;background:transparent;border:none;padding:4px 8px;border-radius:4px}
        .admin-secret-link:hover{opacity:0.5;background:rgba(255,255,255,0.05)}
        
        .post-count{color:rgba(255,255,255,0.3);font-size:14px}
        
        @media(max-width:768px){
            .header{flex-direction:column;align-items:stretch;text-align:center}
            .header-actions{justify-content:center}
            .posts-grid{grid-template-columns:1fr}
            .modal-content{padding:25px}
            .modal-content .modal-title{font-size:22px}
            .admin-panel .form-row{grid-template-columns:1fr}
            .live-stream{padding:12px}
            .live-badge{font-size:12px;padding:3px 14px;top:-10px;right:15px}
        }
        @media(max-width:480px){.btn{padding:8px 16px;font-size:13px}}
        ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:rgba(255,255,255,0.05)}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00bfff,#008cff);border-radius:10px}
    </style>
</head>
<body>

<div id="stars"></div>

<div class="container">
    <header class="header">

    <!-- ===== LIVE STREAM ===== -->

        </div>
        <div class="video-wrapper">

                src="https://www.facebook.com/plugins/video.php?height=314&href=https%3A%2F%2Fwww.facebook.com%2Feptv.dz%2Fvideos%2F1542336614253892%2F&show_text=true&width=560&t=0"

<button class="admin-secret-link" onclick="toggleAdmin()">⚙️</button>

<div class="toast" id="toast"></div>

<script>
// ========== STARS ==========
for (let i = 0; i < 150; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    const size = Math.random() * 3.5 + 1.5;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = (Math.random() * -1000) + 'px';
    star.style.animationDuration = (5 + Math.random() * 7) + 's';
    star.style.animationDelay = (Math.random() * 10) + 's';
    star.style.opacity = 0.4 + Math.random() * 0.6;
    document.getElementById('stars').appendChild(star);
}

// ========== TWITTER/X SHARE ==========
function shareOnX() {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent('🔴 شاهد البث المباشر الآن من @mouse0000000');
    const twitterUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
    window.open(twitterUrl, '_blank', 'width=600,height=500');
}

function shareLive(platform) {
    const url = encodeURIComponent(window.location.href);
    const text = encodeURIComponent('🔴 بث مباشر - MOUSE AI');
    const links = {
        facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
        whatsapp: `https://wa.me/?text=${text}%20${url}`,
        telegram: `https://t.me/share/url?url=${url}&text=${text}`
    };
    window.open(links[platform], '_blank', 'width=600,height=500');
}

function copyLiveLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('📋 تم نسخ رابط البث', 'success');
    }).catch(() => {
        showToast('⚠️ فشل النسخ', 'error');
    });
}

// ========== DATA ==========
let posts = [];
let comments = [];
let editingId = null;

function loadData() {
    try {
        const data = localStorage.getItem('mouse_blog_data');
        if (data) {
            const parsed = JSON.parse(data);
            posts = parsed.posts || [];
            comments = parsed.comments || [];
        } else {
            posts = [
                {
                    id: Date.now() - 100000,
                    title: '🎯 كيف تبدأ في عالم البرمجة؟',
                    body: 'البرمجة هي مهارة العصر... ابدأ بتعلم الأساسيات ثم اختر مساراً متخصصاً.',
                    tags: 'برمجة, تعلم, مبتدئين',
                    thumbnail: 'https://via.placeholder.com/600x400/05315c/00d9ff?text=Programming',
                    mediaType: 'none',
                    mediaUrl: '',
                    date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }),
                    views: 0
                },
                {
                    id: Date.now() - 50000,
                    title: '🤖 الذكاء الاصطناعي في 2026',
                    body: 'شهد العام 2026 طفرة هائلة في مجال الذكاء الاصطناعي...',
                    tags: 'ذكاء اصطناعي, AI, تقنية',
                    thumbnail: 'https://via.placeholder.com/600x400/05315c/00d9ff?text=AI+2026',
                    mediaType: 'none',
                    mediaUrl: '',
                    date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }),
                    views: 0
                }
            ];
            saveData();
        }
        posts.sort((a, b) => b.id - a.id);
        renderPosts();
        renderAdminPosts();
    } catch (error) { console.error(error); }
}

function saveData() {
    try {
        localStorage.setItem('mouse_blog_data', JSON.stringify({ posts, comments }));
        return true;
    } catch (error) { return false; }
}

function renderPosts() {
    const grid = document.getElementById('postsGrid');
    if (posts.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div style="font-size:64px;margin-bottom:20px;opacity:0.5;">📝</div><h3 style="color:rgba(255,255,255,0.5);">لا توجد مقالات بعد</h3></div>`;
        return;
    }
    grid.innerHTML = posts.map((post, index) => {
        const thumbnail = post.thumbnail || 'https://via.placeholder.com/600x400/05315c/00d9ff?text=MOUSE+AI';
        const tagsHtml = post.tags ? `<span class="post-tags">#${post.tags.split(',').map(t=>t.trim()).join(' #')}</span>` : '';
        const commentCount = comments.filter(c => c.postId === post.id && !c.parentId).length;
        return `
            <div class="post-card" onclick="viewPost(${index})">
                <img src="${thumbnail}" class="post-thumbnail" loading="lazy" alt="${post.title}" />
                <div class="post-content">
                    <div class="post-title">${post.title}</div>
                    <div class="post-excerpt">${post.body.substring(0,120)}${post.body.length>120?'...':''}</div>
                    ${tagsHtml}
                    <div class="post-meta"><span>📅 ${post.date}</span><span>💬 ${commentCount} 👁️ ${post.views||0}</span></div>
                </div>
            </div>
        `;
    }).join('');
}

function renderAdminPosts() {
    const list = document.getElementById('adminPostsList');
    if (posts.length === 0) {
        list.innerHTML = '<p style="color:rgba(255,255,255,0.3);">لا توجد مقالات مضافة بعد</p>';
        return;
    }
    list.innerHTML = posts.map((p, i) => `
        <div style="display:flex;justify-content:space-between;align-items:center;padding:10px;background:rgba(255,255,255,0.03);border-radius:10px;margin-bottom:8px;flex-wrap:wrap;gap:8px;">
            <span style="color:#fff;">${p.title}</span>
            <div style="display:flex;gap:8px;">
                <button class="btn" style="padding:4px 12px;font-size:12px;border-color:#ff9900;color:#ff9900;" onclick="editPost(${i})">✏️</button>
                <button class="btn" style="padding:4px 12px;font-size:12px;border-color:#ff4444;color:#ff4444;" onclick="deletePost(${i})">🗑️</button>
            </div>
        </div>
    `).join('');
}

function toggleAdmin() {
    document.getElementById('adminPanel').classList.toggle('active');
    if (document.getElementById('adminPanel').classList.contains('active')) {
        renderAdminPosts();
    }
}

function savePost(e) {
    e.preventDefault();
    const title = document.getElementById('postTitle').value.trim();
    const body = document.getElementById('postBody').value.trim();
    const tags = document.getElementById('postTags').value.trim();
    const thumbnail = document.getElementById('postThumbnail').value.trim();
    const mediaType = document.getElementById('postMediaType').value;
    const mediaUrl = document.getElementById('postMediaUrl').value.trim();
    
    if (!title || !body) {
        showToast('⚠️ الرجاء ملء العنوان والمحتوى', 'error');
        return;
    }
    
    if (editingId !== null) {
        const index = posts.findIndex(p => p.id === editingId);
        if (index !== -1) {
            posts[index] = { ...posts[index], title, body, tags, thumbnail, mediaType, mediaUrl };
            editingId = null;
            showToast('✅ تم تحديث المقال', 'success');
        }
    } else {
        posts.unshift({
            id: Date.now(),
            title,
            body,
            tags,
            thumbnail: thumbnail || 'https://via.placeholder.com/600x400/05315c/00d9ff?text=MOUSE+AI',
            mediaType,
            mediaUrl,
            date: new Date().toLocaleDateString('ar-SA', { year: 'numeric', month: 'long', day: 'numeric' }),
            views: 0
        });
        showToast('✅ تم إضافة المقال', 'success');
    }
    
    saveData();
    renderPosts();
    renderAdminPosts();
    clearForm();
}

function editPost(index) {
    const post = posts[index];
    editingId = post.id;
    document.getElementById('postTitle').value = post.title;
    document.getElementById('postBody').value = post.body;
    document.getElementById('postTags').value = post.tags || '';
    document.getElementById('postThumbnail').value = post.thumbnail || '';
    document.getElementById('postMediaType').value = post.mediaType || 'none';
    document.getElementById('postMediaUrl').value = post.mediaUrl || '';
    document.getElementById('adminPanel').classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function deletePost(index) {
    if (!confirm('هل أنت متأكد من حذف هذا المقال؟')) return;
    posts.splice(index, 1);
    saveData();
    renderPosts();
    renderAdminPosts();
    showToast('🗑️ تم حذف المقال', 'success');
}

function deleteAllPosts() {
    if (!confirm('⚠️ هل أنت متأكد من حذف جميع المقالات؟')) return;
    posts = [];
    comments = [];
    saveData();
    renderPosts();
    renderAdminPosts();
    showToast('🗑️ تم حذف جميع المقالات', 'error');
}

function clearForm() {
    document.getElementById('postTitle').value = '';
    document.getElementById('postBody').value = '';
    document.getElementById('postTags').value = '';
    document.getElementById('postThumbnail').value = '';
    document.getElementById('postMediaType').value = 'none';
    document.getElementById('postMediaUrl').value = '';
    editingId = null;
}

function viewPost(index) {
    const post = posts[index];
    if (!post) return;
    post.views = (post.views || 0) + 1;
    saveData();

    const modal = document.getElementById('postModal');
    const content = document.getElementById('modalContent');
    
    const mediaHtml = post.mediaType === 'image' && post.mediaUrl ? `<img src="${post.mediaUrl}" class="modal-media" />` :
                     post.mediaType === 'video' && post.mediaUrl ? `<video class="modal-media" controls autoplay><source src="${post.mediaUrl}" /></video>` : '';
    const tagsHtml = post.tags ? `<p style="color:#00d9ff;font-size:14px;">#${post.tags.split(',').map(t=>t.trim()).join(' #')}</p>` : '';
    const postComments = comments.filter(c => c.postId === post.id && !c.parentId);
    const shareUrl = encodeURIComponent(window.location.href);
    const shareText = encodeURIComponent(post.title);

    content.innerHTML = `
        ${mediaHtml}
        <div class="modal-title">${post.title}</div>
        <div style="color:rgba(255,255,255,0.3);font-size:14px;margin-bottom:15px;">📅 ${post.date} • 👁️ ${post.views||0} مشاهدة</div>
        ${tagsHtml}
        <div class="modal-body">${post.body}</div>
        
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin:20px 0;padding:15px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.05);">
            <span style="color:rgba(255,255,255,0.4);font-size:14px;display:flex;align-items:center;gap:8px;">📤 مشاركة:</span>
            <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" class="share-btn twitter">X</a>
            <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn facebook">فيسبوك</a>
            <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" class="share-btn whatsapp">واتساب</a>
            <a href="https://t.me/share/url?url=${shareUrl}&text=${shareText}" target="_blank" class="share-btn telegram">تلغرام</a>
            <button onclick="copyLink()" class="share-btn copy">📋 نسخ الرابط</button>
        </div>
        
        <div class="modal-comments">
            <h3>💬 التعليقات (${postComments.length})</h3>
            <div class="comment-form">
                <textarea id="commentText" placeholder="اكتب تعليقك..."></textarea>
                <button class="btn" style="border-color:#00bfff;color:#00d9ff;background:transparent;" onclick="submitComment(${index})">إرسال التعليق</button>
            </div>
            ${postComments.map(c => `
                <div class="comment-item">
                    <div class="comment-header"><span class="comment-author">${c.author}</span><span class="comment-date">${c.date}</span></div>
                    <div class="comment-body">${c.body}</div>
                </div>
            `).join('')}
        </div>
    `;
    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function copyLink() {
    navigator.clipboard.writeText(window.location.href).then(() => {
        showToast('📋 تم نسخ الرابط', 'success');
    }).catch(() => {
        showToast('⚠️ فشل النسخ', 'error');
    });
}

function submitComment(index) {
    const textarea = document.getElementById('commentText');
    const body = textarea.value.trim();
    if (!body) { showToast('⚠️ الرجاء كتابة التعليق', 'error'); return; }
    const post = posts[index];
    if (!post) return;
    comments.push({ 
        id: Date.now(), 
        postId: post.id, 
        parentId: null, 
        author: '👤 زائر', 
        body, 
        date: new Date().toLocaleDateString('ar-SA', { year:'numeric', month:'long', day:'numeric' }) 
    });
    saveData();
    textarea.value = '';
    showToast('✅ تم إرسال التعليق', 'success');
    setTimeout(()=>viewPost(index), 500);
}

function refreshPosts() {
    loadData();
    showToast('🔄 تم التحديث', 'success');
}

function closeModal(e) {
    if (e && e.target !== e.currentTarget) return;
    document.getElementById('postModal').classList.remove('active');
    document.body.style.overflow = 'auto';
}

function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'toast show';
    if (type === 'error') toast.classList.add('error');
    if (type === 'success') toast.classList.add('success');
    clearTimeout(toast.timeout);
    toast.timeout = setTimeout(() => toast.classList.remove('show'), 4000);
}

loadData();
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
console.log('🚀 البث المباشر جاهز للنشر على X!');
</script>
</body>
</html>
