<html lang="ar" dir="rtl">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at 30% 10%, #05315c, #010612 75%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== STARS BACKGROUND ===== */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 15px #00cfff, 0 0 30px #00cfff;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translate(-200px, 110vh);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* ===== HEADER WITH LOGO ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: clamp(28px, 4vw, 42px);
            font-weight: 900;
            color: transparent;
            background: linear-gradient(90deg, #fff, #bff8ff, #00d9ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: water 5s linear infinite;
            filter: drop-shadow(0 0 15px #00cfff);
            user-select: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo .tv-icon {
            font-size: clamp(30px, 4vw, 44px);
            animation: none;
            color: #00d9ff;
            background: none;
            -webkit-background-clip: unset;
            background-clip: unset;
            filter: drop-shadow(0 0 10px rgba(0, 191, 255, 0.3));
        }
        @keyframes water {
            to {
                background-position: 300% 0;
            }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #ff0000;
            color: #fff;
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 700;
            animation: pulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
        }
        .live-badge .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 18px;
            border: 2px solid rgba(0, 191, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all .3s ease;
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn:hover {
            background: #00bfff;
            border-color: #00bfff;
            color: #010612;
            transform: translateY(-2px);
        }
        .btn-refresh {
            border-color: rgba(255, 165, 0, 0.4);
        }
        .btn-refresh:hover {
            background: #ff9900;
            border-color: #ff9900;
            color: #010612;
        }
        .btn-twitter {
            border-color: rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
        }
        .btn-twitter:hover {
            background: #000;
            border-color: #fff;
        }

        .x-icon-small {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
        }
        .x-icon-small svg {
            width: 11px;
            height: 11px;
            fill: #010612;
        }

        /* ===== CATEGORIES ===== */
        .categories-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .category-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(0, 191, 255, 0.2);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            cursor: pointer;
            transition: all .3s ease;
        }
        .category-btn:hover {
            background: rgba(0, 191, 255, 0.1);
            color: #fff;
        }
        .category-btn.active {
            background: rgba(0, 191, 255, 0.15);
            border-color: #00d9ff;
            color: #00d9ff;
        }
        .category-btn .badge {
            font-size: 10px;
            background: rgba(255, 255, 255, 0.1);
            padding: 0 8px;
            border-radius: 10px;
            margin-right: 4px;
        }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
        }

        /* ===== VIDEO PLAYER ===== */
        .player-wrapper {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 191, 255, 0.15);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all .3s ease;
        }
        .player-wrapper:hover {
            border-color: rgba(0, 191, 255, 0.3);
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.05);
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }
        .video-container video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .video-container .channel-name-overlay {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            color: #00d9ff;
            border: 1px solid rgba(0, 191, 255, 0.2);
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        .video-container .channel-name-overlay .lang-tag {
            font-size: 11px;
            background: rgba(0, 191, 255, 0.15);
            padding: 0 10px;
            border-radius: 12px;
            margin-right: 8px;
            color: rgba(255, 255, 255, 0.6);
        }
        .video-container .live-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff0000;
            color: #fff;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            animation: pulse 1.5s ease-in-out infinite;
            z-index: 10;
        }
        .video-container .loading-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.75);
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            flex-direction: column;
            gap: 15px;
            z-index: 20;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== CHANNELS SIDEBAR ===== */
        .channels-sidebar {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 191, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(10px);
            max-height: 600px;
            display: flex;
            flex-direction: column;
        }
        .channels-sidebar .sidebar-title {
            color: #00d9ff;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .channels-sidebar .sidebar-title span {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
        }
        .channels-sidebar .sidebar-title .refresh-indicator {
            margin-right: auto;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }

        .channel-search {
            width: 100%;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 191, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            margin-bottom: 12px;
            outline: none;
            transition: all .3s ease;
        }
        .channel-search:focus {
            border-color: #00d9ff;
            background: rgba(255, 255, 255, 0.08);
        }
        .channel-search::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        .channels-list::-webkit-scrollbar {
            width: 4px;
        }
        .channels-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .channels-list::-webkit-scrollbar-thumb {
            background: rgba(0, 191, 255, 0.3);
            border-radius: 10px;
        }

        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            cursor: pointer;
            transition: all .3s ease;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }
        .channel-item:hover {
            background: rgba(0, 191, 255, 0.05);
            border-color: rgba(0, 191, 255, 0.1);
        }
        .channel-item.active {
            background: rgba(0, 191, 255, 0.1);
            border-color: rgba(0, 191, 255, 0.3);
        }
        .channel-item .channel-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(0, 191, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .channel-item .channel-name {
            font-size: 13px;
            color: #e8f4ff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .channel-item .channel-lang {
            font-size: 10px;
            padding: 0 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            flex-shrink: 0;
        }
        .channel-item .channel-status {
            margin-right: auto;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
        }
        .channel-item .channel-status.online {
            color: #00ff66;
        }

        .channel-count {
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        /* ===== SHARE SECTION ===== */
        .share-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            justify-content: center;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            transition: all .3s ease;
            border: none;
            cursor: pointer;
        }
        .share-btn:hover {
            transform: scale(1.05);
        }
        .share-btn.twitter {
            background: #000;
        }
        .share-btn.twitter:hover {
            background: #1a1a1a;
        }
        .share-btn.facebook {
            background: #1877f2;
        }
        .share-btn.facebook:hover {
            background: #166fe5;
        }
        .share-btn.whatsapp {
            background: #25d366;
        }
        .share-btn.whatsapp:hover {
            background: #20b857;
        }
        .share-btn.telegram {
            background: #0088cc;
        }
        .share-btn.telegram:hover {
            background: #0077b3;
        }
        .share-btn.copy {
            background: rgba(255, 255, 255, 0.1);
        }
        .share-btn.copy:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 25px 0 10px;
            border-top: 1px solid rgba(0, 191, 255, 0.1);
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 13px;
        }
        .footer .heart {
            color: #ff4444;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: rgba(0, 191, 255, 0.2);
            border: 1px solid #00bfff;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: #fff;
            font-weight: 500;
            z-index: 2000;
            animation: slideUp .5s ease;
            display: none;
            max-width: 400px;
        }
        .toast.show {
            display: block;
        }
        .toast.success {
            border-color: #00ff66;
            background: rgba(0, 255, 100, 0.2);
        }
        .toast.error {
            border-color: #ff4444;
            background: rgba(255, 50, 50, 0.2);
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .channels-sidebar {
                max-height: 350px;
            }
        }
        @media(max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }
            .header-right {
                justify-content: center;
            }
            .header-actions {
                justify-content: center;
            }
            .container {
                padding: 0 10px;
            }
            .player-wrapper {
                padding: 12px;
            }
            .channels-sidebar {
                max-height: 300px;
                padding: 15px;
            }
            .video-container .channel-name-overlay {
                font-size: 13px;
                padding: 5px 14px;
                bottom: 12px;
                left: 12px;
            }
            .categories-bar {
                justify-content: center;
            }
        }
        @media(max-width: 480px) {
            .btn {
                padding: 6px 14px;
                font-size: 12px;
            }
            .share-btn {
                padding: 6px 12px;
                font-size: 11px;
            }
            .live-badge {
                font-size: 12px;
                padding: 4px 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== STARS ===== -->
    <div id="stars"></div>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="logo">
                <span class="tv-icon">📺</span>
                MOUSE AI TV
            </div>
            <div class="header-right">
                <div class="live-badge">
                    <span class="dot"></span>
                    بث مباشر
                </div>
                <div class="header-actions">
                    <button class="btn btn-refresh" onclick="loadAllPlaylists()">
                        🔄 تحميل القنوات
                    </button>
                    <button class="btn btn-twitter" onclick="shareOnX()">
                        <span class="x-icon-small">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                            </svg>
                        </span>
                        مشاركة
                    </button>
                </div>
            </div>
        </header>

        <!-- ===== CATEGORIES ===== -->
        <div class="categories-bar" id="categoriesBar">
            <button class="category-btn active" data-category="all">🌟 الكل</button>
            <button class="category-btn" data-category="ar">🇸🇦 عربي</button>
            <button class="category-btn" data-category="fr">🇫🇷 Français</button>
            <button class="category-btn" data-category="gb">🇬🇧 British</button>
            <button class="category-btn" data-category="us">🇺🇸 American</button>
        </div>

        <!-- ===== MAIN LAYOUT ===== -->
        <div class="main-layout">

            <!-- ===== PLAYER ===== -->
            <div class="player-wrapper">
                <div class="video-container" id="videoContainer">
                    <video id="videoPlayer" controls autoplay playsinline></video>
                    <div class="channel-name-overlay" id="channelNameOverlay">
                        📺 اختر قناة
                    </div>
                    <div class="live-tag">🔴 LIVE</div>
                    <div class="loading-overlay" id="loadingOverlay">
                        <div class="spinner"></div>
                        <span id="loadingText">جاري تحميل البث...</span>
                    </div>
                </div>

                <!-- Share Buttons -->
                <div class="share-section">
                    <button onclick="shareOnX()" class="share-btn twitter">🐦 X</button>
                    <a href="#" onclick="shareLive('facebook')" class="share-btn facebook">فيسبوك</a>
                    <a href="#" onclick="shareLive('whatsapp')" class="share-btn whatsapp">واتساب</a>
                    <a href="#" onclick="shareLive('telegram')" class="share-btn telegram">تلغرام</a>
                    <button onclick="copyLink()" class="share-btn copy">📋 نسخ الرابط</button>
                </div>
            </div>

            <!-- ===== CHANNELS SIDEBAR ===== -->
            <div class="channels-sidebar">
                <div class="sidebar-title">
                    📡 القنوات
                    <span id="channelCount"></span>
                    <span class="refresh-indicator" id="refreshIndicator">🔄 جارٍ التحميل...</span>
                </div>
                <input type="text" class="channel-search" id="channelSearch" placeholder="🔍 ابحث عن قناة..." onkeyup="filterChannels()" />
                <div class="channels-list" id="channelsList">
                    <div style="text-align:center;padding:30px 0;color:rgba(255,255,255,0.3);">
                        <div class="spinner" style="margin:0 auto 15px;"></div>
                        جاري تحميل القنوات من الخوادم...
                    </div>
                </div>
                <div class="channel-count" id="channelCountFooter"></div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            <p>🐭 MOUSE AI TV • 2026 • جميع الحقوق محفوظة <span class="heart">❤</span></p>
        </div>
    </div>

    <!-- ===== TOAST ===== -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  STARS GENERATION
        // ============================================================
        for (let i = 0; i < 120; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = (Math.random() * -1000) + 'px';
            star.style.animationDuration = (5 + Math.random() * 8) + 's';
            star.style.animationDelay = (Math.random() * 12) + 's';
            star.style.opacity = 0.3 + Math.random() * 0.7;
            document.getElementById('stars').appendChild(star);
        }

        // ============================================================
        //  BACKUP CHANNELS (تعمل دائماً)
        // ============================================================
        const backupChannels = [
            // 🇸🇦 عربية

        // ============================================================
        //  GLOBALS
        // ============================================================
        let allChannels = [];
        let currentChannel = null;
        let currentCategory = 'all';
        let isLoading = false;

        const video = document.getElementById('videoPlayer');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const channelNameOverlay = document.getElementById('channelNameOverlay');
        let hls = null;

        const langMap = {
            'ar': '🇸🇦',
            'fr': '🇫🇷',
            'gb': '🇬🇧',
            'us': '🇺🇸'
        };
        const langNames = {
            'ar': 'عربي',
            'fr': 'Français',
            'gb': 'British',
            'us': 'American'
        };

        // ============================================================
        //  LOAD PLAYLISTS FROM URLs
        // ============================================================
        async function loadPlaylist(url, lang) {
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.text();
                const lines = data.split('\n');
                let channels = [];
                let currentName = '';

                for (let line of lines) {
                    line = line.trim();
                    if (line.startsWith('#EXTINF:')) {
                        const match = line.match(/,([^,]+)$/);
                        if (match) {
                            currentName = match[1].trim();
                        }
                    } else if (line && !line.startsWith('#') && currentName) {
                        if (line.startsWith('http://') || line.startsWith('https://')) {
                            channels.push({
                                name: currentName,
                                url: line,
                                lang: lang
                            });
                        }
                        currentName = '';
                    }
                }
                return channels;
            } catch (error) {
                console.warn(`⚠️ فشل تحميل قائمة ${lang}:`, error);
                return [];
            }
        }

        async function loadAllPlaylists() {
            if (isLoading) return;
            isLoading = true;

            const indicator = document.getElementById('refreshIndicator');
            const list = document.getElementById('channelsList');

            indicator.textContent = '⏳ جارٍ التحميل...';
            list.innerHTML = `
                <div style="text-align:center;padding:30px 0;color:rgba(255,255,255,0.3);">
                    <div class="spinner" style="margin:0 auto 15px;"></div>
                    جاري تحميل القنوات من الخوادم...
                </div>
            `;

            const playlists = [
                { url: 'https://iptv-org.github.io/iptv/countries/ar.m3u', lang: 'ar' },
                { url: 'https://iptv-org.github.io/iptv/countries/fr.m3u', lang: 'fr' },
                { url: 'https://iptv-org.github.io/iptv/countries/uk.m3u', lang: 'gb' },
                { url: 'https://iptv-org.github.io/iptv/countries/us.m3u', lang: 'us' }
            ];

            let allNewChannels = [];
            let loadedCount = 0;

            for (const p of playlists) {
                const result = await loadPlaylist(p.url, p.lang);
                if (result.length > 0) {
                    allNewChannels = allNewChannels.concat(result);
                    loadedCount++;
                    showToast(`✅ تم تحميل ${result.length} قناة (${langNames[p.lang]})`, 'success');
                } else {
                    showToast(`⚠️ فشل تحميل قائمة ${langNames[p.lang]}، استخدام البديل`, 'error');
                }
            }

            // إذا لم يتم تحميل أي قناة، استخدم الاحتياطي
            if (allNewChannels.length === 0) {
                allNewChannels = [...backupChannels];
                showToast(`📡 تم استخدام القائمة الاحتياطية (${backupChannels.length} قناة)`, 'success');
            }

            allChannels = allNewChannels;
            indicator.textContent = `✅ تم التحميل (${allChannels.length})`;
            renderChannels();

            // تشغيل أول قناة تلقائياً
            if (allChannels.length > 0 && !currentChannel) {
                loadChannel(allChannels[0]);
            }

            isLoading = false;
        }

        // ============================================================
        //  PLAYER
        // ============================================================
        function loadChannel(channel) {
            if (!channel || !channel.url) {
                showToast('⚠️ رابط القناة غير صالح', 'error');
                return;
            }

            currentChannel = channel;
            const langIcon = langMap[channel.lang] || '🌐';
            const langName = langNames[channel.lang] || '';
            channelNameOverlay.innerHTML = `📺 ${channel.name} <span class="lang-tag">${langIcon} ${langName}</span>`;
            loadingOverlay.style.display = 'flex';
            loadingText.textContent = 'جاري تحميل البث...';
            video.pause();

            if (hls) {
                hls.destroy();
                hls = null;
            }

            // دعم تشغيل HLS
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = channel.url;
                video.addEventListener('loadedmetadata', function handler() {
                    loadingOverlay.style.display = 'none';
                    video.play();
                    video.removeEventListener('loadedmetadata', handler);
                });
                video.addEventListener('error', function handler() {
                    loadingOverlay.style.display = 'none';
                    showToast('⚠️ فشل تشغيل البث', 'error');
                    video.removeEventListener('error', handler);
                });
            } else if (Hls.isSupported()) {
                hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                });
                hls.loadSource(channel.url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    loadingOverlay.style.display = 'none';
                    video.play();
                });
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        loadingOverlay.style.display = 'none';
                        showToast('⚠️ فشل تشغيل البث', 'error');
                    }
                });
            } else {
                loadingOverlay.style.display = 'none';
                showToast('⚠️ متصفحك لا يدعم البث المباشر', 'error');
            }

            // تحديث القائمة
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.channel-item').forEach(el => {
                if (el.dataset.index == allChannels.indexOf(channel)) {
                    el.classList.add('active');
                    el.scrollIntoView({ block: 'nearest' });
                }
            });
        }

        // ============================================================
        //  CATEGORIES
        // ============================================================
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                filterChannels();
            });
        });

        // ============================================================
        //  CHANNELS LIST
        // ============================================================
        function renderChannels(filter = '') {
            const list = document.getElementById('channelsList');
            let filtered = allChannels.filter(c => {
                const matchName = c.name.toLowerCase().includes(filter.toLowerCase());
                const matchCategory = currentCategory === 'all' || c.lang === currentCategory;
                return matchName && matchCategory;
            });

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div style="text-align:center;padding:30px 0;color:rgba(255,255,255,0.3);font-size:14px;">
                        🔍 لا توجد قنوات تطابق البحث
                        ${allChannels.length === 0 ? '<br><small>اضغط "تحميل القنوات" لجلب القوائم</small>' : ''}
                    </div>
                `;
                document.getElementById('channelCountFooter').textContent = '0 قناة';
                document.getElementById('channelCount').textContent = '(0)';
                return;
            }

            list.innerHTML = filtered.map((channel, index) => {
                const idx = allChannels.indexOf(channel);
                const isActive = currentChannel && currentChannel.name === channel.name;
                const langIcon = langMap[channel.lang] || '🌐';
                return `
                    <div class="channel-item ${isActive ? 'active' : ''}" data-index="${idx}" onclick="loadChannel(allChannels[${idx}])">
                        <div class="channel-icon">📺</div>
                        <span class="channel-name">${channel.name}</span>
                        <span class="channel-lang">${langIcon}</span>
                        <span class="channel-status online">● LIVE</span>
                    </div>
                `;
            }).join('');

            document.getElementById('channelCount').textContent = `(${filtered.length})`;
            document.getElementById('channelCountFooter').textContent = filtered.length + ' قناة';
        }

        function filterChannels() {
            const query = document.getElementById('channelSearch').value;
            renderChannels(query);
        }

        // ============================================================
        //  SHARE FUNCTIONS
        // ============================================================
        function shareOnX() {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent('📺 شاهد البث المباشر العالمي الآن من MOUSE AI TV - عربي • Français • English');
            window.open(`https://twitter.com/intent/tweet?text=${text}&url=${url}`, '_blank', 'width=600,height=500');
        }

        function shareLive(platform) {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent('📺 بث مباشر عالمي - MOUSE AI TV');
            const links = {
                facebook: `https://www.facebook.com/sharer/sharer.php?u=${url}`,
                whatsapp: `https://wa.me/?text=${text}%20${url}`,
                telegram: `https://t.me/share/url?url=${url}&text=${text}`
            };
            window.open(links[platform], '_blank', 'width=600,height=500');
        }

        function copyLink() {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast('📋 تم نسخ الرابط', 'success');
            }).catch(() => {
                showToast('⚠️ فشل النسخ', 'error');
            });
        }

        // ============================================================
        //  TOAST
        // ============================================================
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show';
            if (type === 'success') toast.classList.add('success');
            if (type === 'error') toast.classList.add('error');
            clearTimeout(toast.timeout);
            toast.timeout = setTimeout(() => toast.classList.remove('show'), 5000);
        }

        // ============================================================
        //  KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                // إغلاق أي شيء مفتوح
            }
            if (e.key === 'r' || e.key === 'R') {
                if (e.ctrlKey || e.metaKey) return;
                loadAllPlaylists();
            }
        });

        // ============================================================
        //  INIT
        // ============================================================
        // بدء التحميل التلقائي
        loadAllPlaylists();

        console.log('📺 MOUSE AI TV - البث المباشر العالمي جاهز!');
        console.log(`📡 سيتم تحميل القنوات من: عربية، فرنسية، بريطانية، أمريكية`);
        console.log(`🔄 في حالة الفشل، سيتم استخدام القائمة الاحتياطية (${backupChannels.length} قناة)`);
