        .item { padding: 5px 8px; border-bottom: 1px solid #1e242c; border-radius: 4px; margin: 1px 0; cursor: pointer; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }

        .x { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 3px 8px; background: #000; border: 2px solid #fff; border-radius: 16px; color: #fff; font-weight: bold; font-size: 10px; text-decoration: none; margin-top: 3px; transition: 0.2s; }
        .x:hover { background: #fff; color: #000; }
        .x svg { width: 12px; height: 12px; fill: currentColor; }
        .footer { text-align: center; color: #5a6470; font-size: 8px; padding: 2px 0; }
        .footer a { color: #00ff88; text-decoration: none; }
        .toast { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%) translateY(60px); background: #111; border: 2px solid #00ff88; border-radius: 8px; padding: 6px 16px; color: #fff; font-weight: bold; font-size: 12px; z-index: 999; opacity: 0; transition: 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.err { border-color: #ff2a2a; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal .box { background: #111; border: 2px solid #00ff88; border-radius: 10px; padding: 16px; max-width: 450px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .modal .box h2 { color: #00ff88; text-align: center; font-size: 18px; margin-bottom: 10px; }
        .modal .box input, .modal .box textarea { width: 100%; padding: 6px 10px; background: #0a0c0f; border: 2px solid #1e242c; border-radius: 6px; color: #fff; font-size: 12px; outline: none; margin-bottom: 6px; }
        .modal .box input:focus, .modal .box textarea:focus { border-color: #00ff88; }
        .modal .box textarea { min-height: 80px; font-family: monospace; font-size: 11px; }
        .modal .box label { color: #00ff88; font-weight: bold; font-size: 12px; display: block; margin-bottom: 3px; }
        .modal .box .btns { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
        .modal .box .btns .btn { min-width: 60px; padding: 6px 14px; font-size: 12px; }
        @media (max-width: 700px) { .main { flex-direction: column; } .channels { width: 100%; min-width: 0; max-height: 45vh; } }
    </style>

<script>
// ============================================================
// 🐭 MOUSE AI IPTV - مع حل HTTP 403 عبر Proxy
// ============================================================

(function() {
    'use strict';

    // ===== سيرفر شهار =====
    const SHAHAR = {
        name: '🐭 MOUSE AI IPTV - شهار',
        url: 'http://81.31.194.66:8080/get.php?username=pro4451769801014&password=f734a8f19cf5&type=m3u_plus&output=ts'
    };

    // ===== PROXY لحل 403 =====
    const PROXY = 'https://corsproxy.io/?';
    // proxies أخرى في حالة فشل الأولى
    const PROXIES = [
        'https://corsproxy.io/?',
        'https://api.allorigins.win/raw?url=',
        'https://cors-anywhere.herokuapp.com/'
    ];

    // ===== STATE =====
    let S = {
        channels: [],
        filtered: [],
        favs: new Set(),
        servers: {},
        vol: 100,
        idx: -1,
        playing: false,
        loading: false,
        favView: false,
        group: 'All',
        search: '',
        loaded: false,
        proxyIndex: 0
    };

    // ===== DOM =====
    const video = document.getElementById('video');
    const ph = document.getElementById('ph');
    const loader = document.getElementById('loader');
    const playBtn = document.getElementById('play');
    const stopBtn = document.getElementById('stop');
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');
    const muteBtn = document.getElementById('mute');
    const volSlider = document.getElementById('vol');
    const fsBtn = document.getElementById('fs');
    const info = document.getElementById('info');
    const serverSel = document.getElementById('server');
    const loadBtn = document.getElementById('load');
    const fileBtn = document.getElementById('file');
    const addBtn = document.getElementById('add');
    const prog = document.getElementById('prog');
    const fill = document.getElementById('fill');
    const status = document.getElementById('status');
    const groupSel = document.getElementById('group');
    const searchInput = document.getElementById('search');
    const list = document.getElementById('list');
    const count = document.getElementById('count');
    const favBtn = document.getElementById('fav');
    const settingsBtn = document.getElementById('settings');
    const progSlider = document.getElementById('progSlider');
    const toast = document.getElementById('toast');
    const modal = document.getElementById('modal');
    const modalBox = document.getElementById('modalBox');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    // ===== STORAGE =====
    function loadStorage() {
        try { let s = localStorage.getItem('m_settings'); if (s) S.vol = JSON.parse(s).vol || 100; } catch(e) {}
        try { let f = localStorage.getItem('m_favs'); if (f) S.favs = new Set(JSON.parse(f)); } catch(e) {}
        try {
            let sv = localStorage.getItem('m_servers');
            if (sv) { S.servers = JSON.parse(sv); }
            else { S.servers = {}; S.servers[SHAHAR.name] = SHAHAR.url; saveServers(); }
        } catch(e) { S.servers = {}; S.servers[SHAHAR.name] = SHAHAR.url; saveServers(); }
    }
    function saveVol() { try { localStorage.setItem('m_settings', JSON.stringify({vol: S.vol})); } catch(e) {} }
    function saveFavs() { try { localStorage.setItem('m_favs', JSON.stringify([...S.favs])); } catch(e) {} }
    function saveServers() { try { localStorage.setItem('m_servers', JSON.stringify(S.servers)); } catch(e) {} }

    // ===== TOAST =====
    let tTimer = null;
    function toastMsg(msg, err = false) {
        toast.textContent = msg;
        toast.className = 'toast' + (err ? ' err' : '');
        clearTimeout(tTimer);
        void toast.offsetWidth;
        toast.classList.add('show');
        tTimer = setTimeout(() => toast.classList.remove('show'), 3500);
    }

    // ===== PARSER =====
    function parseM3U(text) {
        let lines = text.split(/\r?\n/);
        let chs = [];
        let cur = {};
        for (let raw of lines) {
            let line = raw.trim();
            if (!line) continue;
            if (line.startsWith('#EXTINF:')) {
                let name = 'Unnamed';
                let m = line.match(/#EXTINF:[^,]*,\s*(.+?)\s*$/);
                if (m) name = m[1].trim();
                let logo = '';
                let lm = line.match(/tvg-logo="([^"]*)"/);
                if (lm) logo = lm[1];
                let group = 'General';
                let gm = line.match(/group-title="([^"]*)"/);
                if (gm) group = gm[1];
                cur = { name, logo, group, url: '' };
            } else if ((line.startsWith('http://') || line.startsWith('https://')) && cur && !cur.url) {
                cur.url = line;
                chs.push({ ...cur });
                cur = {};
            }
        }
        for (let line of lines) {
            let t = line.trim();
            if ((t.startsWith('http://') || t.startsWith('https://')) && !chs.some(c => c.url === t)) {
                chs.push({ name: 'قناة ' + (chs.length + 1), url: t, group: 'General', logo: '' });
            }
        }
        return chs;
    }

    // ===== LOAD =====
    function loadChannels(src) {
        if (S.loading) return;
        let url = src || serverSel.value;
        if (!url || url === '-- لا يوجد --') { toastMsg('❌ لا يوجد سيرفر', true); return; }
        if (S.servers[url]) url = S.servers[url];
        if (!url.startsWith('http')) { toastMsg('❌ رابط غير صالح', true); return; }

        S.channels = [];
        S.filtered = [];
        S.idx = -1;
        S.loaded = false;
        video.pause();
        video.src = '';
        ph.style.display = 'block';
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');

        S.loading = true;
        loadBtn.disabled = true;
        loadBtn.textContent = '⏳...';
        prog.classList.add('active');
        fill.style.width = '0%';
        status.textContent = '🔄 جاري الاتصال...';
        status.className = 'status';
        loader.classList.add('active');
        S.proxyIndex = 0;

        // استخدام الوكيل لحل 403
        loadWithProxy(url);
    }

    function loadWithProxy(url) {
        let proxyUrl = PROXIES[S.proxyIndex] + encodeURIComponent(url);
        status.textContent = '🔄 عبر Proxy ' + (S.proxyIndex + 1) + '...';
        
        fetch(proxyUrl, {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Accept': '*/*'
            }
        })
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            fill.style.width = '40%';
            status.textContent = '📥 جاري القراءة...';
            return res.text();
        })
        .then(text => {
            fill.style.width = '60%';
            status.textContent = '🔍 جاري التحليل...';
            if (!text || text.length < 10) throw new Error('استجابة فارغة');
            // Check if we got HTML or error
            if (text.includes('<!DOCTYPE') || text.includes('<html')) {
                throw new Error('تم استقبال HTML - قد يكون الوكيل محظور');
            }
            // Check for error message
            if (text.includes('error') || text.includes('Error') || text.includes('blocked')) {
                throw new Error('الوكيل محظور');
            }
            let chs = parseM3U(text);
            fill.style.width = '90%';
            if (chs.length === 0) throw new Error('لا توجد قنوات');
            onLoaded(chs);
        })
        .catch(err => {
            S.proxyIndex++;
            if (S.proxyIndex < PROXIES.length) {
                status.textContent = '🔄 تغيير الوكيل...';
                toastMsg('🔄 تغيير الوكيل...');
                loadWithProxy(url);
            } else {
                // جرب بدون وكيل كحل أخير
                loadDirect(url);
            }
        });
    }

    function loadDirect(url) {
        status.textContent = '🔄 محاولة مباشرة...';
        fetch(url, {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
                'Accept': '*/*'
            }
        })
        .then(res => {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.text();
        })
        .then(text => {
            let chs = parseM3U(text);
            if (chs.length === 0) throw new Error('لا توجد قنوات');
            onLoaded(chs);
            toastMsg('✅ تم التحميل مباشرة');
        })
        .catch(err => {
            S.loading = false;
            loadBtn.disabled = false;
            loadBtn.textContent = '📡 تحميل';
            prog.classList.remove('active');
            loader.classList.remove('active');
            let msg = err.message;
            if (msg.includes('403')) msg = '⛔ ممنوع (403) - جرب سيرفر آخر';
            else if (msg.includes('Failed to fetch')) msg = '🌐 خطأ في الشبكة';
            status.textContent = '❌ ' + msg;
            status.className = 'status err';
            toastMsg('❌ ' + msg, true);
            console.error(err);
        });
    }

    function onLoaded(chs) {
        S.channels = chs;
        S.filtered = [...chs];
        S.idx = -1;
        S.loaded = true;
        S.loading = false;
        loadBtn.disabled = false;
        loadBtn.textContent = '📡 تحميل';
        prog.classList.remove('active');
        fill.style.width = '100%';
        loader.classList.remove('active');

        let groups = new Set();
        for (let ch of chs) if (ch.group) groups.add(ch.group);
        groupSel.innerHTML = '<option value="All">📂 الكل</option>';
        for (let g of [...groups].sort()) {
            let opt = document.createElement('option');
            opt.value = g;
            opt.textContent = g;
            groupSel.appendChild(opt);
        }
        S.group = 'All';
        groupSel.value = 'All';

        render();
        status.textContent = '✅ تم التحميل: ' + chs.length + ' قناة';
        status.className = 'status ok';
        count.textContent = chs.length + ' قناة';
        toastMsg('✅ تم تحميل ' + chs.length + ' قناة');

        if (chs.length > 0) {
            setTimeout(() => {
                let first = list.querySelector('.item');
                if (first) first.click();
            }, 500);
        }
    }

    // ===== RENDER =====
    function render() {
        let search = S.search.toLowerCase().trim();
        let group = S.group;
        let favOnly = S.favView;

        let filtered = S.channels;
        if (group !== 'All') filtered = filtered.filter(c => (c.group || 'General') === group);
        if (search) filtered = filtered.filter(c => (c.name || '').toLowerCase().includes(search));
        if (favOnly) filtered = filtered.filter(c => S.favs.has(c.url));
        S.filtered = filtered;

        list.innerHTML = '';
        if (filtered.length === 0) {
            list.innerHTML = '<div style="text-align:center;padding:20px;color:#5a6470;font-size:13px;">📺 لا توجد قنوات</div>';
            count.textContent = '0 قناة';
            return;
        }

        for (let i = 0; i < filtered.length; i++) {
            let ch = filtered[i];
            let div = document.createElement('div');
            div.className = 'item' + (i === S.idx ? ' active' : '');
            let fav = S.favs.has(ch.url);
            div.innerHTML = `
                <span>${fav ? '⭐ ' : ''}${ch.name || 'Unnamed'}</span>
                ${ch.group ? `<span class="tag">${ch.group}</span>` : ''}
            `;
            div.dataset.index = i;
            div.addEventListener('click', () => playChannel(i));
            list.appendChild(div);
        }
        count.textContent = filtered.length + ' قناة';
    }

    // ===== PLAY =====
    function playChannel(idx) {
        let ch = S.filtered[idx];
        if (!ch || !ch.url) { toastMsg('❌ لا يوجد رابط', true); return; }

        S.idx = idx;
        S.loaded = true;
        S.playing = true;

        document.querySelectorAll('.item').forEach((el, i) => {
            el.classList.toggle('active', i === idx);
        });

        ph.style.display = 'none';
        loader.classList.add('active');

        video.src = ch.url;
        video.load();
        let p = video.play();
        if (p !== undefined) {
            p.then(() => {
                loader.classList.remove('active');
                S.playing = true;
                playBtn.textContent = '⏸';
                playBtn.classList.add('playing');
                info.textContent = '▶️ ' + ch.name;
                info.className = 'info active';
                status.textContent = '▶️ ' + ch.name;
                status.className = 'status ok';
            }).catch(err => {
                loader.classList.remove('active');
                console.warn(err);
                toastMsg('❌ لا يمكن تشغيل هذه القناة', true);
                // Try with proxy
                let proxy = 'https://corsproxy.io/?' + encodeURIComponent(ch.url);
                video.src = proxy;
                video.load();
                video.play().catch(() => {});
            });
        }

        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        info.textContent = '▶️ ' + ch.name;
        info.className = 'info active';
    }

    // ===== CONTROLS =====
    function togglePlay() {
        if (!S.loaded) {
            let first = list.querySelector('.item');
            if (first) first.click();
            return;
        }
        if (video.paused) {
            video.play().catch(() => {});
            S.playing = true;
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing');
        } else {
            video.pause();
            S.playing = false;
            playBtn.textContent = '▶';
            playBtn.classList.remove('playing');
        }
    }

    function stopPlay() {
        video.pause();
        video.currentTime = 0;
        S.playing = false;
        S.loaded = false;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        info.textContent = '⏹️ تم الإيقاف';
        info.className = 'info';
        ph.style.display = 'block';
        video.src = '';
        progSlider.value = 0;
    }

    function nextCh() {
        if (S.filtered.length === 0) return;
        let n = (S.idx + 1) % S.filtered.length;
        playChannel(n);
        scrollTo(n);
    }

    function prevCh() {
        if (S.filtered.length === 0) return;
        let n = S.idx <= 0 ? S.filtered.length - 1 : S.idx - 1;
        playChannel(n);
        scrollTo(n);
    }

    function scrollTo(idx) {
        let items = list.querySelectorAll('.item');
        if (items[idx]) items[idx].scrollIntoView({ block: 'nearest' });
    }

    function toggleMute() {
        video.muted = !video.muted;
        muteBtn.textContent = video.muted ? '🔇' : '🔊';
    }

    function setVol(v) {
        let val = parseInt(v);
        video.volume = Math.min(val / 200, 1);
        S.vol = val;
        saveVol();
        if (val === 0) muteBtn.textContent = '🔇';
        else if (val < 50) muteBtn.textContent = '🔉';
        else if (val < 100) muteBtn.textContent = '🔊';
        else muteBtn.textContent = '🔊';
    }

    function toggleFS() {
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else document.documentElement.requestFullscreen().catch(() => {});
    }

    function toggleFavView() {
        S.favView = !S.favView;
        favBtn.classList.toggle('fav-on');
        favBtn.textContent = S.favView ? '⭐ مفضلة (نشط)' : '⭐ المفضلة';
        render();
    }

    function toggleFav(idx) {
        let ch = S.filtered[idx];
        if (!ch) return;
        if (S.favs.has(ch.url)) {
            S.favs.delete(ch.url);
            toastMsg('⭐ تم الإزالة');
        } else {
            S.favs.add(ch.url);
            toastMsg('⭐ تم الإضافة');
        }
        saveFavs();
        render();
        let items = list.querySelectorAll('.item');
        if (items[S.idx]) items[S.idx].classList.add('active');
    }

    // ===== MODAL =====
    function openModal(title, html) {
        modalTitle.textContent = title;
        modalBody.innerHTML = html;
        modal.classList.add('show');
    }

    function closeModal() {
        modal.classList.remove('show');
    }

    function openAddServer() {
        openModal('➕ إضافة سيرفر', `
            <label>🏷️ اسم السيرفر</label>
            <input type="text" id="nsName" placeholder="اسم السيرفر" value="🐭 MOUSE AI - جديد">
            <label>🔗 رابط السيرفر</label>
            <input type="text" id="nsUrl" placeholder="http://..." value="http://">
            <div class="btns">
                <button class="btn" onclick="closeModal()">إلغاء</button>
                <button class="btn g" id="nsSave">💾 حفظ</button>
            </div>
        `);
        document.getElementById('nsSave').addEventListener('click', () => {
            let name = document.getElementById('nsName').value.trim();
            let url = document.getElementById('nsUrl').value.trim();
            if (!name || !url) { toastMsg('❌ أدخل الاسم والرابط', true); return; }
            if (!url.startsWith('http')) { toastMsg('❌ رابط غير صالح', true); return; }
            S.servers[name] = url;
            saveServers();
            refreshServers();
            serverSel.value = name;
            toastMsg('✅ تم الإضافة: ' + name);
            closeModal();
            setTimeout(() => loadChannels(name), 300);
        });
    }

    function openSettings() {
        openModal('⚙️ الإعدادات', `
            <label>🔊 مستوى الصوت</label>
            <input type="range" id="volSet" min="0" max="200" value="${S.vol || 100}" style="width:100%;">
            <span id="volDisp" style="color:#00ff88;font-weight:bold;">${S.vol || 100}%</span>
            <div class="btns">
                <button class="btn" onclick="closeModal()">إلغاء</button>
                <button class="btn g" id="saveSet">💾 حفظ</button>
            </div>
        `);
        let vs = document.getElementById('volSet');
        let vd = document.getElementById('volDisp');
        vs.addEventListener('input', () => { vd.textContent = vs.value + '%'; });
        document.getElementById('saveSet').addEventListener('click', () => {
            let v = parseInt(document.getElementById('volSet').value);
            setVol(v);
            toastMsg('✅ تم الحفظ');
            closeModal();
        });
    }

    function openManage() {
        let names = Object.keys(S.servers);
        let html = `<div style="margin-bottom:6px;color:#8b95a5;font-size:12px;">${names.length} سيرفر(ات)</div>`;
        for (let name of names) {
            let url = S.servers[name];
            html += `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:#0a0c0f;border-radius:4px;margin-bottom:3px;border:1px solid #1e242c;">
                    <div style="flex:1;overflow:hidden;">
                        <div style="color:#00ff88;font-weight:bold;font-size:12px;">${name}</div>
                        <div style="font-size:9px;color:#5a6470;word-break:break-all;">${url.substring(0, 40)}...</div>
                    </div>
                    <button class="btn" style="border-color:#ff2a2a;color:#ff2a2a;padding:2px 8px;font-size:10px;" data-name="${name}">🗑️</button>
                </div>
            `;
        }
        html += `<div class="btns"><button class="btn" onclick="closeModal()">إغلاق</button></div>`;
        openModal('📡 إدارة السيرفرات', html);
        modalBody.querySelectorAll('[data-name]').forEach(btn => {
            btn.addEventListener('click', () => {
                let name = btn.dataset.name;
                if (confirm('حذف "' + name + '"؟')) {
                    delete S.servers[name];
                    saveServers();
                    refreshServers();
                    toastMsg('🗑️ تم الحذف: ' + name);
                    openManage();
                }
            });
        });
    }

    // ===== REFRESH =====
    function refreshServers() {
        let cur = serverSel.value;
        serverSel.innerHTML = '';
        let names = Object.keys(S.servers);
        if (names.length === 0) {
            let opt = document.createElement('option');
            opt.value = '';
            opt.textContent = '-- لا يوجد --';
            serverSel.appendChild(opt);
        } else {
            for (let name of names) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = name;
                serverSel.appendChild(opt);
            }
        }
        if (cur && [...serverSel.options].some(o => o.value === cur)) {
            serverSel.value = cur;
        }
    }

    // ===== FILE =====
    function loadFile() {
        let input = document.createElement('input');
        input.type = 'file';
        input.accept = '.m3u,.m3u8';
        input.onchange = () => {
            let file = input.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = (e) => {
                try {
                    let text = e.target.result;
                    let chs = parseM3U(text);
                    if (chs.length === 0) throw new Error('لا توجد قنوات');
                    S.channels = chs;
                    S.filtered = [...chs];
                    S.idx = -1;
                    S.loaded = true;
                    render();
                    let groups = new Set();
                    for (let ch of chs) if (ch.group) groups.add(ch.group);
                    groupSel.innerHTML = '<option value="All">📂 الكل</option>';
                    for (let g of [...groups].sort()) {
                        let opt = document.createElement('option');
                        opt.value = g;
                        opt.textContent = g;
                        groupSel.appendChild(opt);
                    }
                    S.group = 'All';
                    groupSel.value = 'All';
                    status.textContent = '✅ تم التحميل: ' + chs.length + ' قناة';
                    status.className = 'status ok';
                    count.textContent = chs.length + ' قناة';
                    toastMsg('✅ تم تحميل ' + chs.length + ' قناة');
                } catch(err) {
                    toastMsg('❌ ' + err.message, true);
                }
            };
            reader.readAsText(file);
        };
        input.click();
    }

    // ===== VIDEO EVENTS =====
    video.addEventListener('timeupdate', () => {
        if (video.duration) {
            progSlider.value = Math.min((video.currentTime / video.duration) * 1000, 1000);
        }
    });

    video.addEventListener('play', () => {
        S.playing = true;
        playBtn.textContent = '⏸';
        playBtn.classList.add('playing');
        ph.style.display = 'none';
        loader.classList.remove('active');
    });

    video.addEventListener('pause', () => {
        S.playing = false;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
    });

    video.addEventListener('ended', () => {
        S.playing = false;
        playBtn.textContent = '▶';
        playBtn.classList.remove('playing');
        nextCh();
    });

    video.addEventListener('error', () => {
        loader.classList.remove('active');
        toastMsg('⚠️ مشكلة في التشغيل', true);
    });

    progSlider.addEventListener('input', (e) => {
        if (video.duration) {
            video.currentTime = (e.target.value / 1000) * video.duration;
        }
    });

    // ===== KEYBOARD =====
    document.addEventListener('keydown', (e) => {
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
        switch(e.key) {
            case ' ': e.preventDefault(); togglePlay(); break;
            case 's': case 'S': stopPlay(); break;
            case 'ArrowRight': nextCh(); break;
            case 'ArrowLeft': prevCh(); break;
            case 'ArrowUp': volSlider.value = Math.min(parseInt(volSlider.value) + 10, 200); setVol(volSlider.value); break;
            case 'ArrowDown': volSlider.value = Math.max(parseInt(volSlider.value) - 10, 0); setVol(volSlider.value); break;
            case 'm': case 'M': toggleMute(); break;
            case 'f': case 'F': toggleFS(); break;
            case 'Escape': if (modal.classList.contains('show')) closeModal(); break;
        }
    });

    // ===== EVENTS =====
    loadBtn.addEventListener('click', () => {
        let sel = serverSel.value;
        if (!sel || sel === '-- لا يوجد --') { toastMsg('❌ لا يوجد سيرفر', true); return; }
        loadChannels(sel);
    });

    fileBtn.addEventListener('click', loadFile);
    addBtn.addEventListener('click', openAddServer);
    settingsBtn.addEventListener('click', openSettings);

    let mgr = document.createElement('button');
    mgr.className = 'btn full';
    mgr.textContent = '⚙️ إدارة السيرفرات';
    mgr.style.marginTop = '3px';
    mgr.addEventListener('click', openManage);
    document.querySelector('.row').appendChild(mgr);

    playBtn.addEventListener('click', togglePlay);
    stopBtn.addEventListener('click', stopPlay);
    prevBtn.addEventListener('click', prevCh);
    nextBtn.addEventListener('click', nextCh);
    muteBtn.addEventListener('click', toggleMute);
    fsBtn.addEventListener('click', toggleFS);
    volSlider.addEventListener('input', (e) => setVol(e.target.value));
    favBtn.addEventListener('click', toggleFavView);

    searchInput.addEventListener('input', (e) => {
        S.search = e.target.value;
        render();
    });

    groupSel.addEventListener('change', (e) => {
        S.group = e.target.value;
        render();
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) closeModal();
    });

    // Context menu
    list.addEventListener('contextmenu', (e) => {
        let item = e.target.closest('.item');
        if (!item) return;
        let idx = parseInt(item.dataset.index);
        let ch = S.filtered[idx];
        if (!ch) return;
        e.preventDefault();
        let fav = S.favs.has(ch.url);
        let menu = [
            { label: '▶ تشغيل', action: () => playChannel(idx) },
            { label: fav ? '⭐ إزالة مفضلة' : '⭐ إضافة مفضلة', action: () => toggleFav(idx) },
            { label: '📋 نسخ الرابط', action: () => { navigator.clipboard.writeText(ch.url).then(() => toastMsg('📋 تم النسخ')); } }
        ];
        let html = menu.map((m, i) =>
            `<div class="btn" style="width:100%;text-align:right;padding:3px 8px;margin:2px 0;border-radius:4px;border:1px solid #1e242c;cursor:pointer;" data-act="${i}">${m.label}</div>`
        ).join('');
        html += `<div class="btns"><button class="btn" onclick="closeModal()">إغلاق</button></div>`;
        openModal('📺 ' + ch.name, html);
        modalBody.querySelectorAll('[data-act]').forEach((b, i) => {
            b.addEventListener('click', () => { menu[i].action(); closeModal(); });
        });
    });

    // ===== DRAG & DROP =====
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
        e.preventDefault();
        let files = e.dataTransfer.files;
        if (files.length > 0 && files[0].name.match(/\.m3u8?$/i)) {
            let reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    let text = ev.target.result;
                    let chs = parseM3U(text);
                    if (chs.length === 0) throw new Error('لا توجد قنوات');
                    S.channels = chs;
                    S.filtered = [...chs];
                    S.idx = -1;
                    S.loaded = true;
                    render();
                    let groups = new Set();
                    for (let ch of chs) if (ch.group) groups.add(ch.group);
                    groupSel.innerHTML = '<option value="All">📂 الكل</option>';
                    for (let g of [...groups].sort()) {
                        let opt = document.createElement('option');
                        opt.value = g;
                        opt.textContent = g;
                        groupSel.appendChild(opt);
                    }
                    S.group = 'All';
                    groupSel.value = 'All';
                    status.textContent = '✅ تم التحميل: ' + chs.length + ' قناة';
                    status.className = 'status ok';
                    count.textContent = chs.length + ' قناة';
                    toastMsg('✅ تم تحميل ' + chs.length + ' قناة');
                } catch(err) {
                    toastMsg('❌ ' + err.message, true);
                }
            };
            reader.readAsText(files[0]);
            toastMsg('📁 جاري التحميل...');
        }
    });

    // ===== MAKE GLOBAL =====
    window.closeModal = closeModal;
    window.toastMsg = toastMsg;

    // ===== INIT =====
    function init() {
        loadStorage();
        refreshServers();
        setVol(S.vol || 100);

        let mouse = Object.keys(S.servers).find(k => k.includes('MOUSE AI'));
        if (mouse) serverSel.value = mouse;
        else { let first = Object.keys(S.servers)[0]; if (first) serverSel.value = first; }

        let sel = serverSel.value;
        if (sel && sel !== '-- لا يوجد --') {
            setTimeout(() => loadChannels(sel), 700);
        }

        console.log('🐭 MOUSE AI IPTV جاهز - مع Proxy لحل 403');
    }

    document.addEventListener('DOMContentLoaded', init);

})();
</script>

</body>
</html>
