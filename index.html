<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐭м𝓞𝓊ŜⒺ AI - المنصة الذكية المجانية للتوليد</title>
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 45px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 48px;
            font-weight: 800;
            display: inline-block;
            background: linear-gradient(90deg, #00d4ff, #0077ff, #a855f7, #00d4ff);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease-in-out infinite, float 3s ease-in-out infinite;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(0, 212, 255, 0.15);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }
        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        
        /* ===== TABS (Strategy Switcher) ===== */
        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.02);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 12px;
            color: #777;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
            box-shadow: 0 4px 20px rgba(0, 212, 255, 0.1);
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #aaa;
            margin-bottom: 8px;
        }
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            resize: vertical;
            font-family: inherit;
            min-height: 80px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        .form-group textarea:focus {
            outline: none;
            border-color: rgba(0, 212, 255, 0.3);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.05), inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        /* ===== OPTIONS ===== */
        .options-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding: 16px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .option-group {
            flex: 1;
            min-width: 130px;
        }
        .option-group .option-label {
            display: block;
            font-size: 13px;
            color: #888;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .option-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .opt-btn {
            padding: 6px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            color: #777;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            font-family: inherit;
        }
        .opt-btn:hover {
            border-color: rgba(255, 255, 255, 0.15);
            color: #ccc;
        }
        .opt-btn.active {
            background: rgba(0, 212, 255, 0.08);
            border-color: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
        }
        .opt-btn .sub {
            font-size: 10px;
            opacity: 0.5;
            display: block;
            font-weight: 400;
        }

        /* ===== GENERATE BUTTON ===== */
        .generate-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 119, 255, 0.12));
            border: 1px solid rgba(0, 212, 255, 0.15);
            border-radius: 18px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-family: inherit;
            margin-top: 8px;
        }
        .generate-btn:hover {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(0, 119, 255, 0.2));
            border-color: rgba(0, 212, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.1);
        }
        .generate-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .generate-btn.loading .spinner { display: block; }
        .generate-btn.loading .btn-text { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ===== RESULT DISPLAY ===== */
        .result-wrapper {
            margin-top: 24px;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: none;
        }
        .result-wrapper.show {
            display: block;
            animation: fadeSlide 0.5s ease-out;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-wrapper img, .result-wrapper video {
            width: 100%;
            display: block;
            border-radius: 18px 18px 0 0;
            max-height: 500px;
            object-fit: contain;
            background: #000;
        }
        .result-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .result-label {
            font-size: 13px;
            color: #00d4ff;
            font-weight: 600;
        }
        .result-label span { opacity: 0.5; color: #888; font-weight: 400; }
        .download-btn {
            padding: 8px 22px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 119, 255, 0.15));
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .download-btn:hover { background: rgba(0, 212, 255, 0.25); }

        /* ===== LOG BOX ===== */
        .log-box {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 16px;
            padding: 14px 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 130px;
            overflow-y: auto;
        }
        .log-entry {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #666;
            padding: 3px 0;
        }
        .log-entry .time { color: #444; margin-right: 10px; }
        .log-entry.success { color: #00d4ff; }
        .log-entry.error { color: #ff6b6b; }
        .log-entry.info { color: #88ccff; }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .copyright { color: #555; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="logo">🐭м𝓞𝓊ŜⒺ AI</div>
        <div class="subtitle">منصة الذكاء الاصطناعي المجانية المتكاملة</div>
    </div>

    <!-- MODE TABS (Strategy Switcher) -->
    <div class="mode-tabs">
        <button class="tab-btn active" data-mode="image">🖼️ توليد صور (مجاني 100%)</button>
        <button class="tab-btn" data-mode="video">🎬 توليد فيديو (استراتيجية ذكية)</button>
    </div>

    <!-- PROMPT -->
    <div class="form-group">
        <label for="promptInput">📝 الوصف (Prompt)</label>
        <textarea id="promptInput" placeholder="اكتب وصفاً تفصيلياً باللغة الإنجليزية أو العربية للحصول على أفضل نتيجة...">A cinematic view of a futuristic cyber city at night, neon lights, 4k resolution</textarea>
    </div>

    <!-- OPTIONS (Dynamic based on mode) -->
    <div class="options-row" id="imageOptions">
        <div class="option-group">
            <span class="option-label">📐 حجم الصورة</span>
            <div class="option-buttons" id="sizeGroup">
                <button class="opt-btn active" data-value="1024x1024">مربع (1:1)</button>
                <button class="opt-btn" data-value="1280x720">أفقي (16:9)</button>
                <button class="opt-btn" data-value="720x1280">عمودي (9:16)</button>
            </div>
        </div>
    </div>

    <!-- GENERATE BUTTON -->
    <button class="generate-btn" id="generateBtn">
        <span class="btn-text">🚀 ابدأ التوليد المجاني</span>
        <span class="spinner"></span>
    </button>

    <!-- RESULT CONTAINER -->
    <div class="result-wrapper" id="resultWrapper">
        <!-- Media element injected dynamically -->
        <div id="mediaContainer"></div>
        <div class="result-controls">
            <div class="result-label">✨ 🐭м𝓞𝓊ŜⒺ AI <span>• مجاني بالكامل</span></div>
            <button class="download-btn" id="downloadBtn">⬇️ تحميل الملف</button>
        </div>
    </div>

    <!-- LOG -->
    <div class="log-box" id="logBox">
        <div class="log-entry info"><span class="time">[الآن]</span> 🎬 مرحباً بك في مشروعك التقني المجاني الجديد!</div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
        <span class="copyright">© 2026 🐭м𝓞𝓊ŜⒺ AI • Powered by Free Strategy</span>
    </div>
</div>

<script>
    (function() {
        'use strict';

        const promptInput = document.getElementById('promptInput');
        const generateBtn = document.getElementById('generateBtn');
        const logBox = document.getElementById('logBox');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const resultWrapper = document.getElementById('resultWrapper');
        const mediaContainer = document.getElementById('mediaContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        const sizeGroupBtns = document.querySelectorAll('#sizeGroup .opt-btn');

        let currentMode = 'image'; // image or video
        let selectedSize = '1024x1024';
        let currentResultUrl = null;

        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            entry.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Tab Switching Strategy
        tabBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                tabBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentMode = this.dataset.mode;
                
                if (currentMode === 'image') {
                    generateBtn.querySelector('.btn-text').textContent = '🚀 توليد الصورة مجاناً';
                    addLog('🔄 تم الانتقال إلى وضع: توليد الصور المجاني', 'info');
                } else {
                    generateBtn.querySelector('.btn-text').textContent = '🎬 توليد الفيديو (الاستراتيجية الذكية)';
                    addLog('🔄 تم الانتقال إلى وضع: توليد الفيديوهات الذكي', 'info');
                }
            });
        });

        // Size Options
        sizeGroupBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                sizeGroupBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedSize = this.dataset.value;
            });
        });

        // Generate Logic
        generateBtn.addEventListener('click', async function() {
            const prompt = promptInput.value.trim();
            if (!prompt || prompt.length < 3) {
                addLog('❌ يجدر بك كتابة وصف أوضح (3 أحرف على الأقل)', 'error');
                return;
            }

            generateBtn.classList.add('loading');
            generateBtn.disabled = true;
            resultWrapper.classList.remove('show');
            mediaContainer.innerHTML = '';

            if (currentMode === 'image') {
                // --- استراتيجية الصور المجانية الفورية ---
                addLog('🎨 جاري معالجة وتوليد الصورة عبر الشبكة المجانية...', 'info');
                const [width, height] = selectedSize.split('x');
                const encodedPrompt = encodeURIComponent(prompt);
                const imageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=${width}&height=${height}&nologo=true&private=true`;

                const img = document.createElement('img');
                img.src = imageUrl;
                img.alt = 'Generated AI Image';
                
                img.onload = function() {
                    mediaContainer.innerHTML = '';
                    mediaContainer.appendChild(img);
                    resultWrapper.classList.add('show');
                    currentResultUrl = imageUrl;
                    addLog('✅ تم إنشاء الصورة بنجاح!', 'success');
                    resetBtn();
                };
                img.onerror = function() {
                    addLog('❌ تعذر تحميل الصورة، حاول مرة أخرى.', 'error');
                    resetBtn();
                };

            } else {
                // --- استراتيجية الفيديوهات الذكية المجانية ---
                // بما أن الفيديوهات تتطلب حوسبة عالية، الاستراتيجية الذكية المجانية هنا 
                // هي توفير محركات بديلة أو استخدام توليد إطارات متحركة / روابط GIF/MP4 ذكية، 
                // أو توجيه خوارزمية العرض لإنشاء فيديوهات قصيرة مجانية.
                addLog('⚙️ جاري تطبيق الاستراتيجية الذكية للفيديو...', 'info');
                
                setTimeout(() => {
                    // نموذج محاكي ذكي يربط البرومبت بخدمات GIF/Video مجانية أو بديلة متاح تصفحها
                    // يمكنك ربطها لاحقاً بأي API مجاني تملكه
                    addLog('💡 نصيحة: لتوليد فيديو احترافي مجاني بدون حدود، يمكنك تحويل الصورة الناتجة إلى فيديو عبر أدوات الـ Animation المجانية.', 'info');
                    
                    // سنقوم بعرض نموذج فيديو تجريبي ذكي كمثال للتكامل
                    const videoUrl = 'https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-numbers-31910-large.mp4';
                    
                    const video = document.createElement('video');
                    video.src = videoUrl;
                    video.controls = true;
                    video.autoplay = true;
                    video.loop = true;

                    mediaContainer.innerHTML = '';
                    mediaContainer.appendChild(video);
                    resultWrapper.classList.add('show');
                    currentResultUrl = videoUrl;
                    addLog('✅ تم تجهيز الفيديو بنجاح عبر الاستراتيجية المجانية!', 'success');
                    resetBtn();
                }, 2000);
            }
        });

        function resetBtn() {
            generateBtn.classList.remove('loading');
            generateBtn.disabled = false;
        }

        // Download Action
        downloadBtn.addEventListener('click', function() {
            if (!currentResultUrl) return;
            const a = document.createElement('a');
            a.href = currentResultUrl;
            a.target = '_blank';
            a.download = `MouseAI_${Date.now()}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            addLog('⬇️ بدء عملية التنزيل بنجاح...', 'info');
        });

    })();
</script>

</body>
</html>
