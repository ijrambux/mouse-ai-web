<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>MOUSE AI</title>
    <style>
        /* === RESET & BASE === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #05315c, #010612 75%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            position: relative;
            overflow-x: hidden;
        }

        /* === خلفية النجوم المتساقطة === */
        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 15px #00cfff, 0 0 30px #00cfff;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translate(-200px, 110vh);
                opacity: 0;
            }
        }

        /* === الحاوية الرئيسية === */
        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        /* === الشعار === */
        .logo {
            position: relative;
            font-size: clamp(42px, 10vw, 80px);
            font-weight: 900;
            letter-spacing: 6px;
            color: transparent;
            background: linear-gradient(90deg, #fff, #bff8ff, #00d9ff, #fff, #00d9ff, #bff8ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: water 5s linear infinite, pulse 2s ease-in-out infinite;
            filter: drop-shadow(0 0 15px #00cfff) drop-shadow(0 0 40px #00cfff) drop-shadow(0 0 80px #008cff);
            text-align: center;
            width: 100%;
            padding: 10px 0;
            user-select: none;
        }

        .logo::before {
            content: "";
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: clamp(200px, 40vw, 350px);
            height: clamp(200px, 40vw, 350px);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 220, 255, 0.35), transparent 70%);
            filter: blur(40px);
            z-index: -1;
            animation: aura 4s infinite alternate;
        }

        .logo::after {
            content: "";
            position: absolute;
            top: 0;
            left: -60%;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-30deg);
            animation: shine 4s infinite;
            pointer-events: none;
        }

        @keyframes water {
            to {
                background-position: 300% 0;
            }
        }
        @keyframes shine {
            to {
                left: 160%;
            }
        }
        @keyframes aura {
            0% {
                transform: translate(-50%, -50%) scale(0.9);
                opacity: 0.6;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }

        /* === إطار المقال (قابل للتمرير) === */
        .article-wrapper {
            width: 100%;
            max-width: 950px;
            background: rgba(255, 255, 255, 0.04);
            border: 2px solid rgba(0, 191, 255, 0.5);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            padding: 6px;
            transition: all 0.3s ease;
        }

        .article-wrapper:hover {
            border-color: #00d9ff;
            box-shadow: 0 20px 70px rgba(0, 200, 255, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .article-scroll {
            max-height: 55vh;
            overflow-y: auto;
            padding: 30px 35px;
            scroll-behavior: smooth;
            border-radius: 20px;
        }

        /* تخصيص شريط التمرير */
        .article-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .article-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .article-scroll::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00bfff, #008cff);
            border-radius: 10px;
        }
        .article-scroll::-webkit-scrollbar-thumb:hover {
            background: #00d9ff;
        }

        /* === محتوى المقال === */
        .article-content {
            font-size: clamp(18px, 2.2vw, 24px);
            line-height: 2.3;
            text-align: center;
            color: #e8f4ff;
        }

        .article-content p {
            margin-bottom: 22px;
        }

        .article-content .highlight {
            color: #00d9ff;
            font-weight: 600;
        }

        .article-content .slogan {
            font-size: clamp(26px, 4vw, 38px);
            color: #00d9ff;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
            margin: 18px 0 12px;
        }

        .article-content .signature {
            margin-top: 25px;
            font-size: clamp(18px, 2vw, 24px);
            color: #aac8e0;
            border-top: 1px solid rgba(0, 191, 255, 0.2);
            padding-top: 20px;
        }

        .article-content .signature span {
            color: #00d9ff;
            font-weight: 700;
        }

        /* === زر التواصل الاحترافي (X) === */
        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: linear-gradient(135deg, rgba(0, 191, 255, 0.15), rgba(0, 100, 255, 0.08));
            border: 2px solid rgba(0, 191, 255, 0.4);
            color: #fff;
            padding: 18px 45px;
            font-size: clamp(18px, 2vw, 22px);
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-decoration: none;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* تأثير التوهج الخلفي للزر */
        .social-btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 60px;
            background: linear-gradient(135deg, #00d9ff, #008cff, #00d9ff);
            background-size: 300% 300%;
            opacity: 0;
            z-index: -1;
            transition: all 0.6s ease;
            animation: gradientMove 3s ease infinite;
        }

        .social-btn:hover::before {
            opacity: 1;
        }

        @keyframes gradientMove {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .social-btn:hover {
            transform: translateY(-4px) scale(1.03);
            border-color: transparent;
            box-shadow: 0 12px 50px rgba(0, 191, 255, 0.4), 0 0 80px rgba(0, 191, 255, 0.15);
            color: #fff;
        }

        .social-btn:active {
            transform: scale(0.96);
        }

        /* أيقونة X داخل الزر */
        .x-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .social-btn:hover .x-icon {
            transform: rotate(10deg) scale(1.1);
            background: #010612;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
        }

        .x-icon svg {
            width: 22px;
            height: 22px;
            fill: #010612;
            transition: fill 0.3s ease;
        }

        .social-btn:hover .x-icon svg {
            fill: #fff;
        }

        /* النص داخل الزر مع تأثير */
        .btn-text {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-text .username {
            color: #00d9ff;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .social-btn:hover .btn-text .username {
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        /* === التذييل البسيط === */
        .footer {
            text-align: center;
            font-size: clamp(13px, 1.3vw, 16px);
            color: rgba(255, 255, 255, 0.3);
            line-height: 1.6;
            letter-spacing: 0.5px;
            margin-top: 5px;
            width: 100%;
        }

        .footer .handle {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 500;
            display: block;
        }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            .article-scroll {
                padding: 20px 18px;
                max-height: 50vh;
            }
            .article-content {
                line-height: 2.1;
            }
            .social-btn {
                padding: 15px 32px;
                gap: 12px;
                width: 100%;
                max-width: 400px;
            }
            .x-icon {
                width: 32px;
                height: 32px;
            }
            .x-icon svg {
                width: 19px;
                height: 19px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .article-scroll {
                padding: 16px 14px;
                max-height: 45vh;
            }
            .article-content {
                font-size: 17px;
                line-height: 2;
            }
            .social-btn {
                padding: 13px 24px;
                font-size: 16px;
                gap: 10px;
                max-width: 100%;
            }
            .x-icon {
                width: 28px;
                height: 28px;
            }
            .x-icon svg {
                width: 16px;
                height: 16px;
            }
            .container {
                gap: 20px;
            }
        }

        @media (min-width: 1200px) {
            .article-scroll {
                max-height: 65vh;
                padding: 40px 50px;
            }
        }

        /* تحسينات إضافية */
        .glow-text {
            text-shadow: 0 0 40px rgba(0, 200, 255, 0.15);
        }

        .container,
        .article-wrapper,
        .footer {
            overflow: visible;
            max-width: 100%;
        }

        /* تأثير نبض خفيف للزر */
        @keyframes btnPulse {
            0%,
            100% {
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 8px 40px rgba(0, 191, 255, 0.2), 0 0 60px rgba(0, 191, 255, 0.05);
            }
        }

        .social-btn {
            animation: btnPulse 3s ease-in-out infinite;
        }

        .social-btn:hover {
            animation: none;
        }
    </style>
</head>
<body>

    <!-- ===== النجوم ===== -->
    <div id="stars"></div>

    <!-- ===== الحاوية الرئيسية ===== -->
    <div class="container">

        <!-- ===== الشعار ===== -->
        <div class="logo">🐭 MOUSE AI</div>

        <!-- ===== إطار المقال (قابل للتمرير) ===== -->
        <div class="article-wrapper">
            <div class="article-scroll">
                <div class="article-content">

                    <p>
                        سنتطور مع أول إرهاصات التوقف عن<br />
                        <span class="highlight">الشيتة</span>، تضخيم التفاهات، تدشين المشاريع الصغيرة<br />
                        على أنها إنجازات تاريخية، وتحويل كل حدث عادي<br />
                        إلى ملحمة إعلامية.
                    </p>

                    <p style="color: #aac8e0; font-size: 0.9em;">
                        أما قبل ذلك... فسيظل شعار المرحلة
                    </p>

                    <div class="slogan">بعاد... بعاد... بعاد</div>

                    <div class="signature">
                        ✍ <span>🐭 MOUSE AI</span>
                    </div>

                </div>
            </div>
        </div>

        <!-- ===== زر التواصل الاحترافي (X) ===== -->
        <a href="https://x.com/mouse0000000" target="_blank" class="social-btn" onclick="shareX(event)">
            <span class="x-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </span>
            <span class="btn-text">
                تواصل معي على <span class="username">@mouse0000000</span>
            </span>
        </a>

        <!-- ===== التذييل البسيط ===== -->
        <div class="footer">
            <span class="handle">🐭 MOUSE AI • 2026</span>
        </div>

    </div>

    <script>
        // ===== توليد النجوم =====
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3.5 + 1.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = (Math.random() * -1000) + 'px';
            star.style.animationDuration = (5 + Math.random() * 7) + 's';
            star.style.animationDelay = (Math.random() * 10) + 's';
            star.style.opacity = 0.4 + Math.random() * 0.6;
            starsContainer.appendChild(star);
        }

        // ===== مشاركة على X مع فتح الرابط =====
        function shareX(e) {
            e.preventDefault();
            const text = "سنتطور مع أول إرهاصات التوقف عن الشيتة، تضخيم التفاهات، تدشين المشاريع الصغيرة على أنها إنجازات تاريخية، وتحويل كل حدث عادي إلى ملحمة إعلامية. أما قبل ذلك... فسيظل شعار المرحلة بعاد... بعاد... بعاد 🐭 MOUSE AI";
            const url = encodeURIComponent(window.location.href);

            // فتح نافذة المشاركة
            window.open(
                'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text) + '&url=' + url,
                '_blank',
                'width=600,height=400'
            );

            // أيضًا فتح الرابط الشخصي في تبويب جديد
            setTimeout(() => {
                window.open('https://x.com/mouse0000000', '_blank');
            }, 300);
        }
    </script>

</body>
</html>
