<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOUSE AI - لوحة الإدارة</title>
    <style>
        /* === جميع التنسيقات السابقة للوحة الإدارة === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(circle at 30% 10%, #05315c, #010612 75%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        #stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 6px #fff, 0 0 15px #00cfff, 0 0 30px #00cfff;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100px) translateX(0);
                opacity: 1;
            }
            100% {
                transform: translate(-200px, 110vh);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* === نافذة تسجيل الدخول === */
        .login-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-overlay.hidden {
            display: none;
        }

        .login-box {
            background: radial-gradient(circle at top, #05315c, #010612 80%);
            border: 2px solid rgba(0, 191, 255, 0.3);
            border-radius: 24px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .login-box .login-logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .login-box h2 {
            color: #00d9ff;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .login-box p {
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 25px;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(0, 191, 255, 0.2);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            direction: ltr;
        }

        .login-box input:focus {
            outline: none;
            border-color: #00d9ff;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.1);
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00bfff, #008cff);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-box .login-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(0, 191, 255, 0.3);
        }

        .login-box .login-error {
            color: #ff4444;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* === الهيدر === */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 191, 255, 0.2);
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 900;
            color: transparent;
            background: linear-gradient(90deg, #fff, #bff8ff, #00d9ff, #fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            animation: water 5s linear infinite;
            filter: drop-shadow(0 0 15px #00cfff);
            user-select: none;
            cursor: pointer;
        }

        @keyframes water {
            to {
                background-position: 300% 0;
            }
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: 2px solid rgba(0, 191, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-radius: 30px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn:hover {
            background: #00bfff;
            border-color: #00bfff;
            color: #010612;
            box-shadow: 0 0 30px rgba(0, 191, 255, 0.3);
            transform: translateY(-2px);
        }
